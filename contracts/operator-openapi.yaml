openapi: 3.1.0

info:
  title: Yuvoy Operator API
  version: 1.0.0
  description: >
    The API behind operators.yuvoy.in — the portal an operator uses to run their
    business on Yuvoy.


    **The tenant boundary is the thing to understand before anything else.**
    Every operator sees their own bookings, their own travellers, their own
    earnings. One query that forgets to scope shows a dive shop its
    competitor's customer list, and there is no version of that we recover from.


    So the boundary is structural, not diligent: `operator_id` is read from the
    session row and is **never accepted as a parameter in any position** — not a
    path segment, not a query string, not a body field. You will not find one in
    this document, and its absence is deliberate. A request cannot ask about
    another operator because there is nowhere to put the question.


    A consequence worth stating for client authors: **a row belonging to another
    operator answers `404`, never `403`.** A 403 would confirm the row exists,
    which is precisely what somebody probing ids wants to learn. Do not write
    error handling that distinguishes them, because the server does not.


    **A suspended business signs in, reads everything, and may make only the
    writes the owner left open** (D20, D27, D39 to D42). While an admin has its
    status at `SUSPENDED`, every other write answers `403` with the code
    `account_suspended` and the message "Your account has been suspended.
    Please reach out to admin for help." Show that message as it is, on the
    action that was tapped. The writes that stay open run the trips already
    booked (`POST /bookings/{id}/attendance`,
    `POST /bookings/{id}/cash-collected`, `POST /bookings/{id}/cash-returned`,
    `POST /bookings/{id}/relay`, `POST /slots/{id}/relay`,
    `POST /bookings/{id}/messages` and `POST /bookings/{id}/messages/read`),
    stop a trip
    (`POST /slots/{id}/call-off`, `POST /bookings/{id}/cancel` and
    `POST /requests/{id}/decline`), manage access (`POST /team/{id}/hold`,
    `POST /team/{id}/restore`, `DELETE /team/{id}` and
    `POST /change-requests/{id}/cancel`), send a document
    (`POST /credentials`, `POST /credentials/{id}/upload-intents` and
    `POST /credentials/{id}/upload-intents/{intentId}/complete`), and sign
    out. A business whose status is `OFFBOARDED` or `DISQUALIFIED` is treated
    the same way (D44), and its message is "Your account has been closed.
    Please reach out to admin for help." or "Your account has been
    disqualified. Please reach out to admin for help." `GET /me` carries
    `account.suspension` for as long as it lasts, with anything our staff
    wrote to the business, and all of it lifts on the next request once the
    status is `LIVE` again. An account whose state is offboarded is
    different: it cannot sign in, and its session answers `403` with
    `account_not_active`.

servers:
  - url: https://api.yuvoy.in/operator/v1
    description: Production
  - url: https://dev.api.yuvoy.in/operator/v1
    description: >-
      Development. A second App Runner service with its own database, seeded
      fixtures and the FAKE payment provider — so checkout, capture, refunds and
      cancellation can be exercised end to end without a merchant account and
      without consuming real seats.


      It is called DEV and not staging on purpose. Staging implies a rehearsal
      of production — same shape, same data, a place you trust a green run. This
      is not that: the catalog is fixtures, the database is resettable, and it
      exists to be broken. A green run here means the wiring works, never that a
      release is safe.
  - url: http://localhost:8093/operator/v1
    description: Local development (scripts/e2e-local.sh boots this)

tags:
  - name: auth
    description: >
      Phone-primary, because the people running these businesses answer a phone
      on a boat; email is something they check when they get back, if at all.
  - name: bookings
  - name: capacity
  - name: requests
    description: >
      Request-mode departures. The operator holds the seats; we hold nothing
      until they say yes. Every request has a hard clock, and one that expires
      unanswered is a traveller who was told no by a timer.
  - name: relay
    description: >
      How an operator talks to a traveller now that phone numbers are gone
      (D-018). Facts travel in approved templates; free text stays on the
      status page.
  - name: messages
    description: >
      The conversation on each booking, between the traveller and the business
      (D6). Free text both ways, read by both sides and by our staff, and
      scoped like every booking route: another operator's booking is `404`.
  - name: day
    description: >
      The morning the trip runs. Everything here is designed for one hand on a
      phone at a jetty with poor signal — an endpoint an operator will not use
      in that moment is one that gets done from memory afterwards, and a
      manifest kept from memory disagrees with the boat.
  - name: account
    description: >
      The operator's own account — proving it is really them, changing where
      the money goes, and who else can get in. Everything here is what somebody
      holding a stolen session would go for, and none of it is ever urgent,
      which is what makes the friction affordable.
  - name: media
  - name: money

security:
  - operatorSession: []

paths:
  /auth/signup:
    post:
      operationId: operatorSignUp
      summary: Create an operator account
      description: >-
        An operator creates their own account and can sign in immediately.


        **Signing in is not being sellable.** The account is created at
        `PROSPECT` and cannot be booked by anybody; only an admin decision moves
        it to `LIVE`. So verification still gates every rupee — it has simply
        stopped gating whether somebody can sign in, add their listings and
        prepare while they wait.


        **The response is identical for a number that already has an account.**
        This endpoint is public and unauthenticated; an error saying "already
        registered" would turn it into a checker for whether a given phone
        belongs to a Yuvoy operator. Somebody in that position discovers it by
        asking for a sign-in code, which works — the account they were trying to
        create is the one they already have.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [businessName, name, phone]
              properties:
                businessName:
                  type: string
                  description: What travellers will see.
                name:
                  type: string
                  description: >-
                    The person signing up, and the business's first person: its
                    OWNER, or its ADMIN when `relationship` is `run`.
                relationship:
                  type: string
                  enum: [own, run]
                  description: >-
                    Whether the person signing up owns the business or runs it
                    for its owner (D15). `own` makes them its OWNER. `run` makes
                    them its ADMIN, and the business has no owner until they
                    invite one; changing where it is paid is an owner's alone, so
                    that waits until then.


                    Optional. Absent means `own`, which is what every sign-up
                    meant before the question was asked. Anything else is refused
                    with `400`, before the number is looked at, so the refusal
                    says nothing about whether the number has an account.
                phone:
                  type: string
                  description: E.164. This is what they sign in with.
                  examples: ["+919000000000"]
                email: { type: string }
                source:
                  type: string
                  description: >-
                    Where they came from — `web` for the button on
                    `yuvoy.in/operators`, absent when they arrived at the portal
                    directly. Lands in the operator's `source_tag` as
                    `self_signup:<source>`, so the mechanism stays readable and
                    the suffix says the route.


                    1–32 characters of `a-z 0-9 _ . -`, starting with a letter
                    or digit. Surrounding space is trimmed and case is
                    normalised down, so `Web` and `web` are one source rather
                    than two rows saying the same thing.


                    **Anything else is dropped, never refused** — this endpoint
                    is public and unauthenticated, and turning away a real
                    business because a marketing parameter was malformed would
                    be a bad trade.
                  pattern: "^[a-z0-9][a-z0-9_.-]{0,31}$"
                  examples: ["web"]
      responses:
        "202":
          description: >-
            Accepted. Ask for a sign-in code with the same number next. Returned
            whether or not the account already existed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  next: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/otp:
    post:
      tags: [auth]
      security: []
      summary: Send a sign-in code
      description: >
        **Answers identically for a number we know and one we do not** — same
        status, same body. Anything else is a directory of which businesses work
        with us, queryable by anyone with a phone book, and for the operator
        whose number *is* known it confirms a target worth attacking.


        The challenge is recorded either way, so the endpoint's timing cannot
        become the oracle its body carefully is not.


        Rate-limited per IP. Every request costs an SMS once a sender exists, so
        the limit is a cost control as much as an abuse control.
      operationId: requestOperatorOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  description: E.164, e.g. `+919000000101`
      responses:
        "202":
          description: Always this.
          content:
            application/json:
              schema:
                type: object
                required: [sent, expiresIn]
                properties:
                  sent: { type: boolean }
                  expiresIn: { type: integer, description: Seconds the code stays usable. }
                  devCode:
                    type: string
                    description: >-
                      **Development only.** Present when the service runs
                      outside production so the login flow can be exercised
                      without an SMS account. Never present in production; a
                      client must never depend on it.
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/session:
    post:
      tags: [auth]
      security: []
      summary: Exchange a code for a session
      description: >
        Wrong, expired, used and over-attempted codes all answer `401` with one
        message, for the same reason the request endpoint has one body.


        The returned `operatorId` is for labelling the screen. It is **not
        accepted back** on any request in this document.
      operationId: createOperatorSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string }
                code: { type: string }
                device: { type: string, description: A label the operator recognises. }
      responses:
        "201":
          description: Signed in.
          content:
            application/json:
              schema:
                type: object
                required: [token, user, operatorId]
                properties:
                  token:
                    type: string
                    description: >-
                      Opaque bearer. Present as `Authorization: Bearer <token>`.
                      Sessions are long-lived on purpose (14 days idle, 90
                      absolute): an operator checks a manifest from a phone on a
                      boat with intermittent signal, and forcing a login every
                      few hours means the manifest is not consulted rather than
                      consulted securely.
                  user:
                    type: object
                    properties:
                      id: { type: string }
                      name: { type: string }
                      roles:
                        type: array
                        items: { type: string, enum: [OWNER, ADMIN, MANAGER, STAFF] }
                  operatorId: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccountNotActive" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [auth]
      summary: Sign out
      description: Revokes this session immediately. The token stops working on the next request.
      operationId: deleteOperatorSession
      responses:
        "204": { description: Signed out. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/step-up:
    post:
      tags: [account]
      summary: Send a code to the owner's phone
      description: >
        Elevates this session for ten minutes. The code goes to an **OWNER's**
        number whoever asks — a compromised MANAGER login must not be able to
        both request the elevation and receive the code that grants it.


        An owner who asks is sent their own code, so every owner of a business
        with several can pass it (D31), the code being checked against the
        number of whoever asked. Anybody else's goes to the owner who joined
        first.


        A business with no active owner, whose first person runs it (D15), has
        nobody to send it to. The code goes to no number, `sent` is `false`, and
        no session there can be elevated until an owner has joined. It used to
        go to the asker's own number instead, which made it a confirmation the
        asker sent to themselves.


        Ten minutes is long enough to fill in bank details on a phone with a bad
        keyboard, and short enough that a session left open on a shared laptop
        at a dive shop is not still elevated after lunch.
      operationId: requestOperatorStepUp
      responses:
        "202":
          description: Sent to the owner.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent: { type: boolean }
                  expiresIn: { type: integer }
                  devCode:
                    type: string
                    description: Development only, exactly as on sign-in. Never in production.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccountSuspended" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/step-up/verify:
    post:
      tags: [account]
      summary: Use the code
      description: >
        The elevation is stamped on the session you already hold rather than
        returned as a second token — a client with two credentials keeps the
        elevated one as long as the ordinary one, which is the failure this
        avoids.


        A code raised for one user cannot be spent on another's session, even
        within the same operator. The point of routing it to the owner is that
        the owner decides.
      operationId: verifyOperatorStepUp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200":
          description: Elevated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  steppedUpUntil: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccountSuspended" }

  /logo:
    get:
      tags: [account]
      summary: The business's own mark
      operationId: getOperatorLogo
      responses:
        "200":
          description: >-
            `logoUrl` is absent when there is no logo, and also when image
            hosting is unavailable — a blank string could not tell those apart.
          content:
            application/json:
              schema:
                type: object
                properties:
                  imageId: { type: string }
                  logoUrl: { type: string }
                  uploadedAt: { type: string, format: date-time }
        "202":
          description: >-
            **Recorded for review, not applied.** Returned once the account is
            LIVE: a new mark is looked at before it appears on every reel and
            listing.


            Deliberately carries NO `logoUrl`. The current logo is still the
            live one, and returning the new image's URL would have the portal
            render a logo that is not up yet. The old image is not purged for
            the same reason.
          content:
            application/json:
              schema:
                type: object
                required: [state, next]
                properties:
                  state: { type: string, enum: [in_review] }
                  next: { type: string, description: Say this out loud. }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [account]
      summary: Set the logo to an image you uploaded
      description: >
        Confirms the upload with the image host before saving it. A client that
        says it finished and a file that actually exists are different claims,
        and storing an unconfirmed id produces a card with a broken image —
        worse than the plain one it replaced.


        Replacing a logo deletes the previous image, so changing it ten times
        does not leave ten stored images behind. Editable after go-live, unlike
        the rest of the business details: a logo is presentation, not identity,
        and nothing was verified against it.
      operationId: setOperatorLogo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [imageId]
              properties:
                imageId: { type: string, description: From the upload intent. }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                properties: { logoUrl: { type: string } }
        "400":
          description: The upload has not arrived at the host yet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502":
          description: "`media_unavailable` — the image host could not be reached. Retry safely."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "`media_unavailable` — image hosting is not configured on this service."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /logo/upload-intents:
    post:
      tags: [account]
      summary: Get a one-time URL to upload a logo to
      description: >
        The browser posts the file straight to the image host. Bytes never pass
        through our API, for the same reason video does not.


        Post the file as multipart form-data with the field name `file` to
        `uploadUrl`, then `PUT /logo` with the `imageId`. The slot expires in 30
        minutes: long enough to find a file on a phone over an island
        connection, short enough that a URL captured from a browser is not a
        standing write credential.
      operationId: createLogoUpload
      responses:
        "201":
          description: A slot to upload into.
          content:
            application/json:
              schema:
                type: object
                properties:
                  imageId: { type: string }
                  uploadUrl: { type: string }
                  expiresAt: { type: string, format: date-time }
                  maxBytes: { type: integer, format: int64 }
                  next: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502":
          description: "`media_unavailable` — the image host could not mint a slot. Retry safely."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "`media_unavailable` — image hosting is not configured on this service."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /join/{token}:
    get:
      tags: [account]
      summary: Which business is asking
      description: >
        **One link per business**, not one per invitation — the owner sends the
        same URL to everybody they add.


        Unauthenticated: somebody who is not yet a user has to see who is asking
        before handing over a phone number. It says which business, and nothing
        else: whoever opened the link has not identified themselves yet, so
        there is nobody to tell anything about.


        The link grants nothing on its own.
      operationId: previewJoin
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The business behind the link.
          content:
            application/json:
              schema:
                type: object
                properties:
                  businessName: { type: string }
                  next: { type: string }
        "404":
          description: Not a link we recognise.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /join/{token}/code:
    post:
      tags: [account]
      summary: Send me the code
      description: >
        A number nobody invited is refused **before anything is sent**. That
        this reveals whether a number was invited is deliberate: the alternative
        is a page that fires one-time codes at any phone somebody types, which
        is a free SMS gateway pointed at strangers.


        On success the response says what they are joining as, and — if this
        number already works with another business — names the one they would be
        leaving, so the screen can ask before they accept.
      operationId: requestJoinCode
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, description: E.164. }
      responses:
        "202":
          description: A code is on its way.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent: { type: boolean }
                  businessName: { type: string }
                  role:
                    type: string
                    enum: [OWNER, ADMIN, MANAGER, STAFF]
                    description: >-
                      What accepting makes them. `STAFF` or `OWNER` on an
                      invitation sent since D15; `ADMIN` or `MANAGER` only on one
                      sent before it, which is honoured as it was sent.
                  name: { type: string }
                  leavingBusiness: { type: string }
                  note: { type: string }
                  devCode: { type: string, description: Non-production only. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          description: >-
            No invitation for that number. The message names the business and
            says to ask its owner or an admin to send one — render it, because
            it is the only useful next step.


            `invitation_unavailable` when the number was invited but nobody can
            join the business right now (D43). No code is sent. The message
            names the business and says whom to ask, never why; render it too.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /join/{token}/accept:
    post:
      tags: [account]
      summary: Join the business
      description: >
        If this number already works with another business, the first attempt
        answers **409 `confirmation_required`** — the screen must ask before
        retrying with `confirmLeaving: true`.


        One number works with one business at a time. The previous membership is
        ended and its sessions dropped, so somebody who has left cannot keep
        reading their old employer's manifest from an open tab. That business is
        told somebody has gone, and not told where.
      operationId: acceptJoin
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string }
                code: { type: string }
                confirmLeaving:
                  type: boolean
                  description: >-
                    Required only when `leavingBusiness` came back from the code
                    step. Send it after the person has agreed, never by default.
      responses:
        "201":
          description: >-
            Joined, and signed in. The code they just proved is the proof a
            session needs, and asking for it twice in a row is the same gate
            twice rather than a second one.
          content:
            application/json:
              schema:
                type: object
                properties:
                  joined: { type: boolean }
                  token:
                    type: string
                    description: >-
                      Opaque bearer, the same shape and lifetime
                      `POST /auth/session` returns. Present unless the account
                      itself cannot hold a session, in which case `next` says so
                      and the join still happened.
                  user:
                    type: object
                    properties:
                      id: { type: string }
                      name: { type: string }
                      roles: { type: array, items: { type: string } }
                  operatorId: { type: string }
                  next: { type: string }
        "400":
          description: >-
            `invalid_input`. The number or the code is missing, or this number
            is the only owner or admin at the business it works with now, so
            accepting would leave nobody there who can run it (D15). The message
            says which, and what to do; render it. Deliberately not a `409`:
            every `409` here has meant `confirmation_required`, and confirming
            cannot help with this one.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: >-
            No invitation for that number, or `invitation_unavailable`: the code
            was right, but nobody can join the business right now (D43). Nothing
            changed, and the invitation still works once the business can take
            people on again, for as long as it has left. The message names the
            business and says whom to ask, never why; render it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: >-
            `confirmation_required` — accepting removes them from another
            business and they have not agreed yet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /profile:
    get:
      tags: [account]
      summary: The business behind the account
      operationId: getBusinessDetails
      responses:
        "200":
          description: What we hold, and what is still outstanding.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessDetails" }
        "202":
          description: >-
            **Recorded for review, not applied.** Returned once the account is
            LIVE.


            The current details stay in place until an admin approves. A client
            that renders the submitted values as current is telling the operator
            something that is not yet true — branch on the status code, not on
            the body.
          content:
            application/json:
              schema:
                type: object
                required: [state, next]
                properties:
                  state: { type: string, enum: [in_review] }
                  next: { type: string, description: Say this out loud. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [account]
      summary: Tell us about the business
      description: >
        Legal name, entity type, GSTIN and a registered address — the set an
        invoice and a payout both need. Collected during onboarding rather than
        chased at the first payout run, which is the worst moment to discover an
        operator has no registered address on file.


        A whole document, not a patch of single fields: this is one form filled
        in during onboarding, and partial writes would leave it half-saved in
        ways the completeness check then has to reason about.


        **Self-serve only until the account is LIVE.** After that the verified
        documents were checked against the legal name on file, so changing it
        without anybody looking would make the verification meaningless — the
        response says so via `editable`, and a write on a LIVE account answers
        `202` — recorded for review rather than applied, because the verified
        documents were checked against the name on file.
      operationId: saveBusinessDetails
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [legalName, entityType, addressLine1, locality, region, postalCode]
              properties:
                legalName: { type: string }
                entityType:
                  type: string
                  enum: [sole_proprietor, partnership, llp, private_limited, society, trust]
                gstin:
                  type: string
                  description: >-
                    15 characters, or absent. Deliberately optional — plenty of
                    island operators are under the registration threshold, and
                    demanding a number they cannot legally obtain would block
                    exactly the businesses this marketplace exists for.
                addressLine1: { type: string }
                addressLine2: { type: string }
                locality: { type: string }
                region: { type: string }
                postalCode: { type: string, description: "Six digits." }
                country: { type: string, default: "IN" }
      responses:
        "200":
          description: Saved. The body is the same shape as GET.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessDetails" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "`details_locked` — the account is LIVE; these change by asking us."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /credentials:
    post:
      tags: [account]
      summary: Send us a document we asked for
      description: >
        `GET /me` names what is outstanding and who it is waiting on. This is
        how an operator acts on the half that is waiting on them — until it
        existed the screen named a blocker and then asked them to ring us.


        **Nothing filed here is ever verified.** The state is fixed server-side
        and the operator is taken from the session, so neither verifying your own
        document nor filing one against another operator is expressible in a
        request. Verification is somebody at Yuvoy looking at the document, and a
        self-service path to `verified` would make the credential gate
        decorative.


        Sending the same kind twice replaces the earlier pending one rather than
        stacking beside it: two pending rows for one document is a queue of
        duplicates for whoever checks them.
      operationId: submitCredential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  enum: [directorate_registration, instructor_cert, oxygen, equipment, boat, insurance, bank, gst]
                issuer: { type: string }
                identifier: { type: string }
                issuedOn: { type: string, format: date }
                expiresOn: { type: string, format: date }
                notes: { type: string }
      responses:
        "201":
          description: Filed, and waiting to be checked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  type: { type: string }
                  state: { type: string, enum: [pending] }
                  next: { type: string }
                  replacedPrevious:
                    type: boolean
                    description: An earlier pending document of this kind was superseded.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: >
            `already_current` — we already hold a verified one that is not near
            expiry. Refused rather than filed: a new pending row against an
            operator who is currently selling would take them off sale, so being
            organised early would be punished.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /credentials/{id}/upload-intents:
    post:
      tags: [account]
      summary: Start sending the file behind a document
      description: >
        The document itself, not what it says. `POST /credentials` files the
        type, issuer and expiry; this signs a URL the browser sends the file
        straight to, in a private bucket. The file never passes through this
        API.


        **Only a pending document takes a file.** Once somebody at Yuvoy has
        verified or rejected a document, a new file behind it would change the
        evidence under a decision nobody re-made, so this answers
        `409 document_locked`. File the document again to send a different one.


        The size and the kind are signed into the URL, so the bucket itself
        refuses a file of any other length or content type. Send the file with
        `method` to `uploadUrl`, with every header in `headers` exactly as
        given; the browser sets `Content-Length` from the file. Then call
        `POST /credentials/{id}/upload-intents/{intentId}/complete`.


        `uploadUrl` is **never stored server-side and never logged**: it is a
        credential for writing one file into a private bucket, and it works for
        fifteen minutes.


        PDF, JPEG or PNG, up to 10 MB.
      operationId: createCredentialUploadIntent
      parameters:
        - name: id
          in: path
          required: true
          description: The document's `id`, from `GET /me` or `POST /credentials`.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, contentType, sizeBytes]
              properties:
                filename:
                  type: string
                  description: >-
                    The file's name on the operator's device. Kept to 200
                    characters; a longer one is shortened with its extension kept.
                contentType:
                  type: string
                  enum: [application/pdf, image/jpeg, image/png]
                sizeBytes:
                  type: integer
                  format: int64
                  description: The file's exact size in bytes, which the browser knows. Signed into the URL.
      responses:
        "201":
          description: A URL to send the file to.
          content:
            application/json:
              schema:
                type: object
                required: [intentId, uploadUrl, method, headers, expiresAt, maxBytes, next]
                properties:
                  intentId:
                    type: string
                    description: Names this upload when completing it.
                  uploadUrl:
                    type: string
                    description: Signed for this one file. Never stored and never logged.
                  method: { type: string, enum: [PUT] }
                  headers:
                    type: object
                    description: >-
                      Signed headers to send with the file exactly as given:
                      `Content-Type` and the upload's `x-amz-meta-*` metadata.
                    additionalProperties: { type: string }
                  expiresAt: { type: string, format: date-time }
                  maxBytes: { type: integer, format: int64 }
                  next: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            `document_locked`: the document has already been verified or
            rejected, so the file behind it cannot change. File the document
            again to send a different one.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: "`documents_unavailable`: the document store could not sign an upload just now. Try again."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "`documents_unavailable`: no document store is configured on this service."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /credentials/{id}/upload-intents/{intentId}/complete:
    post:
      tags: [account]
      summary: Record the file once it has arrived
      description: >
        The browser saying it finished is a reason to look, not a fact. This
        asks the bucket what arrived: that the file is there, that it carries
        the metadata only a URL minted here signs into it, that it is the size
        declared, and that its first bytes are the kind its label claims. Only
        then is it the file on record for the document, replacing whichever
        file was there before.


        Called again after it succeeded, it answers the same thing again.


        A file this refuses is closed, and the retention sweep deletes it from
        the bucket. Start a new upload to send another.


        Nothing here verifies the document. It still waits for somebody at
        Yuvoy, who opens the file to decide.
      operationId: completeCredentialUpload
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: intentId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The file is on record.
          content:
            application/json:
              schema:
                type: object
                required: [credentialId, hasFile, filename, sizeBytes, contentType, replacedPrevious, next]
                properties:
                  credentialId: { type: string }
                  hasFile: { type: boolean }
                  filename: { type: string }
                  sizeBytes: { type: integer, format: int64 }
                  contentType: { type: string, enum: [application/pdf, image/jpeg, image/png] }
                  replacedPrevious:
                    type: boolean
                    description: An earlier file on this document stopped being on record.
                  next: { type: string }
        "400":
          description: >
            `document_refused`: the file that arrived is larger than 10 MB, is
            not the size declared, or is not a PDF, JPEG or PNG.
            `details.reason` says which: `too_large`, `size_mismatch` or
            `wrong_kind`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            `upload_not_arrived`: the file has not reached the bucket yet, so
            send it first. `upload_closed`: this upload was refused or replaced,
            so start a new one. `document_locked`: the document was verified or
            rejected while the file was on its way.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: "`documents_unavailable`: the document store could not be asked just now. Try again."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "`documents_unavailable`: no document store is configured on this service."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /credential-requirements:
    get:
      tags: [account]
      summary: The documents a listing in a category needs
      description: >
        What a listing in this category, and optionally this activity type,
        needs your business to hold before it can sell, in your own market, and
        whether you hold each one today. For the listing form, so it can name a
        missing document before the listing is sent rather than after it is
        approved and not selling.


        Read from the same requirements checkout and the feed apply, so a
        document named here is one a listing in this category cannot sell
        without. With no `activityType` the answer is what every activity in
        the category needs between them, which is also what a listing with no
        activity type is held to.


        `satisfied` means a verified copy is in date today. A pending, rejected
        or expired document is not satisfied.


        The market comes from your session. There is no market parameter.
      operationId: getCredentialRequirements
      parameters:
        - name: category
          in: query
          required: true
          description: One of the category keys on `GET /catalog/vocabulary`.
          schema: { type: string }
        - name: activityType
          in: query
          description: >-
            An activity type key in that category, from `GET /catalog/vocabulary`.
            Omit it for the whole category. One that is not in the category is a
            400 rather than an empty answer, which would read as needing nothing.
          schema: { type: string }
      responses:
        "200":
          description: >-
            The documents, in type order. Empty means a listing in this category
            needs none in your market.
          content:
            application/json:
              schema:
                type: object
                required: [category, documents]
                properties:
                  category: { type: string }
                  activityType:
                    type: string
                    description: Present when one was asked about.
                  documents:
                    type: array
                    items:
                      type: object
                      required: [type, satisfied]
                      properties:
                        type:
                          type: string
                          enum: [directorate_registration, instructor_cert, oxygen, equipment, boat, insurance, bank, gst]
                        satisfied: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /change-requests:
    get:
      tags: [account]
      summary: Changes to this account
      operationId: listOperatorChangeRequests
      responses:
        "200":
          description: This operator's account changes, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests:
                    type: array
                    items: { $ref: "#/components/schemas/ChangeRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /change-requests/bank:
    post:
      tags: [account]
      summary: Change where the money goes
      description: >
        Three gates, not one: **OWNER only**, a code sent to an owner's phone
        (`step-up`), and then two 24-hour clocks before anything is live.


        The objection window runs **before** approval so the real owner — who is
        messaged the moment it is raised — can stop it. The cooling window runs
        **after**, so even an approved change is still catchable. An objection
        window closing with nobody objecting does *not* approve anything; it
        moves the request into a human review queue. Auto-approving on silence
        would make the whole design a delay rather than a control.


        Only the **last four digits** of the account number are stored. Nothing
        in this service pays anybody — the payout run does not read from here —
        so holding the full number would be a liability with no matching
        capability. It arrives out of band when a person sets the account up,
        confirming the last four against what the operator sees on their screen.


        One at a time: two open bank changes would mean the second approval
        silently decides which account wins.
      operationId: requestBankChange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accountHolder, accountNumber, ifsc]
              properties:
                accountHolder: { type: string }
                accountNumber: { type: string, description: 9-18 digits. }
                ifsc:          { type: string, description: "Like HDFC0001234." }
                bankName:      { type: string }
      responses:
        "202":
          description: Raised, and the owner has been messaged. Not live.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  state: { type: string }
                  summary: { type: string, description: Masked — last four digits only. }
                  objectionUntil: { type: string, format: date-time }
                  whatHappensNext: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: >
            `step_up_required` — ask for a code first. Also returned to anyone
            who is not an OWNER.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`change_already_in_progress` — cancel the open one first."

          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /change-requests/{id}/cancel:
    post:
      tags: [account]
      summary: Stop a change you did not make
      description: >
        Works during the objection window **and** during cooling. A cooling
        change nobody can stop is just a slower mistake.


        Deliberately **not** behind step-up. The person most likely to need this
        is the owner who just received a warning about a change they did not
        make, and making them pass another code first puts the emergency brake
        further away than the accelerator.


        An OWNER or an ADMIN may stop one (D33), because stopping a change moves
        no money. Raising one stays with an owner.
      operationId: cancelChangeRequest
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Stopped. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: OWNER or ADMIN only.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            `change_already_decided` — it has already gone through. Distinguished
            from 404 on purpose: "we cannot find it" and "it already happened"
            mean very different things to somebody who has just realised their
            account was compromised.

          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /team:
    get:
      tags: [account]
      summary: Who can get in
      description: Active people and unaccepted invitations, in one list.
      operationId: listOperatorTeam
      responses:
        "200":
          description: The team.
          content:
            application/json:
              schema:
                type: object
                properties:
                  team:
                    type: array
                    items: { $ref: "#/components/schemas/TeamMember" }
                  joinUrl:
                    type: string
                    description: >-
                      The business's own join link, present only for a caller who
                      can invite. Show it to copy: on an island the person doing
                      the inviting is usually standing next to the person being
                      invited, and a link they can paste beats waiting for one to
                      arrive.


                      The same URL for everybody this business adds. It grants
                      nothing on its own — the number must already have been
                      invited.
                  joinNote: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [account]
      summary: Invite somebody
      description: >
        OWNER or ADMIN. **Everybody joins as `STAFF`, except an owner** (D15).
        The role somebody should have is given once they have joined, with
        `PUT /team/{id}/role`, by an OWNER or an ADMIN.


        `OWNER` is the exception, and an ADMIN may invite an owner as well as an
        OWNER may. A business whose first person runs it has no owner until
        somebody invites one, or makes somebody already on the team its owner
        with `PUT /team/{id}/role` (D31).


        An invitation for `ADMIN` or `MANAGER` is sent, not refused. The response
        says `role: STAFF` and carries a `note` saying so, because a portal built
        before D15 still offers those roles and the person inviting must be told
        what will actually happen. `role` may be left out, which is `STAFF`.


        A number already on this team is refused with the same message as any
        other failure, and a number that works with another business is invited
        exactly as a new number would be, so this endpoint cannot be used to find
        out which businesses are on Yuvoy. The person holding that phone is asked
        to confirm they are leaving when they accept.


        Re-inviting the same number replaces the open invitation rather than
        adding one, so a revoked invite is not undone by an older code still
        lying around.
      operationId: inviteOperatorUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, name]
              properties:
                phone: { type: string }
                name:  { type: string }
                role:
                  type: string
                  enum: [OWNER, ADMIN, MANAGER, STAFF]
                  description: >-
                    What the person inviting would like them to be. `OWNER` joins
                    as an owner. Anything else, or nothing, joins as `STAFF`.
      responses:
        "202":
          description: Sent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent: { type: boolean }
                  role:
                    type: string
                    enum: [OWNER, STAFF]
                    description: What accepting will make them.
                  note:
                    type: string
                    description: >-
                      Present when `role` is not the role that was asked for, and
                      says so: they join as staff, and their role can be changed
                      once they have joined. Show it to the person inviting.
                  joinUrl:
                    type: string
                    description: >-
                      The business's join link, returned so the inviter can pass
                      it on themselves. The same URL for everybody this business
                      adds, and the same one shown on `GET /team`.


                      We queue a message too, but on an island the person doing
                      the inviting is usually standing next to the person being
                      invited.
                  devCode: { type: string, description: Development only. }
        "400":
          description: >-
            `invalid_input`: the number is not in E.164. `invalid_role`: `role`
            is not a role on a team, and `details.allowed` lists the four.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: OWNER or ADMIN only.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`cannot_invite` — one message for every failure, deliberately."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /team/accept:
    post:
      tags: [account]
      security: []
      summary: Accept an invitation
      description: >
        Unauthenticated, because accepting an invitation is what somebody does
        before they have an account. Scoped by the invite code: hashed,
        attempt-limited, seven-day expiry.


        **Signs them in.** The code they have just proved is the same proof a
        session needs, so this answers with one — the same `StartSession` call
        sign-in makes, with the same refusals. Both doors into a team agree
        about what accepting gets you.
      operationId: acceptOperatorInvite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string }
                code:  { type: string }
      responses:
        "201":
          description: Accepted, and signed in.
          content:
            application/json:
              schema:
                type: object
                properties:
                  joined: { type: boolean }
                  token:
                    type: string
                    description: >-
                      Opaque bearer, the same shape and lifetime
                      `POST /auth/session` returns. Present unless the account
                      itself cannot hold a session, in which case `next` says so
                      and the join still happened.
                  user:
                    type: object
                    properties:
                      id: { type: string }
                      name: { type: string }
                      roles: { type: array, items: { type: string } }
                  operatorId: { type: string }
                  next: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: >-
            `invitation_unavailable`: the code was right, but nobody can join
            the business right now (D43). Nothing changed, and the invitation
            still works once the business can take people on again, for as long
            as it has left. The message says whom to ask, never why; render it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /team/{id}/role:
    put:
      tags: [account]
      summary: Change what somebody can do
      description: >
        The role is **replaced**, not added to. The screen driving this is a
        choice of one, so "Manager" means "manager, and not the other thing" —
        an endpoint that quietly left a second role attached would grant more
        than the person choosing it believed they were granting.


        Their sessions end, so the change is true immediately rather than
        whenever a fourteen-day session happens to lapse.


        `OWNER` is given here too (D31): an OWNER or an ADMIN may make somebody
        already on the team an owner, rather than removing them and inviting them
        back. A new owner gains every owner power, including changing where the
        business is paid (`POST /change-requests/bank`, whose step-up code goes
        to their own phone). An ADMIN who makes somebody an owner cannot change
        that person's access afterwards.


        An OWNER may change anybody's role but their own, another owner's
        included. An ADMIN may change anybody's but their own and an owner's,
        another admin's included. The business keeps at least one active
        OWNER or ADMIN, so a change that would take the last of them out of
        that count is refused.
      operationId: setOperatorUserRole
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [OWNER, ADMIN, MANAGER, STAFF]
      responses:
        "204": { description: "Changed, and signed out everywhere." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: >-
            OWNER or ADMIN only, and an ADMIN cannot change an OWNER's role.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            `cannot_change_access`: your own role, a role that is not one of the
            four, or a change that would leave the business with no active
            OWNER or ADMIN.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /team/{id}/hold:
    post:
      tags: [account]
      summary: Pause somebody's access
      description: >
        Stops them signing in without taking their access away. For the skipper
        who is off for the season, and for access somebody wants stopped today
        and decided about later.


        The row, the role and the history stay; `restore` is one call back.
        Their sessions end immediately, because a hold that waits for a session
        to lapse is not a hold.


        A held number is simply not found by the sign-in code request. It is not
        told it is on hold — that endpoint tells nobody anything about who
        exists.
      operationId: holdOperatorUser
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: "Held, and signed out everywhere." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: >-
            OWNER or ADMIN only, and an ADMIN cannot hold an OWNER.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Not on this team, or not currently working.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: >-
            `cannot_change_access`: your own access, or the last active
            OWNER or ADMIN.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /team/{id}/restore:
    post:
      tags: [account]
      summary: Give held access back
      description: >
        With the role they had. No session is minted and none is returned: the
        ones they held were revoked when the hold went on, and coming back means
        signing in.
      operationId: restoreOperatorUser
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Working again. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: >-
            OWNER or ADMIN only, and an ADMIN cannot restore an OWNER. A held
            owner was held by another owner, and undoing that is an owner's to
            do.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Not on this team, or not on hold.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`cannot_change_access` — including your own access."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /team/{id}/notifications:
    get:
      tags: [account]
      summary: Somebody else's notification switches
      description: >
        OWNER or ADMIN, for anybody at the business, owners and other admins
        included. The owner decided it in those terms: an owner and an admin
        control everybody's switches, and each person controls their own. That
        is wider than the access routes beside it on purpose. Nothing here grants
        or removes access, and no switch exists that could silence a security
        warning.


        Somebody at another business answers 404, exactly as an id that does not
        exist. Anybody reads their own at `GET /me/notifications`.
      operationId: getTeamMemberNotificationSwitches
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Every switch this person has, on or off.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: >-
            OWNER or ADMIN only, or the account itself cannot act right now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [account]
      summary: Change somebody else's notification switches
      description: >
        OWNER or ADMIN, for anybody at the business, owners included. Only the
        switches named change, and the answer carries all of them. Setting a
        switch to the value it already has records nothing, so `changedBy` stays
        the last person who actually changed it.


        The person sees who changed it, and can change it back at
        `PUT /me/notifications`: each person keeps control of their own.
      operationId: setTeamMemberNotificationSwitches
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationSwitchChanges" }
      responses:
        "200":
          description: Changed. Every switch this person has, as they now stand.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
        "400":
          description: >-
            No switch named, one named twice, one without `on`, or a name that is
            not a switch. The message lists the switches that exist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: >-
            OWNER or ADMIN only, or the account itself cannot act right now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /team/{id}:
    delete:
      tags: [account]
      summary: Remove somebody
      description: >
        Their sessions are revoked in the same transaction. Marking a user
        removed while leaving a 14-day session alive is the difference between
        "we removed them" and "we removed them a fortnight from now", and the
        reason somebody is removed in a hurry is usually that the fortnight
        matters.


        You cannot remove yourself, an ADMIN cannot remove an OWNER, and nobody
        can remove the last active OWNER or ADMIN: a business with neither has
        nobody who can invite, change a role or remove anybody (D15).
      operationId: removeOperatorUser
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: "Removed, and signed out everywhere." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: OWNER or ADMIN only, and an ADMIN cannot remove an OWNER.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`cannot_change_access`: yourself, or the last active OWNER or ADMIN."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /me:
    get:
      tags: [auth]
      summary: Who am I and what may I do
      operationId: getOperatorMe
      responses:
        "200":
          description: The signed-in user.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  name: { type: string }
                  roles: { type: array, items: { type: string } }
                  operatorId: { type: string }
                  slug:
                    type: string
                    description: >-
                      The business's own web address on the traveller app —
                      `app.yuvoy.in/o/{slug}`. Sent so a link to the public page
                      can be built rather than guessed; a guessed address is
                      somebody else's business on the day it is wrong.

                      Always present. `operators.slug` is not null and unique.
                  canManage:
                    type: boolean
                    description: >-
                      OWNER, ADMIN or MANAGER. Capacity, closed dates, earnings
                      and listing edits require it — a staff member who can see
                      today's manifest does not need the margin on it.

                      ADMIN holds it because the role exists for an owner who is
                      off the island: one who could add a manager but not close a
                      date would be a stand-in for nothing.
                  commissionRateBps:
                    type: integer
                    examples: [1500]
                    description: >-
                      The share of the fare Yuvoy keeps on a booking this business
                      makes now, in basis points: 1500 is 15%. Build a "you
                      receive" preview from this rather than from a fixed figure.
                      It is taken on the whole amount the traveller pays.


                      It is this business's own contracted rate when it has one,
                      and the standard rate when it has none, worked out by the
                      same rule that charges the booking. It is frozen onto each
                      booking when the booking is made, at capture for a card
                      payment and at confirmation for cash, so a later change
                      never restates a booking already taken.
                      `GET /commission-owed` reads each cash trip's commission as
                      it was frozen then. Absent where the service was not given a
                      standard rate.
                  account:
                    allOf: [{ $ref: "#/components/schemas/AccountStanding" }]
                    description: >-
                      Why this account can or cannot sell, and who has to move
                      next. Absent means unknown — never "everything is fine".
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccountNotActive" }

  /me/notifications:
    get:
      tags: [account]
      summary: My notification switches
      description: >
        Which messages about the business reach you. Every switch is on until
        somebody turns it off. Anybody may read and change their own; an
        OWNER or ADMIN may also change yours, at `PUT /team/{id}/notifications`,
        and `changedBy` says who did.


        A switch that is off does not make a message vanish: it is recorded as
        not sent, with the reason. Some messages have no switch at all, and
        `alwaysSent` says which.
      operationId: getMyNotificationSwitches
      responses:
        "200":
          description: Every switch, in the order a screen shows them.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccountNotActive" }
    put:
      tags: [account]
      summary: Change my notification switches
      description: >
        Only the switches named change, and the answer carries all of them.
        `on` is required on every switch named: a switch sent without it is
        refused rather than read as off.
      operationId: setMyNotificationSwitches
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationSwitchChanges" }
      responses:
        "200":
          description: Changed. Every switch, as they now stand.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
        "400":
          description: >-
            No switch named, one named twice, one without `on`, or a name that is
            not a switch. The message lists the switches that exist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The account itself cannot act right now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /bookings:
    get:
      tags: [bookings]
      summary: My bookings
      description: >
        Note the absence of an operator parameter. The tenant comes from the
        session.


        **Soonest trip first, a page at a time.** Send no paging parameters and
        you get the first hundred, which is what this list always returned, and
        `complete` says whether that was all of them. To continue, pass
        `nextCursor` back as `cursor` with the same `state`, `from` and `to`.
        Stop when there is no `nextCursor`, not when a page comes back short.


        **`from` and `to` are whole days in the market's own clock**
        (Asia/Kolkata in the Andamans), compared with the day the trip runs
        there, and both are inclusive. A trip at 04:00 on the 15th is on the
        15th, although in UTC it leaves on the evening of the 14th.
      operationId: listOperatorBookings
      parameters:
        - { name: state, in: query, schema: { type: string } }
        - name: from
          in: query
          description: The first day to include, in the market's clock.
          schema: { type: string, format: date }
        - name: to
          in: query
          description: The last day to include, in the market's clock.
          schema: { type: string, format: date }
        - name: limit
          in: query
          description: >-
            Bookings per page. None, or a value that is not a whole number above
            zero, gets 100. More than 200 gets 200.
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
        - name: cursor
          in: query
          description: >-
            A previous response's `nextCursor`, sent with the same `state`,
            `from` and `to`. Opaque, so do not construct one. A cursor this list
            did not issue is a `400`.
          schema: { type: string }
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "200":
          description: Bookings for this operator only.
          content:
            application/json:
              schema:
                type: object
                required: [items, complete]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/OperatorBooking" }
                  complete:
                    type: boolean
                    description: >-
                      Told rather than inferred. `true` means nothing comes after
                      this page; `false` always comes with a `nextCursor`.
                  nextCursor:
                    type: string
                    description: Absent when there is nothing after this page.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /bookings/{id}:
    get:
      tags: [bookings]
      summary: One booking
      description: >
        Another operator's booking answers `404`, identically to one that does
        not exist.


        The same booking, field for field, as its row on `GET /bookings`:
        `money`, `cash`, `cancellation`, `screening` and `questions` included,
        because the two read one projection.
      operationId: getOperatorBooking
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The booking.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorBooking" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /bookings/{id}/relay:
    post:
      tags: [relay]
      summary: Tell this traveller something
      description: >
        Operators do not see traveller phone numbers. This is how you reach
        them instead.


        An intent's `detail` travels inside an approved WhatsApp template and
        lands on the traveller's phone. A `note` does not: free text is stored
        against the booking and shown on their status page, and the message
        they receive is a pointer to it. That split is not a limitation to work
        around — unapproved text is undeliverable outside a service window, so
        a "note" that appeared to send as a message would mostly not arrive.


        Sending is throttled per operator, not per user, and counts sends
        rather than recipients.
      operationId: relayToBooking
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RelayRequest" }
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RelayResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            `nobody_to_tell` — this booking is no longer live, so there was
            nobody to send to. Deliberately not a success: "sent to 0 people"
            and "sent" must not look the same.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: "`too_many_updates` — too many relays from this operator this hour."

          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /slots/{id}/relay:
    post:
      tags: [relay]
      summary: Tell everyone on this departure
      description: >
        The same act as the per-booking relay, addressed to every live booking
        on the departure. One send, one batch, one throttle count — telling
        thirty people the boat moved is one act of communication, and counting
        it per recipient would punish the operator with the fuller boat.


        Reaches `converted` bookings and unexpired holds only. A lapsed hold is
        somebody who is not coming, and a declined request is somebody already
        told no.
      operationId: relayToSlot
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RelayRequest" }
      responses:
        "202":
          description: Queued. `recipients` is how many people were reached.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RelayResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`nobody_to_tell` — nobody has a live booking on this departure."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: "`too_many_updates` — too many relays from this operator this hour."

          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /bookings/{id}/messages:
    get:
      tags: [messages]
      summary: The conversation with this booking's traveller
      description: >
        This booking's conversation. Another operator's booking answers `404`,
        identically to one that does not exist.


        **The most recent messages first, a page at a time, oldest first within
        a page.** Pass `nextCursor` back as `cursor` for the messages before a
        page; it is absent when the conversation begins on this page. A message
        that arrives while somebody scrolls is after the first page and never
        inside a later one, so fetch the first page again to see new messages.


        Fetching marks nothing read. `unreadCount` is the traveller's messages
        nobody at the business has marked read; mark them with
        `markOperatorBookingMessagesRead`.


        A message's text is removed a set time after the trip ends (90 days
        unless the service is configured otherwise). The message stays, with who
        wrote it and when, and carries `textRemovedAt` in place of `text`. Show
        it as a message whose text was removed, never as an empty one.
      operationId: getOperatorBookingMessages
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - name: limit
          in: query
          description: >-
            Messages per page. None, or a value that is not a whole number above
            zero, gets 50. More than 200 gets 200.
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          description: >-
            A previous page's `nextCursor`. Opaque, so do not construct one. A
            cursor this conversation did not issue is a `400`.
          schema: { type: string }
      responses:
        "200":
          description: One page of the conversation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingMessageThread" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [messages]
      summary: Write to this booking's traveller
      description: >
        Adds a message to this booking's conversation, signed with the name of
        whoever is signed in, and queues a notice for the traveller: each
        contact on the booking, once for this message, on WhatsApp or email as
        this service can send. The notice says the business wrote about their
        trip and links to their booking, and never carries the text. The
        traveller sees the business's name beside its messages, not the name of
        the person who wrote them.


        Any role can write: whoever is holding the phone answers the question.
        The text is trimmed, keeps its line breaks and is at most 1000
        characters.


        **A message with a phone number, an email address or a link in it is
        refused** `400 invalid_input`, with `details.text` `contact details` and
        `details.contactDetail` saying which: `phone`, `email` or `link`. The
        rule is the traveller's too, and it is D-018 kept in the conversation:
        you do not see a traveller's number, and neither side can type one.
        Nothing is stored, and the refusal names the kind without repeating any
        of the text. A phone number is seven or more digits written close
        together, counted through the spaces, dashes, brackets and dots between
        them, except the digits of a date written like 14.09.2026 or 2026-09-14.
        A link starts `http://`, `https://` or `www.`, or is a word ending
        `.com`, `.in`, `.net`, `.org`, `.io`, `.co` or `.me`, so a full stop
        typed with no space before one of those words reads as a link too. An
        email address is a name, an `@` and a domain with a dot in it.


        Writing stops when the booking is cancelled or declined, and a set time
        after the trip ends (seven days unless the service is configured
        otherwise). After that the conversation can still be read, and a
        message is refused `409 messages_closed` with `details.reason`.
      operationId: sendOperatorBookingMessage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingMessageInput" }
      responses:
        "201":
          description: Written, and the traveller's notice is queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingMessage" }
        "400":
          description: >-
            `invalid_input`, with `details.text` saying why: `required` (nothing
            written, or a body that is not JSON), `too long` (over 1000
            characters), `unprintable` (characters no screen can show), or
            `contact details`, with `details.contactDetail` `phone`, `email` or
            `link`. Nothing was stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            `messages_closed`: the conversation can be read and not written in.
            `details.reason` is `cancelled`, `declined` or `window_closed`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /bookings/{id}/messages/read:
    post:
      tags: [messages]
      summary: Mark this conversation read up to a message
      description: >
        Moves the business's read marker to a message somebody at the business
        was shown, and so to everything before it, and answers what is still
        unread. One marker for the business, not one per person. Named by the
        message rather than "all of it, now", so a message that arrived after
        the screen was drawn stays unread, and a marker never moves back.
      operationId: markOperatorBookingMessagesRead
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingMessageReadInput" }
      responses:
        "200":
          description: What is still unread.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingMessageReadReceipt" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: >-
            No such booking for this operator, or that message is not in its
            conversation. Deliberately indistinguishable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /message-threads:
    get:
      tags: [messages]
      summary: Conversations, most recently active first
      description: >
        Every booking of this operator's with a conversation, the one with the
        latest message first, each with `unreadCount`. No message text.


        **A page at a time, and one walk keeps its order.** The first page fixes
        the moment the walk began and every page of that walk is ordered as of
        that moment, so a conversation written in while you page is neither
        skipped nor shown twice; fetch the first page again to see it move to
        the top. Pass `nextCursor` back as `cursor`, and stop when there is
        none. Unread counts are as of each page.
      operationId: listOperatorMessageThreads
      parameters:
        - name: limit
          in: query
          description: >-
            Conversations per page. None, or a value that is not a whole number
            above zero, gets 50. More than 200 gets 200.
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          description: >-
            A previous page's `nextCursor`. Opaque, so do not construct one. A
            cursor this list did not issue is a `400`.
          schema: { type: string }
      responses:
        "200":
          description: One page of this operator's conversations.
          content:
            application/json:
              schema:
                type: object
                required: [threads, complete]
                properties:
                  threads:
                    type: array
                    items: { $ref: "#/components/schemas/MessageThreadSummary" }
                  complete:
                    type: boolean
                    description: >-
                      Told rather than inferred. `true` means nothing comes after
                      this page; `false` always comes with a `nextCursor`.
                  nextCursor:
                    type: string
                    description: Absent when there is nothing after this page.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /requests:
    get:
      tags: [requests]
      summary: Requests waiting for an answer
      description: >
        Request-mode departures hold nothing until you accept. A request that
        expires unanswered is a traveller told no by a clock.


        Ordered by how soon each expires rather than when it arrived, because
        the queue's job is to stop requests dying — so the one closest to death
        is first. `minutesToAnswer` is computed server-side so every client
        shows the same number.
      operationId: listOpenRequests
      responses:
        "200":
          description: Open requests for this operator only.
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests:
                    type: array
                    items: { $ref: "#/components/schemas/OpenRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /requests/{id}/accept:
    post:
      tags: [requests]
      summary: Grant the seats
      description: >
        This is the moment the seats come into existence. Before it the
        departure could sell nothing; after it, it can sell exactly this party.


        Taken under the departure's row lock, so two staff answering two
        requests on two phones cannot together commit more seats than the boat
        holds. Requires OWNER, ADMIN or MANAGER.


        On success the traveller has an ordinary hold with a clock on it — the
        same thing a direct-booking traveller gets at checkout — and is told to
        pay before it lapses.
      operationId: acceptRequest
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Granted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequestAnswer" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: STAFF cannot commit seats.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            `request_not_open` — already answered, or out of time.
            `grant_ceiling_exceeded` — that would put more people on the
            departure than it physically holds.
            `operator_not_sellable` — new in 0053. Accepting is a sale, so it
            is gated on the same eligibility as every other sale: the business
            is not selling, a kill switch is engaged, the listing lost its
            price, or a required credential lapsed while the request sat
            waiting. The request is deliberately NOT auto-declined, so an
            operator who fixes the gap within the window can still say yes.

          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /requests/{id}/decline:
    post:
      tags: [requests]
      summary: Turn the request down
      description: >
        Cheap on purpose. A decline commits nothing and takes no lock, because
        the failure mode being designed against is an operator who lets
        requests rot rather than saying no.


        `reasonCode` is a closed set. It is for us — an operator who declines
        everything is visible in aggregate — and the traveller reads a sentence
        derived from it, which always states that nothing was charged, because
        in every decline that is true and travellers do not know it.
      operationId: declineRequest
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reasonCode]
              properties:
                reasonCode:
                  type: string
                  enum: [no_capacity, weather, not_operating, party_too_large, unsafe_for_party, other]
                  description: >-
                    One of four separate reason lists, one for each act: this one
                    for declining a request; `POST /slots/{id}/call-off` for
                    calling a departure off; `POST /blackouts` and
                    `POST /slots/{id}/close` for closing dates or one departure;
                    and `POST /experiences/{id}/pause` (or `/withdraw`) for
                    pausing a listing. Each act accepts only its own list. This
                    one is about one party's request: each code chooses the
                    sentence that traveller is sent, which always says nothing was
                    charged, and it is kept on the reservation so their status
                    page can say why.
      responses:
        "200":
          description: Declined.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequestAnswer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: STAFF cannot answer requests.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`request_not_open` — already answered, or out of time."

          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /slots/{id}/manifest:
    get:
      tags: [day]
      summary: Who is coming
      description: >
        Confirmed bookings **and live holds**. A party mid-checkout at 08:40 may
        walk up at 08:55, and a manifest that omits them sends the operator into
        an argument they cannot win — their `state` is `holding` so the
        difference is visible. Lapsed holds, cancellations and declines are
        absent: they are on the record, and the record is not what the operator
        is holding.


        No phone numbers (D-018). `reference` is what matches a walking-up human
        to a row; the traveller has it in every message we send them.


        `?format=csv` returns the same data as a file, deterministically ordered
        so two exports can be diffed — which is exactly what somebody does when
        the head count and the app disagree. The CSV ends with a `TOTAL` row,
        because making somebody add a column of numbers on a dock is how the
        count goes wrong.


        The CSV's columns are `reference`, `name`, `guests`, `state`,
        `arrived`, `arrived_at`, `check` and `answers`. `answers` holds each
        question the listing asks now that the party answered, in the listing's
        order, as `question: answer` with `; ` between them, and is empty when
        there are none. A question not answered yet is left off, and so is an
        answer to a question the listing no longer asks; `questions` on the
        JSON manifest carries both. A cell holding a comma, a quote or a line
        break is quoted as CSV requires.
      operationId: getManifest
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - name: format
          in: query
          schema: { type: string, enum: [json, csv] }
      responses:
        "200":
          description: The departure and everybody on it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Manifest" }
            text/csv:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /bookings/{id}/attendance:
    post:
      tags: [day]
      summary: Tick somebody off, or say how it ended
      description: >
        `arrived` is an observation at the meeting point and is **idempotent** —
        a second tap on a wet phone keeps the first arrival time and is not an
        error somebody has to read while eleven people wait.


        `completed` and `no_show` are terminal outcomes that money hangs off, so
        both are refused before the departure time (`409
        departure_has_not_started`). A trip that completed before it left is a
        number no payout run can be trusted to have derived honestly.


        Re-settling an already-settled booking is refused rather than silently
        overwritten: an operator who marks a no-show as completed by mistake
        needs to see that.
      operationId: markAttendance
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome: { type: string, enum: [arrived, completed, no_show] }
      responses:
        "200":
          description: Recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  outcome: { type: string }
                  arrivedAt: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            `departure_has_not_started` — wait until the trip sets off.
            `not_on_this_departure` — already settled, cancelled or declined.

          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /bookings/{id}/cancel:
    post:
      tags: [day]
      summary: Cancel one booking
      description: >-
        Cancels this one booking on a departure that still runs, refunds **in
        full** whatever the traveller paid online and frees their seats, in one
        transaction. The call-off rule for one party: the roles, the reason list
        and the full refund of `POST /slots/{id}/call-off`, without cancelling
        anybody else. The traveller's message is written in the same
        transaction, on a channel this service can send on; when none can reach
        them it is recorded as unsent.


        A booking to be paid in cash on the day captured nothing online, so it
        is cancelled with nothing to refund, and the traveller is told there is
        nothing to refund. If you had already recorded taking its cash, the
        response carries `cashToGiveBackPaise` and a `note`: that money is with
        you, and it is yours to give back.


        `confirmReference` must equal the booking's own reference; letter case
        and surrounding spaces are ignored. Not a boolean: this cannot be
        undone, and a checkbox is one mis-tap away from the wrong party.


        Only a booking that is still on (`confirmed` or `paid_pending_ops`), on
        a departure that has not left, can be cancelled. Retrying after it
        worked answers `409 already_cancelled` and refunds nothing twice.
        Another business's booking answers `404` before its reference is
        compared. Requires OWNER, ADMIN or MANAGER, the roles that may call a
        departure off.
      operationId: cancelOperatorBooking
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reasonCode, confirmReference]
              properties:
                reasonCode:
                  type: string
                  enum: [weather, equipment, staffing, safety, insufficient_numbers]
                  description: >-
                    Why this party cannot go. The call-off's own list, because
                    cancelling one party is the same act for one booking. It is
                    recorded with the cancellation, shown on the booking as
                    `cancellation.operatorCancelled.reasonCode`, and shown on the
                    traveller's status page as why their booking is off.
                note:
                  type: string
                  maxLength: 500
                  description: >-
                    Kept on the record of the cancellation. Never rendered into a
                    message, the same rule as the relay.
                confirmReference:
                  type: string
                  description: The booking's own reference, typed back.
      responses:
        "200":
          description: Cancelled. The figures are what it cost.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingCancelResult" }
        "400":
          description: >-
            `invalid_reason_code`; `confirmation_required`, when there is no
            reference or it is not this booking's; or a note over 500
            characters.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Only an OWNER, ADMIN or MANAGER can cancel a booking.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            `already_cancelled`: there is nothing left to cancel, and nothing was
            refunded twice. `booking_ended`: it was declined, completed or marked
            a no-show. `departure_started`: the departure has left.
            `refund_already_raised`: part of it has been refunded already, so it
            cannot be cancelled here; ask us to cancel it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /bookings/{id}/cash-collected:
    post:
      tags: [day]
      summary: Record that you took the cash
      description: >
        For a booking the traveller chose to pay for at the counter. Recording
        it moves the booking from `paid_pending_ops` to `confirmed` — for a cash
        booking, you taking the notes IS the confirmation.


        **This is a separate act from marking somebody arrived, deliberately.**
        Somebody can turn up and not pay. If the two were one button, nobody
        could say afterwards which of them actually happened.


        **Idempotent.** A phone that loses signal mid-request and is tapped
        again gets the first tap's answer, with `alreadyRecorded: true`. The
        amount already on the booking is never overwritten: a collection
        reported once is a fact, and a retry must not become a way to restate it.


        Omit `collectedPaise` for the whole fare, which is what happens almost
        every time. Send it only when you took less — a shortfall is recorded as
        you report it, and `shortfallPaise` comes back so a mis-key (300 for
        3000) is visible now rather than in a statement next month.


        Our commission is owed on the **fare**, not on what you chose to take.
        A discount you gave is yours to have given.
      operationId: recordCashCollected
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                collectedPaise:
                  type: integer
                  minimum: 0
                  description: >-
                    Omit for the whole fare. `0` means they were waved on
                    without paying, which is a different statement from not
                    saying.
      responses:
        "200":
          description: Recorded.
          content:
            application/json:
              schema:
                type: object
                required: [collectedPaise, shortfallPaise, collectedAt, state]
                properties:
                  collectedPaise: { type: integer }
                  shortfallPaise:
                    type: integer
                    description: The fare less what you took. Zero almost always.
                  collectedAt: { type: string, format: date-time }
                  state: { type: string, enum: [confirmed] }
                  alreadyRecorded:
                    type: boolean
                    description: This was recorded before; nothing changed.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            `not_on_this_departure` — the booking is cancelled, declined or
            already settled, or the amount is more than the fare, or it was paid
            online and there is nothing to collect.

          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /bookings/{id}/cash-returned:
    post:
      tags: [day]
      summary: Record that you gave the cash back
      description: >-
        For a cancelled booking whose cash you had recorded taking with
        `POST /bookings/{id}/cash-collected`. We refund nothing on a booking
        paid in cash, because that money never reached us, so it is yours to
        give back. This records that you did: all of the cash you recorded
        taking, when, and who in your team recorded it. The booking then shows
        it as `cash.returnedAt` and `cash.returnedPaise`.


        Nothing to send. It cannot be undone, and it is recorded once: a retry
        answers `409 cash_already_returned` and changes nothing. A booking that
        is not cancelled, was paid online, or has no cash recorded as taken
        answers `409 nothing_to_give_back`, with a message that says which.


        Requires OWNER, ADMIN or MANAGER, the roles that may cancel a booking.
        A suspended business can still record it. Another business's booking
        answers `404`.
      operationId: recordCashReturned
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Recorded.
          content:
            application/json:
              schema:
                type: object
                required: [bookingId, reference, returnedPaise, returnedAt]
                properties:
                  bookingId: { type: string }
                  reference: { type: string }
                  returnedPaise:
                    type: integer
                    format: int64
                    description: All of the cash you recorded taking, now recorded as given back.
                  returnedAt: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Only an OWNER, ADMIN or MANAGER can record it (`forbidden`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            `nothing_to_give_back`: the booking is not cancelled, was paid
            online, or has no cash recorded as taken; the message says which.
            `cash_already_returned`: giving the cash back is already recorded,
            so nothing changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /commission-owed:
    get:
      tags: [account]
      summary: What you owe us on cash you have already taken
      description: >
        Commission on completed trips that were paid in cash. We never handled
        that money — the traveller paid you directly — so it cannot come out of
        a payout the way commission on card bookings does. It is a balance
        instead.


        The trips behind the total are listed, and that is the point of the
        screen. A total on its own invites "that cannot be right" and gives
        nobody a way to check.


        A trip appears here only once it is **completed** and you have
        **recorded taking the cash**. A no-show who never paid you owes nobody
        anything.
      operationId: getCommissionOwed
      responses:
        "200":
          description: The balance, and the trips it is made of.
          content:
            application/json:
              schema:
                type: object
                required: [bookings, farePaise, commissionPaise, lines]
                properties:
                  bookings: { type: integer }
                  farePaise:
                    type: integer
                    description: >-
                      What travellers paid you in cash across these trips.
                      Context for the commission, so it reads as a share of
                      something rather than a bill out of nowhere.
                  commissionPaise: { type: integer }
                  lines:
                    type: array
                    items:
                      type: object
                      required: [bookingReference, tripDate, guests, farePaise, commissionPaise]
                      properties:
                        bookingReference: { type: string }
                        tripDate: { type: string, description: "Market-local YYYY-MM-DD." }
                        guests: { type: integer }
                        farePaise: { type: integer }
                        collectedPaise: { type: integer }
                        commissionPaise: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /slots/{id}/offline-sales:
    post:
      tags: [day]
      summary: Seats you sold at the counter
      description: >
        A **report**, not a request, and it is accepted even when it is bad
        news. Refusing it would not un-sell the seats — it would only keep our
        numbers wrong until eleven people and a six-person boat meet at a jetty.


        If the report creates an oversell the response says so plainly, names
        the bookings that lost their seats, and opens an honour incident against
        the operator. This is the one endpoint in the portal that deliberately
        refuses to be reassuring: an operator who taps "I sold 3 at the counter"
        and sees a cheerful tick has not understood what they did to three
        people who paid us.
      operationId: recordOfflineSale
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seats]
              properties:
                seats: { type: integer, minimum: 1, maximum: 200 }
                note: { type: string }
      responses:
        "200":
          description: Recorded. Check `oversold` before showing a success state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OfflineSaleResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccountSuspended" }
        "404": { $ref: "#/components/responses/NotFound" }

  /slots/{id}/call-off:
    post:
      tags: [day]
      summary: This departure cannot run
      description: >
        Cancels the departure, cancels every booking on it, refunds **in full**
        everybody who paid online, releases the holds and tells everybody, in
        one transaction. A booking to be paid in cash on the day has captured
        nothing, so it is cancelled with nothing to refund. Cancelling without
        the refunds would leave people who paid staring at a cancelled trip and
        their money gone.


        Full refunds regardless of the cancellation policy. Those tiers price a
        traveller changing their mind; nobody changed their mind here, and
        applying a 50% tier to somebody whose trip was called off by weather is
        the fastest way to lose a market where every traveller talks to the next
        one at the same guesthouse.


        `confirmSlotId` must equal the departure's own id. Not a boolean: a
        checkbox is one mis-tap on a wet phone away from cancelling a full boat,
        and it cannot be undone. Requires OWNER, ADMIN or MANAGER.
      operationId: callOffDeparture
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reasonCode, confirmSlotId]
              properties:
                reasonCode:
                  type: string
                  enum: [weather, equipment, staffing, safety, insufficient_numbers]
                  description: >-
                    One of four separate reason lists, one for each act: this one
                    for calling a departure off; `POST /requests/{id}/decline`
                    for declining a request; `POST /blackouts` and
                    `POST /slots/{id}/close` for closing dates or one departure;
                    and `POST /experiences/{id}/pause` (or `/withdraw`) for
                    pausing a listing. Each act accepts only its own list. This
                    one is about why the departure itself cannot run: it is
                    recorded with the call-off and shown on each traveller's
                    status page as why the trip is off.
                note:
                  type: string
                  maxLength: 500
                  description: >-
                    Shown on the travellers' status pages. Never rendered into a
                    message — same rule as the relay.
                confirmSlotId: { type: string }
      responses:
        "200":
          description: Called off. The numbers are what it cost.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallOffResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: STAFF cannot call off a departure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`already_called_off` — everybody on it has already been told."

          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /slots:
    post:
      tags: [capacity]
      summary: Add departures
      operationId: createOperatorSlots
      description: >-
        The one thing the capacity screen could not do: create a departure. It
        could change how many seats an existing one held and close a date, so an
        operator wanting a Saturday morning trip had to ask somebody at Yuvoy.


        **One shape covers both cases.** A single departure is a one-day range
        with one time and no weekday filter; a weekly pattern is a longer range
        with `weekdays`. Two endpoints would have been two ways to get the same
        row slightly wrong.


        **Safe to press again.** Dates that already have a departure at that
        time are left alone, so `created: 0` is a legitimate answer and not a
        failure — a retry after a timeout does not sell the same boat twice.


        OWNER, ADMIN or MANAGER only. A listing belonging to another operator answers
        **404**, never 403: "you may not touch that" confirms it is there.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [experienceId, fromDate, times, seats]
              properties:
                experienceId: { type: string }
                fromDate: { type: string, format: date }
                toDate:
                  type: string
                  format: date
                  description: Defaults to `fromDate` — a single day need not be said twice.
                times:
                  type: array
                  items: { type: string, examples: ["07:00"] }
                weekdays:
                  type: array
                  items: { type: integer, minimum: 0, maximum: 6 }
                  description: >-
                    0 is Sunday. Empty means every day in the range, which is
                    what a one-off departure wants.
                seats:
                  type: integer
                  description: >-
                    How many seats are sold to Yuvoy on each departure. For a
                    listing that takes requests nothing is sold in advance: the
                    larger of `seats` and `capacity` is how many people the
                    departure can take, and seats are granted one accepted
                    request at a time.
                capacity:
                  type: integer
                  description: >-
                    What the boat physically holds. Defaults to `seats`; larger
                    when the operator also sells at the jetty.
                durationMinutes: { type: integer, default: 120 }
                cutoffHours:
                  type: integer
                  default: 4
                  description: How long before departure bookings close.
      responses:
        "201":
          description: Departures created. Existing ones on those dates were left alone.
          content:
            application/json:
              schema:
                type: object
                required: [created, onSale]
                properties:
                  created: { type: integer }
                  note: { type: string }
                  onSale:
                    type: boolean
                    description: >-
                      Whether these departures are actually for sale — the
                      LISTING's answer, since there is nothing per-row to say
                      yet.


                      Departures on a draft listing stay creatable, deliberately
                      (D-031 C9): a calendar you cannot fill in before the
                      listing is approved is not a calendar. What was wrong was
                      the silence. Render `notOnSaleDetail` when this is false;
                      **do not** print "they are on sale from now" unconditionally.
                  notOnSaleReason:
                    $ref: "#/components/schemas/NotOnSaleReason"
                  notOnSaleDetail:
                    type: string
                    description: A sentence to render verbatim. Present only when `onSale` is false.
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      tags: [capacity]
      summary: My departures
      description: >
        **Soonest first, a page at a time.** Send no paging parameters and you
        get the first two hundred, which is what this list always returned, and
        `complete` says whether that was all of them. To continue, pass
        `nextCursor` back as `cursor` with the same `from` and `to`. Stop when
        there is no `nextCursor`, not when a page comes back short.


        **`from` and `to` are whole days in the market's own clock**
        (Asia/Kolkata in the Andamans), compared with the day the departure
        leaves there, and both are inclusive. A departure at 04:00 on the 15th
        is on the 15th, although in UTC it leaves on the evening of the 14th.
      operationId: listOperatorSlots
      parameters:
        - name: from
          in: query
          description: The first day to include, in the market's clock.
          schema: { type: string, format: date }
        - name: to
          in: query
          description: The last day to include, in the market's clock.
          schema: { type: string, format: date }
        - name: limit
          in: query
          description: >-
            Departures per page. None, or a value that is not a whole number
            above zero, gets 200, which is also the most one page holds.
          schema: { type: integer, minimum: 1, maximum: 200, default: 200 }
        - name: cursor
          in: query
          description: >-
            A previous response's `nextCursor`, sent with the same `from` and
            `to`. Opaque, so do not construct one. A cursor this list did not
            issue is a `400`.
          schema: { type: string }
      responses:
        "200":
          description: Departures with live sold/remaining counts.
          content:
            application/json:
              schema:
                type: object
                required: [items, complete]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/OperatorDeparture" }
                  complete:
                    type: boolean
                    description: >-
                      Told rather than inferred. `true` means nothing comes after
                      this page; `false` always comes with a `nextCursor`.
                  nextCursor:
                    type: string
                    description: Absent when there is nothing after this page.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /slots/{id}:
    patch:
      tags: [capacity]
      summary: Change how many seats a departure offers
      description: >
        **You cannot reduce a departure below what is already sold.** Not
        "should not" — the database refuses it, because the alternative is a
        traveller with a paid booking and no seat, discovered at a jetty at six
        in the morning.


        Reducing to *exactly* what is sold is allowed: that closes the departure
        without stranding anyone. A refused reduction returns `409` with copy
        telling the operator what to do instead, which clients should render
        verbatim rather than replacing with a generic error.


        Requires OWNER, ADMIN or MANAGER.
      operationId: setSlotCapacity
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seats]
              properties:
                seats:
                  type: integer
                  minimum: 0
                  maximum: 200
                  description: >-
                    Instant-book: the seats sold to Yuvoy, never below what is
                    already sold. A departure that takes requests: how many
                    people it can take, at least 1 and never below what has
                    already been accepted.
      responses:
        "204": { description: Capacity changed. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Would strand travellers who have already paid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /slots/{id}/time:
    patch:
      tags: [availability]
      summary: Move a departure to a different time
      description: >-
        Changes when a departure leaves, **within its own day**, and tells
        everybody booked on it.


        Nothing could do this. `starts_at` had never been changed anywhere, so a
        turned tide meant calling the departure off — refunding everybody — and
        creating a new one. Every traveller then has to rebook, and most do not.


        `ends_at` and the booking cutoff shift by the same amount, because both
        are relationships to the start rather than independent facts.


        **Everyone booked is told, in the same transaction as the move**, using
        the `time_change` update they already receive. If the notice cannot be
        written the move does not happen: a departure that moved silently is
        worse than one that could not move.


        **And each of them may leave for free.** A traveller who booked 09:00
        and cannot make 14:00 did not choose this, so until the departure
        leaves they may cancel and get back everything they paid online,
        whatever the usual 48h/24h tiers say, recorded as `OPERATOR_MOVED_IT`.
        Each of them means everybody on the departure when it moves: every
        booking still on, and every hold still being paid for. Somebody who
        books after the move chose the new time and gets the usual terms, and
        a departure moved twice frees everybody who was on it at either move.
        A booking to be paid in cash on the day paid nothing online, so it
        cancels with nothing to refund.


        Same day only: a move across midnight is not a later departure, it is a
        different one, and it would silently empty one day's calendar and fill
        another's. Add a departure on the other day instead.


        OWNER, ADMIN or MANAGER. Moving a departure spends money.
      operationId: moveDeparture
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [startsAt]
              properties:
                startsAt:
                  type: string
                  format: date-time
                  description: >-
                    The new start, as a full timestamp with offset. Must fall on
                    the same market-local day as the departure it is moving.
                  example: "2026-10-17T14:00:00+05:30"
      responses:
        "200":
          description: Moved, and everybody booked has been told.
          content:
            application/json:
              schema:
                type: object
                required: [startsAt, bookingsTold, note]
                properties:
                  startsAt: { type: string, format: date-time }
                  bookingsTold:
                    type: integer
                    description: >-
                      How many bookings were sent the new time. Zero is normal —
                      an empty departure moves quietly.
                  note:
                    type: string
                    description: >-
                      Say this out loud. It names how many people were told and
                      that, until the departure leaves, anybody booked on it now
                      may cancel and get back everything they paid online, which
                      is the
                      cost of the move an operator should see before repeating
                      it.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            `departure_started` — too close to its start to move; call it off
            instead. `different_day` — the new time is not on the same
            market-local day. `time_taken` — this listing already has a
            departure at that time.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /blackouts:
    post:
      tags: [capacity]
      summary: Close dates to new bookings
      description: >
        **Closing dates is not cancelling people.** This stops new sales and
        reports what the operator still owes travellers — including people
        mid-checkout, whose holds predate the closure and can still complete.


        An operator who assumes closing the calendar cancelled the bookings will
        simply not turn up, so clients must render `note` when
        `existingBookings > 0`.


        The departures it closes are recorded with it, including any that
        another closure had already closed, and `id` in the answer is the
        closure: `POST /blackouts/{id}/reopen` puts back exactly those
        departures, and `GET /blackouts` reads it back.


        Requires OWNER, ADMIN or MANAGER.
      operationId: addBlackout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to, reasonCode]
              properties:
                experienceId: { type: string, description: Omit to close all of this operator's departures. }
                from: { type: string, format: date }
                to: { type: string, format: date }
                reasonCode:
                  type: string
                  enum: [WEATHER, MAINTENANCE, STAFF, PERSONAL, SEASONAL, OTHER]
                  description: >-
                    One of four separate reason lists, one for each act: this one
                    for closing dates, and for closing one departure with
                    `POST /slots/{id}/close`; `POST /requests/{id}/decline` for
                    declining a request; `POST /slots/{id}/call-off` for calling
                    a departure off; and `POST /experiences/{id}/pause` (or
                    `/withdraw`) for pausing a listing. Each act accepts only its
                    own list, and this one is written in capitals. It is kept
                    with the closure and read back by `GET /blackouts`. No
                    traveller is sent it, since closing cancels nobody.
                note: { type: string }
      responses:
        "200":
          description: Dates closed. Nobody was cancelled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClosureReceipt" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    get:
      tags: [capacity]
      summary: Read closures back
      operationId: listOperatorClosures
      description: >-
        Closed dates, single closed departures, and what saving a weekly
        schedule closed (`PUT /experiences/{id}/schedule`), read back: what was
        closed, why, when, and which departures each closure holds. A calendar
        can show a closed day that has no departures on it, and say why a day
        was closed, which it could not while "closed" was only inferred from
        each departure's status.


        **Every closure touching the range**, reopened ones included; those
        carry `reopenedAt`. A departure stays closed while any closure still in
        force holds it.


        **Paged.** Ordered by first day, then by id. Pass `nextCursor` back as
        `cursor` to continue; its absence, with `complete: true`, is the end. Do
        not infer the end from a short page.


        Any operator user may read it.
      parameters:
        - name: from
          in: query
          description: A market day. Only closures whose last day is on or after it.
          schema: { type: string, format: date }
        - name: to
          in: query
          description: A market day. Only closures whose first day is on or before it.
          schema: { type: string, format: date }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          description: From a previous response's `nextCursor`. Opaque; do not construct one.
          schema: { type: string }
      responses:
        "200":
          description: Closures, in order of their first day.
          content:
            application/json:
              schema:
                type: object
                required: [items, complete]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/OperatorClosure" }
                  complete:
                    type: boolean
                    description: >-
                      Told rather than inferred. `false` means there is more to
                      read with `nextCursor`.
                  nextCursor:
                    type: [string, 'null']
                    description: Absent when there is nothing after this page.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /blackouts/{id}/reopen:
    post:
      tags: [capacity]
      summary: Reopen a closure
      operationId: reopenOperatorClosure
      description: >-
        Puts back on sale what this closure took off, and nothing else. A
        departure it holds goes back to open only if it is still closed, has
        not left yet, and no other closure still in force holds it. **A
        called-off departure is never reopened**: its bookings were cancelled
        and everybody who paid online was refunded. Whether a reopened
        departure then sells is decided as for any departure, so read `onSale`
        on `GET /slots` rather than assuming it.


        The same call reopens closed dates, one closed departure, and what saving
        a weekly schedule closed. The closure stays readable afterwards, with
        `reopenedAt`.


        **A closure that has already begun is reopened too.** Its departures
        that have already left stay closed, because they did pass closed, and
        only the ones still to come go back, under the same three conditions.
        The record is kept: the closure keeps its `from` and `to`, and
        `departureIds` still lists every departure it held, including those
        that left while it was in force.


        OWNER, ADMIN or MANAGER. A closure belonging to another operator answers
        **404**.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Reopened. The counts say what moved.
          content:
            application/json:
              schema:
                type: object
                required: [id, reopenedAt, departuresReopened, departuresStillClosed, note]
                properties:
                  id: { type: string }
                  reopenedAt: { type: string, format: date-time }
                  departuresReopened:
                    type: integer
                    description: Departures this put back to open.
                  departuresStillClosed:
                    type: integer
                    description: >-
                      Departures still to come that stay closed, because another
                      closure in force also holds them.
                  note:
                    type: string
                    description: Say this out loud. It gives both counts in words.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            `already_reopened`: this closure was reopened before.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /slots/{id}/close:
    post:
      tags: [capacity]
      summary: Close one departure to new bookings
      operationId: closeOperatorDeparture
      description: >-
        The departure-sized version of closing dates: this departure stops
        selling and the rest of its day does not. **Closing is not cancelling
        people.** The bookings on it still stand, and `note` says so when there
        are any.


        It is a closure like a closed date: `GET /blackouts` reads it back with
        `departureId`, and `POST /blackouts/{id}/reopen` reopens it. Closing a
        departure that is already closed on its own answers with the closure
        that holds it rather than making a second one. A departure whose date
        is closed can still be closed on its own, and then stays closed when
        its date is reopened.


        OWNER, ADMIN or MANAGER. A departure belonging to another operator
        answers **404**.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reasonCode]
              properties:
                reasonCode:
                  type: string
                  enum: [WEATHER, MAINTENANCE, STAFF, PERSONAL, SEASONAL, OTHER]
                  description: >-
                    The list `POST /blackouts` takes for closing dates. It is one
                    of four separate reason lists, one for each act; the others
                    are `POST /requests/{id}/decline` for declining a request,
                    `POST /slots/{id}/call-off` for calling a departure off, and
                    `POST /experiences/{id}/pause` (or `/withdraw`) for pausing
                    a listing. Each act accepts only its own list.
                note: { type: string }
      responses:
        "200":
          description: Closed to new bookings. Nobody was cancelled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClosureReceipt" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            `already_called_off`: the departure is called off, so there is
            nothing to close. `departure_started`: it has already left.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /earnings:
    get:
      tags: [money]
      summary: What I have earned
      description: >
        Summed from figures **frozen at capture**, so a commission change today
        cannot restate what was earned last week. `state` is `provisional` until
        a payout period is locked — say so in the UI, because nobody should plan
        against a number that can still move.


        **What it counts.** Bookings **made** in the window, by the moment each
        booking was made rather than the day its trip runs. `from` and `to` are
        whole days in UTC, and with neither the window is the thirty days up to
        now. It counts bookings that are confirmed, awaiting the operator
        (`paid_pending_ops`), completed or a no-show, trips not yet run
        included. `grossPaise` is what was captured by card, so a cash booking
        adds nothing to it while its commission is still counted in
        `commissionPaise`.


        **It is not what a payout pays.** A payout week pays card trips marked
        complete or a no-show, and what you kept on cancelled card bookings, by
        the day of each departure, Monday to Sunday: read that from
        `GET /settlements/overview` and `GET /settlements`. `state` names a
        payout period only when one exists for exactly the dates this window
        resolves to (its last day is the day after `to`), and even then the
        figures are this count rather than that period's.


        Requires OWNER, ADMIN or MANAGER.
      operationId: getOperatorEarnings
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: Earnings for the window.
          content:
            application/json:
              schema:
                type: object
                properties:
                  from: { type: string, format: date }
                  to: { type: string, format: date }
                  bookings: { type: integer }
                  grossPaise: { type: integer }
                  commissionPaise: { type: integer }
                  refundsPaise: { type: integer }
                  netPaise: { type: integer }
                  state: { type: string, enum: [provisional, open, locked, approved, exported, settled, void] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /settlements/overview:
    get:
      tags: [money]
      summary: The next settlement, the pipeline, cash at the counter, and the season so far
      description: >
        The top of the earnings screen, in one read.


        **A payout week runs Monday to Sunday in your market's clock, and a
        booking belongs to the week its trip took place in**: the day of the
        departure, not the day it was paid for, marked or cancelled. A week can
        be locked for payment from the Monday after it, and three of our people
        lock, approve and send it.


        **What a payout pays.** A card trip marked complete or a no-show is
        paid its fare less our commission and anything refunded: a traveller
        who did not come still paid for the seat you held. A cancelled card booking is paid what you
        kept of it, the fare less every refund, with no commission, because we
        take none on a booking that did not happen; one refunded in full pays
        nothing. A booking is paid with its own week when it has been marked or
        cancelled by the time that week is locked, and otherwise with the next
        week that is locked. Never twice, and never not at all.


        `nextSettlement` is last week while nobody has locked it and it has
        bookings to pay, and this week otherwise. Its figures are what a lock of
        that week would record now, so they can still move until it is locked:
        a trip can be marked complete or a no-show, a booking cancelled, or
        money refunded.


        `pipeline` is card bookings still to run, not yet marked complete or a
        no-show and neither cancelled nor declined, at what they come to after
        commission and refunds. It is **never** part of anything earned. A
        booking leaves the pipeline when its trip is marked complete or a
        no-show, which is when it becomes payable, or when it is cancelled or
        declined, so it is never in the pipeline and a settlement at once. Cash
        bookings are not in it: a cash fare is paid to you on the day and never
        passes through a settlement.


        `paidAtCounter` is your cash bookings still to run, beside the pipeline
        and never in it: their fares, our commission on them, and what you keep.
        None of it is ever in a settlement, because that money is paid to you.
        A cash booking leaves it when its trip is marked complete or a no-show,
        or when it is cancelled or declined. What you owe us on cash you took
        for a trip marked complete is `GET /commission-owed`.


        `seasonToDate` is every payout **sent** since `from`. Today a season is
        the financial year, from 1 April.


        No gateway fee is deducted from any figure here, because no payout
        deducts one.


        Requires OWNER, ADMIN or MANAGER.
      operationId: getSettlementOverview
      responses:
        "200":
          description: The overview.
          content:
            application/json:
              schema:
                type: object
                required: [nextSettlement, pipeline, paidAtCounter, seasonToDate]
                properties:
                  nextSettlement: { $ref: "#/components/schemas/SettlementWeek" }
                  pipeline: { $ref: "#/components/schemas/SettlementPipeline" }
                  paidAtCounter: { $ref: "#/components/schemas/PaidAtCounter" }
                  seasonToDate: { $ref: "#/components/schemas/SeasonToDate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /settlements:
    get:
      tags: [money]
      summary: Past settlements
      description: >
        Your payout periods that have been locked, approved or sent, the most
        recent week first. A week locked and not yet sent is listed with its
        state, because its number is fixed; only a sent one has a statement.


        **Paged.** Pass `nextCursor` back as `cursor` to continue; its absence,
        with `complete: true`, is the end. Do not infer the end from a short
        page.


        Requires OWNER, ADMIN or MANAGER.
      operationId: listSettlements
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          description: >-
            From a previous response's `nextCursor`. Opaque; do not construct
            one. A cursor this list did not issue is a `400`.
          schema: { type: string }
      responses:
        "200":
          description: Settlements, the most recent week first.
          content:
            application/json:
              schema:
                type: object
                required: [items, complete]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Settlement" }
                  complete:
                    type: boolean
                    description: >-
                      Told rather than inferred. `false` means there is more to
                      read with `nextCursor`.
                  nextCursor:
                    type: [string, 'null']
                    description: Absent when there is nothing after this page.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /settlements/{id}:
    get:
      tags: [money]
      summary: One settlement, with the bookings it paid
      description: >
        The lines are the bookings as they were frozen when the period was
        locked, in the order its statement lists them. `adjustmentsPaise` is on
        the settlement and on no line: it is a correction the lock added, such
        as the share of a refund issued after an earlier payout.


        A cancelled card booking you kept money on is a line like any other.
        Its `commissionPaise` is 0, because we take no commission on a booking
        that did not happen, its `refundedPaise` is what went back to the
        traveller, and its `netPaise` is the rest, which is yours. A booking
        refunded in full has no line. A trip marked a no-show is a line like a
        trip marked complete.


        Another business's settlement answers **404**, exactly as one that does
        not exist.


        Requires OWNER, ADMIN or MANAGER.
      operationId: getSettlement
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The settlement and its bookings.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Settlement" }
                  - type: object
                    required: [lines]
                    properties:
                      lines:
                        type: array
                        items: { $ref: "#/components/schemas/SettlementLine" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /settlements/{id}/statement:
    get:
      tags: [money]
      summary: The statement for a payout that has been sent
      description: >
        A CSV with a row per booking (reference, trip date, guests, gross,
        commission, refunded and net, in rupees) and a TOTAL row. A cancelled
        booking you kept money on is a row with a commission of 0.00. It is the same
        file, byte for byte, that our finance team exports for this payout, and
        its sha256 is in the `X-Payout-Sha256` header, so you and we can each
        show we hold the same file. The TOTAL row's net includes any
        adjustment, which has no column of its own, so when there is one the
        rows' nets do not add up to it by exactly `adjustmentsPaise`.


        Only for a payout that has been **sent**. A period locked or approved
        but not yet sent answers `409` `not_settled`. Another business's
        settlement answers **404**.


        Requires OWNER, ADMIN or MANAGER.
      operationId: downloadSettlementStatement
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The statement.
          headers:
            X-Payout-Sha256:
              schema: { type: string }
              description: sha256 of the body, the same as finance's export of this period.
            Content-Disposition:
              schema: { type: string }
              description: >-
                An attachment named for the period it covers, like
                `yuvoy-statement-2026-09-07-to-2026-09-13.csv`.
          content:
            text/csv:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`not_settled`: this payout has not been sent yet, so it has no statement."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /catalog/vocabulary:
    get:
      tags: [listings]
      summary: What may go in a listing's category and destination
      description: >
        The two fields on the create form nobody can guess. Both are enforced
        server-side — the category by a database constraint, the destination by
        a foreign key into your own market — so a list maintained in the client
        would disagree with us the day either changes, and the operator would
        find out as a 400 on the form they had just filled in.


        Scoped to the operator's own market, taken from the session. There is no
        market parameter: destinations from another market are refused on create,
        so offering them would be offering a choice that cannot work.


        Safe to cache for the session. This changes when a destination opens,
        which is rare, and never per operator beyond which market they are in.
      operationId: getCatalogVocabulary
      responses:
        "200":
          description: The allowed values, each with the word a person uses for it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  market:
                    type: object
                    properties:
                      key: { type: string, examples: ["andaman"] }
                      name: { type: string, examples: ["Andaman Islands"] }
                  categories:
                    type: array
                    items: { $ref: "#/components/schemas/VocabularyTerm" }
                  activityTypes:
                    type: array
                    description: >-
                      What a listing actually is, narrowed to this market.


                      Alongside `categories`, never replacing them: the category
                      is what a traveller browses by and the activity type is
                      what the thing IS. A picker must filter this list by the
                      chosen category — the pair is enforced by a composite
                      foreign key, so `scuba` under `food_drink` is a 400.


                      Not an enum anywhere in this contract: the set grows by
                      INSERT and an enum would go stale, exactly as for
                      destinations.
                    items: { $ref: "#/components/schemas/ActivityTypeTerm" }
                  destinations:
                    type: array
                    description: >-
                      Active destinations in this market, in the order a picker
                      should show them. Empty means we have not opened one yet,
                      which is a state worth rendering rather than a failure.
                    items: { $ref: "#/components/schemas/VocabularyTerm" }
                  screeners:
                    type: array
                    description: >-
                      The health screeners a listing's `screenerKey` may name:
                      one entry for each screener that is not retired, in key
                      order. The same read decides which keys a listing write
                      accepts, so every key offered here is accepted and any
                      other key is a 400. An empty `screenerKey` is always
                      allowed and means none.


                      Show `label` to a person and send `key`. The key is an
                      identifier, not display text.


                      Not an enum anywhere in this contract: a screener is a
                      row, added or retired on medical advice rather than by a
                      release. Empty means no screener can be chosen yet.
                    items:
                      type: object
                      required: [key, label]
                      properties:
                        key: { type: string, examples: ["diving_rstc"] }
                        label:
                          type: string
                          description: >-
                            The screener's name as a person reads it, from the
                            newest version of it that is not retired. Never
                            empty.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /experiences:
    get:
      tags: [listings]
      summary: Everything you sell, or are trying to
      description: >
        Drafts included. The catalog has always shown unpublished listings to
        Yuvoy and never to the people who run them, so an operator could not
        read back what we had written on their behalf.
      operationId: listOperatorExperiences
      responses:
        "200":
          description: Your listings.
          content:
            application/json:
              schema:
                type: object
                properties:
                  experiences:
                    type: array
                    items: { $ref: "#/components/schemas/OperatorExperience" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [listings]
      summary: Write a new listing
      description: >
        Lands as a **draft** and reaches nobody. Sending it for review is a
        separate act (`POST /experiences/{id}/revisions`) and approval is what
        publishes it — a listing is a promise to a traveller, and the person
        making the promise is not the person who checks it.


        `slug` is optional; one is proposed from the title if it is omitted.
        A listing without `unitPricePaise` can be saved but cannot be approved,
        which the response reports as `sellable: false`.


        **Two listings may share a title.** Web addresses are unique across the
        whole catalog, so when the address is already taken, by this business
        or any other, the new listing is numbered instead of refused:
        `reef-dive`, then `reef-dive-2`, then `reef-dive-3`. That applies to a
        `slug` sent explicitly too, so the address a listing ends up with may
        differ from the one requested; read it back from the listing. An
        address never changes after creation, including when the title is
        later edited, because shared links and the sitemap depend on it.
      operationId: createOperatorExperience
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, category, destination]
              properties:
                title: { type: string }
                slug:
                  type: string
                  description: >-
                    Optional. Proposed from the title if omitted. Numbered
                    (`-2`, `-3`) when already taken, never refused.
                summary: { type: string }
                description: { type: string }
                category:
                  type: string
                  description: >-
                    The taxonomy is closed and enforced by a database
                    constraint, so a value outside this set is a 400.
                    `GET /catalog/vocabulary` carries the same set with a
                    human label for each.
                  enum: [adventure, nature_wildlife, food_drink, arts_creativity,
                         learning, culture_heritage, wellness, entertainment,
                         community, sports, local_life, events]
                activityType:
                  type: string
                  description: >-
                    What this listing actually is — `scuba`, not `adventure`.


                    The category is market-agnostic and is what a traveller
                    browses by; it cannot describe the business, because in the
                    launch market every water sport is `adventure`. It is also
                    the grain at which we decide which credentials a listing
                    needs, so it has to be able to tell a dive from a beach walk.


                    Deliberately not an enum: the set grows by INSERT and an enum
                    would go stale, exactly as for `destination`. The pairs are
                    on `GET /catalog/vocabulary` under `activityTypes`, each with
                    its parent category, and the pair is enforced by a composite
                    foreign key — `scuba` under `food_drink` is a 400.


                    Optional here so a half-finished draft still saves, and
                    **mandatory before the listing can be published**.
                  examples: ["scuba"]
                destination:
                  type: string
                  description: >-
                    A destination key in your own market. One belonging to
                    another market is refused. The keys for your market are on
                    `GET /catalog/vocabulary`; they are rows rather than a fixed
                    set, so there is no enum here to go stale.
                bookingMode:
                  type: string
                  enum: [allotment, request]
                  default: allotment
                  description: >-
                    **The default changed from `request` to `allotment`
                    (D-031 P5).** The product thesis is paid and confirmed in
                    under sixty seconds, and `request` means the traveller waits
                    for a human — so defaulting to it made every listing an
                    operator wrote fight the thesis. Send `request` explicitly
                    for a listing you want to answer yourself.


                    Existing listings are unchanged, and every existing departure
                    keeps its own copy of the mode, so nothing anybody is holding
                    can be re-moded by this.
                durationMinutes: { type: integer, default: 120 }
                maxPartySize: { type: integer, default: 6 }
                unitPricePaise: { type: integer, format: int64 }
                pricingUnit:
                  type: string
                  enum: [per_person, per_group]
                  description: >-
                    How `unitPricePaise` is charged. **There is no default any
                    more.** Omitting it is recorded as unstated rather than
                    silently answered `per_person`: the phrase is printed beside
                    a rupee figure on the traveller's screen, so a substituted
                    one is us inventing a consumer-facing claim on the operator's
                    behalf.


                    The listing still saves as a draft, and `publishBlockers`
                    then carries `pricingUnit` until somebody states it. Send it
                    explicitly whenever you know it.
                meetingPoint: { type: string }
                inclusions: { type: array, items: { type: string } }
                requirements: { type: array, items: { type: string } }
                safetyNotes: { type: string }
                screenerKey:
                  type: string
                  description: >-
                    Optional. The health screener a traveller answers before
                    paying, or empty for none. The allowed keys are described on
                    `ListingEdit`, and one that is not current is a 400.
                  examples: ["diving_rstc"]
      responses:
        "201":
          description: Created as a draft.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  status: { type: string, enum: [draft] }
                  next: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: >-
            `conflict`. No longer raised for a taken address, which is numbered
            instead. Kept only for the case where no free number could be
            claimed after repeated concurrent collisions; retrying succeeds.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /experiences/{id}/workspace:
    get:
      tags: [listings]
      summary: One listing, its departures and its media, in a single answer
      description: >-
        Everything needed to work on one listing, in one request.


        The pieces have always been separate — the listing here, departures on
        `/slots`, media on `/media` — and building a listing meant fetching the
        whole calendar and the whole media library to find the handful of rows
        that belong to it. On island 4G that is three requests and most of a
        business's data to render one screen.


        `listing.publishBlockers` is what the listing is still missing before it can be
        published, so a form can mark the specific rows rather than saying only
        that something is wrong. `media` carries each item's own state and, for
        anything a reviewer refused, the reason.


        This does not change who may do what. It is a read: the same listing,
        the same departures and the same media each endpoint already returns,
        scoped to one listing and fetched once.
      operationId: getListingWorkspace
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The listing and everything attached to it.
          content:
            application/json:
              schema:
                type: object
                required: [listing, departures, media]
                properties:
                  listing: { $ref: "#/components/schemas/OperatorExperience" }
                  departures:
                    type: array
                    description: >-
                      Its own departures only. Each carries whether a traveller
                      can actually buy that one — a certificate lapsing on
                      Tuesday takes Wednesday off sale and leaves Monday
                      selling, which one badge on the listing cannot say.
                    items: { $ref: "#/components/schemas/OperatorDeparture" }
                  media:
                    type: array
                    description: >-
                      The photographs and clips uploaded for this listing, each
                      with its own state and, where one was refused, why.
                    items: { $ref: "#/components/schemas/OperatorMedia" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /experiences/{id}/schedule:
    get:
      tags: [listings]
      summary: A listing's weekly schedule
      operationId: getListingSchedule
      description: >-
        The weekdays and times this listing runs every week, and the closures
        that close days of the window its departures are made in. The same
        object is `schedule` on the listing.


        **A listing with no schedule says so.** `repeatsWeekly` is false and
        `weekly` is empty. Nothing is inferred from the departures it has, so a
        run of Tuesdays added by date with `POST /slots` is not a schedule.


        Any operator user may read it. A listing belonging to another operator
        answers **404**.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The schedule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListingSchedule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [listings]
      summary: Replace a listing's weekly schedule
      operationId: saveListingSchedule
      description: >-
        Sets, once, the weekdays and times this listing runs every week. Saving
        makes the listing's departures straight away, from now to the end of the
        day 45 days after today in the listing's own market. A daily job then
        makes each new day's departures, so 45 days of them keep coming with no
        end date.


        **The body is the whole schedule.** A weekday and time left out is
        removed, and an empty `weekly` removes the schedule.


        **Removing a weekday and time closes what this schedule made at it.**
        Every departure still to come that this schedule made at a weekday and
        time the save removes, and that has not been called off, is closed to
        new bookings, all in one closure: `departuresClosed` counts them and
        `closureId` is the closure, which `POST /blackouts/{id}/reopen` reopens
        and `GET /blackouts` reads back with the reason `SCHEDULE_CHANGED`.
        Removing the schedule removes every weekday and time, so it closes
        every departure still to come that the schedule made. Closing cancels
        nobody: the bookings on those departures stand.


        **Nothing else a save does changes a departure that already exists.** A
        departure added with `POST /slots`, or one that has been moved with
        `PATCH /slots/{id}/time`, is never closed, even at a removed time.
        Changing a time's seats changes no departure already made; change their
        seats with `PATCH /slots/{id}`. Close one with `POST /slots/{id}/close`
        or whole dates with `POST /blackouts`, or call one off with
        `POST /slots/{id}/call-off`. Render `note`, which says what was closed
        and how to put it back, what still leaves at a removed time, and when
        departures already made keep their seats.


        **Safe to press again.** A time that already has a departure is left
        alone, and so is a time a departure was moved away from, whether that
        departure is open, closed or called off. Saving the same schedule twice
        makes nothing new and closes nothing, and `created: 0` is not a failure.


        **What each departure takes.** It leaves at its weekday and time in the
        market's clock, and its length, largest party and booking cutoff are the
        listing's own when the departure is made. On an instant-book listing
        `seats` are sold to Yuvoy. A listing that takes requests sells nothing in
        advance: `seats` is how many people each departure can take, and seats
        are granted one accepted request at a time.


        **Which listings move forward.** Saving makes departures for this
        listing whatever its state, as `POST /slots` does, and `onSale` says
        whether they sell. The daily job makes departures only for a published
        listing, so a draft's window starts moving forward once it is published.


        OWNER, ADMIN or MANAGER only. A listing belonging to another operator
        answers **404**.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [weekly]
              properties:
                weekly:
                  type: array
                  description: >-
                    Every weekday and time the listing runs, each at most once.
                    Empty removes the schedule.
                  items: { $ref: "#/components/schemas/WeeklyDeparture" }
      responses:
        "200":
          description: Saved. What the schedule now is, and what saving made.
          content:
            application/json:
              schema:
                type: object
                required: [schedule, created, departuresClosed, note, onSale]
                properties:
                  schedule: { $ref: "#/components/schemas/ListingSchedule" }
                  created:
                    type: integer
                    description: Departures this save made. Zero is a legitimate answer.
                  departuresClosed:
                    type: integer
                    description: >-
                      Departures still to come that this schedule had made at the
                      weekdays and times this save removed, now closed to new
                      bookings. Zero is a legitimate answer.
                  closureId:
                    type: string
                    description: >-
                      The one closure holding them, present only when
                      `departuresClosed` is above zero.
                      `POST /blackouts/{id}/reopen` puts them back on sale.
                  note:
                    type: string
                    description: >-
                      Sentences to render verbatim. They say what was added; when
                      this save closed departures, how many, that the bookings on
                      them stand, and to reopen the closure to put them back on
                      sale; when departures added by hand or moved still leave at
                      a removed time, that they were not changed; and when a
                      time's seats changed, that departures already made keep
                      theirs.
                  onSale:
                    type: boolean
                    description: >-
                      Whether this listing's departures sell: the listing's
                      answer, as on `POST /slots`. Render `notOnSaleDetail` when
                      this is false.
                  notOnSaleReason:
                    $ref: "#/components/schemas/NotOnSaleReason"
                  notOnSaleDetail:
                    type: string
                    description: A sentence to render verbatim. Present only when `onSale` is false.
        "400":
          description: >-
            `invalid_input`: a field this body does not take, or entries whose
            weekday, start time or seats cannot be saved. Entry problems come in
            `details`, keyed by where each is, like `weekly[2].startTime`, and
            every entry is checked, so one answer names every bad row.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /experiences/{id}/questions:
    get:
      tags: [listings]
      summary: The questions this listing asks travellers
      description: >-
        What a traveller is asked when booking this listing, in the order they
        are asked. Anybody on the team can read it.


        Another business's listing answers `404`, identically to one that does
        not exist.
      operationId: getListingQuestions
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The questions, in order. An empty list when the listing asks none.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListingQuestions" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [listings]
      summary: Replace the questions this listing asks travellers
      description: >-
        Send the whole list, in the order it should be asked. It takes effect at
        once, with no review, whatever state the listing is in: the next
        traveller to open a published listing is asked exactly this list.


        **Health questions do not belong here.** A listing that needs to know
        about a traveller's health asks through its screener (`screenerKey` on
        the listing), which records only that the party declared themselves
        clear and never what anybody said. Answers to these questions are stored
        unencrypted, shown to your team on the booking and the manifest, and
        shown to Yuvoy staff.


        A question sent back with its `id` and the same `text`, `answerType` and
        `options` keeps that id and every answer to it; its place in the list
        and `required` can change. Changing its `text`, `answerType` or
        `options` makes it a new question with a new id: a traveller who
        answered the old wording keeps that answer, shown with the words they
        saw, and is asked the new one. A question left out is no longer asked,
        and answers already given to it stay on those bookings.


        At most 10 questions. `text` up to 200 characters. A `choice` question
        has 2 to 10 options, each up to 60 characters and different from the
        others ignoring case; the other types have none. Unknown fields are
        refused. A refusal names every problem in `details`, keyed like
        `questions[0].text`.


        `required` is enforced only on a checkout that sends answers: that
        checkout is refused until every required question the listing asks has
        an answer that fits. A checkout that sends no answers is not refused
        over it. Its booking shows the question as not answered yet, and the
        traveller can answer it from their booking link while the booking is
        going ahead and until its departure leaves.


        Only an OWNER, ADMIN or MANAGER can change the list, the same roles
        that change a listing's price and meeting point.
      operationId: replaceListingQuestions
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListingQuestionsInput" }
      responses:
        "200":
          description: The list as saved, with the id of every question, new ones included.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListingQuestions" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /experiences/{id}:
    get:
      tags: [listings]
      summary: One listing, in the shape you can edit
      operationId: getOperatorExperience
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The listing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorExperience" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [listings]
      summary: Save a draft in place
      description: >-
        Writes listing fields straight onto a **draft**, and onto nothing else.


        A listing is built a step at a time — what it is, how it sells, where to
        meet, what to bring — and each step has to be saveable on its own, or a
        reel stalling on island 4G takes the half-written listing with it.
        `POST /experiences/{id}/revisions` cannot hold that: it refuses an edit
        that leaves a mandatory field empty, and it sends a draft for review the
        moment an edit touches something we read.


        So on a draft there is **no completeness check and no review**. Each
        field is still validated, and the answer is the listing as it now
        stands, with `publishBlockers` naming what is still missing so a form can
        mark those rows without asking again.


        **Only a draft.** A submitted listing is what a reviewer is reading and a
        published one is what travellers are booking against, so both answer
        `409` here — change them through `POST /experiences/{id}/revisions`.


        The body is the same closed set of fields a revision takes.
        OWNER, ADMIN or MANAGER only. Sending it to us is
        `POST /experiences/{id}/submit`.
      operationId: saveListingDraft
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListingEdit" }
      responses:
        "200":
          description: Saved. The draft as it now stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorExperience" }
        "400":
          description: >-
            `invalid_input` — a field we do not know (`details.unknownFields`,
            with `details.allowed`), a value that field cannot hold, or a field a
            listing cannot be without sent empty: title, category, destination,
            duration, party size or pricing unit. A draft can change those; it
            cannot go without them.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            `conflict` — the listing is no longer a draft. Change it through
            `POST /experiences/{id}/revisions`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /experiences/{id}/revisions:
    post:
      tags: [capacity]
      summary: Propose a change to a listing
      description: >
        **Never a write to the live listing.** A published listing is what
        travellers are booking against right now, and editing it in place lets a
        price change between somebody reading it and somebody paying.


        Bookings already made are unaffected either way — their terms were
        snapshotted at checkout. Clients should say so, because the obvious
        assumption is the opposite.


        Title, summary, description, category, activity type, destination,
        inclusions, requirements, safety notes and the screener are read before
        they go live.
        Price and its unit, duration, party size, meeting point and booking mode
        are the operator's own and apply at once (D-032.3) — `applied` and
        `inReview` in the answer say which half each field landed in.


        The fields to change. Any subset of `ListingEdit`, and
        **nothing else** — `additionalProperties` is now `false`.


        It used to be `true`, and the body was stored verbatim while
        approval applied a closed list of nine keys that did not match
        it. A key outside that list was accepted, queued, approved and
        silently discarded: the operator was told yes and the listing
        still said the old thing. An unknown key is now a 400 at submit,
        naming every offending key at once, so a form with three bad
        fields is one round trip.


        Every field is applied on approval. Fields marked
        *material* need re-review because they change what somebody is
        buying; fields marked *mandatory* must be present on the listing
        before it can be published, so a revision that leaves one empty
        is refused — at submit with a 400, and at approval with a 409.
      operationId: submitExperienceRevision
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListingEdit" }
      responses:
        "200":
          description: >-
            **Applied. Nothing needed reading.**


            Every field in the edit was one the operator owns, so it is live now
            and no revision was created. `applied` names them; `inReview` is
            empty and `revisionId` is absent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevisionOutcome" }
        "201":
          description: >-
            **Something is with us.** At least one field in the edit is one we
            read before a traveller sees it.


            A MIXED edit lands here too, and the two lists are the point:
            `applied` is already live, `inReview` is not. An operator who
            changed their price and their description in one sitting does not
            have the price wait behind the description — so a client that says
            "submitted" about the whole edit is telling half a lie.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevisionOutcome" }
        "400":
          description: >-
            `invalid_input`, in one of two shapes.


            A key we do not know how to change: `details.unknownFields` lists
            every one, and `details.allowed` lists the whole editable set.


            A revision that would leave the listing unpublishable:
            `details.missing` names the mandatory fields still empty after this
            edit is applied. Refused here, while the form is still open, rather
            than two days later through a rejection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /experiences/{id}/submit:
    post:
      tags: [listings]
      summary: Send a draft for review
      description: >-
        The call that says "this is ready for somebody at Yuvoy to read".


        Saving a draft with `PATCH /experiences/{id}` sends nothing to anybody;
        this does. The completeness check runs here, once, and a draft still
        missing something is refused with every missing field named — while the
        form is open, rather than days later through a rejection.


        On success the listing is `in_review` and is in the admin review queue
        straight away. It is not on sale: a person puts it there.


        A listing already `in_review` answers `200` with itself, so a double tap
        is neither an error nor a second place in the queue.
        OWNER, ADMIN or MANAGER only.
      operationId: submitListingDraft
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Sent. The listing, now `in_review`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorExperience" }
        "400":
          description: >-
            `invalid_input` — the draft is not complete. `details.missing` names
            every mandatory field still empty, spelled as the draft body spells
            them.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            `conflict` — the listing is not a draft: it is on sale, or it was
            taken off sale (use `POST /experiences/{id}/resume` for that).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /story:
    get:
      tags: [account]
      summary: Your public story, as a traveller reads it
      description: >-
        **Not the same thing as `/profile`.** That is your LEGAL identity —
        legal name, entity type, GSTIN, registered address — compliance data no
        traveller ever sees. This is what somebody reads before deciding whether
        to get on a stranger's boat.


        `reviewed` carries the two fields you cannot change in place. A year
        printed beside a verified badge is read as something we checked, and an
        address is somewhere a person physically walks to — both are claims a
        traveller acts on, so they change through us. They are returned here so
        you can see what is live; render them, do not offer them as inputs.
      operationId: getOperatorStory
      responses:
        "200":
          description: The story.
          content:
            application/json:
              schema:
                type: object
                required: [about, languages, photos, reviewed]
                properties:
                  about: { type: string }
                  languages:
                    type: array
                    items: { type: string }
                  photos:
                    type: array
                    items:
                      type: object
                      required: [id, position]
                      properties:
                        id: { type: string }
                        position: { type: integer, minimum: 1, maximum: 5 }
                        url: { type: string }
                  reviewed:
                    type: object
                    properties:
                      operatingSince: { type: integer }
                      findThemAt: { type: string }
                      why: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [account]
      summary: Write your story
      description: >-
        `about` and `languages` only, and that is the whole point of the split:
        these are yours outright. Getting them wrong is embarrassing, not
        unsafe.


        **`about` is 40 to 600 characters, or empty.** Forty because two words
        on a trust surface is worse than an honest blank; six hundred because
        nobody reads more on a phone at a jetty. Sending it empty clears it.


        Duplicate and blank languages are dropped rather than refused — a list
        somebody tapped twice is not an error worth a screen.


        Not behind step-up and not OWNER-only. Nothing here takes money, moves
        money, or puts anything on sale.
      operationId: saveOperatorStory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                about: { type: string }
                languages:
                  type: array
                  maxItems: 8
                  items: { type: string }
      responses:
        "200":
          description: Saved. The whole story comes back.
          content:
            application/json:
              schema:
                type: object
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccountSuspended" }

  /story/photos/upload-intents:
    post:
      tags: [account]
      summary: Open an upload slot for a photograph of the operation
      description: >-
        Mint a slot, post the file straight to `uploadUrl`, then send the
        `imageId` to `POST /story/photos`. The API never proxies image bytes —
        that is an API that falls over on island 4G.


        **Its own intent rather than the logo's.** Uploading the logo is for an
        OWNER, ADMIN or MANAGER, because a logo is the business's mark; the story
        is open to any operator user, so sharing the logo's intent would refuse
        the crew member who takes the photographs.


        The slot is stamped with your operator id, and `POST /story/photos`
        refuses an image stamped with anybody else's. So an id from another
        business cannot be attached to your page, and neither can a slot that
        was minted and never filled.
      operationId: createStoryPhotoUpload
      responses:
        "201":
          description: A slot to upload into.
          content:
            application/json:
              schema:
                type: object
                required: [imageId, uploadUrl, expiresAt, maxBytes]
                properties:
                  imageId: { type: string }
                  uploadUrl: { type: string }
                  expiresAt: { type: string, format: date-time }
                  maxBytes: { type: integer }
                  next: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccountSuspended" }
        "502":
          description: The image host could not take an upload just now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: No image host is configured on this deployment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /story/photos:
    post:
      tags: [account]
      summary: Add a photograph of the operation
      description: >-
        **The boat, the shop, the crew — not the experience.** Footage of the
        experience belongs on a listing reel; a gallery standing in for it is
        the failure a video-first feed exists to prevent.


        Upload the bytes through `POST /story/photos/upload-intents`, then send
        the `imageId` here. The API never proxies image bytes, for the same
        reason the logo does not: that is an API that falls over on island 4G.


        **The image must be one you minted.** An id stamped for another business
        answers `404`, exactly as an id that does not exist — telling you it
        exists but is not yours would confirm that it exists. A slot that was
        minted and never filled answers `400`: storing it would put a permanent
        broken tile on the page whose whole job is looking trustworthy.


        **Five maximum.** The position is chosen for you — the lowest free slot,
        so removing the third and adding another fills the hole rather than
        leaving a gap the gallery renders as a missing tile. Sending the same
        image twice returns the photograph you already have rather than an
        error.
      operationId: addOperatorPhoto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [imageId]
              properties:
                imageId: { type: string }
      responses:
        "201":
          description: Added.
          content:
            application/json:
              schema:
                type: object
                required: [id, position]
                properties:
                  id: { type: string }
                  position: { type: integer }
                  url: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccountSuspended" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: You already have five. Remove one first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /story/photos/{id}:
    delete:
      tags: [account]
      summary: Remove a photograph
      description: >-
        Another business's photograph answers exactly as one that does not
        exist.
      operationId: removeOperatorPhoto
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Gone. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccountSuspended" }
        "404": { $ref: "#/components/responses/NotFound" }

  /experiences/{id}/resume:
    post:
      tags: [listings]
      summary: Put your own paused listing back on sale
      description: >-
        **Immediate. No queue, no admin.** The listing goes from `withdrawn`
        straight to `published` — and, if nothing else is stopping sales,
        travellers can book it again. `next` says which.


        This reverses the behaviour shipped earlier the same day, in which
        resuming joined an admin queue (D-032.4). A pause is "the boat is out of
        the water this fortnight" — a fact only you know. If coming back costs a
        wait, nobody pauses at all: they leave the listing selling and decline
        the bookings, which is worse for the traveller than the friction was
        ever worth.


        **Nothing about review is weakened by this.** Resuming changes no
        content — the words, the price and the reel are what was already
        approved, because every edit still goes through
        `POST /experiences/{id}/revisions`. And publication is not what protects
        a traveller: eligibility is re-derived on every read, so a listing
        resumed while your insurance is lapsed or your account is not live is
        `published` and still unsellable. The state says what YOU want; whether
        anybody can buy is decided separately.


        Refused with `400` when something mandatory is missing, so you find out
        while the form is open rather than after putting something back that
        cannot sell. `details.missing` names them.


        Idempotent: resuming a listing already on sale is not an error. A
        listing still awaiting its FIRST approval answers `in_review` and does
        not move — resuming cannot skip a review that has never happened.


        OWNER, ADMIN or MANAGER: the person who can take a listing off sale is
        the person who puts it back.


        `POST /experiences/{id}/relist` is the same operation under its older
        name and behaves identically. It is kept so a deployed portal does not
        break, and should not be used in new work.
      operationId: resumeExperience
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Resumed. `state` and `next` say whether it is selling.
          content:
            application/json:
              schema:
                type: object
                required: [state, next]
                properties:
                  state: { type: string, enum: [published, in_review] }
                  next:
                    type: string
                    description: >-
                      Say this out loud. It is chosen by what is true — back on
                      sale; back on the operator's listings but not bookable
                      while something on the account stops sales; or, for a
                      listing never approved (`state: in_review`), still waiting
                      for its first check. It used to say "back on sale" in all
                      three.
        "400":
          description: >-
            `invalid_input` — something mandatory is missing.
            `details.missing` names every one.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`not_withdrawn` — the listing is in a state that cannot resume."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /experiences/{id}/relist:
    post:
      tags: [listings]
      summary: Put your own paused listing back on sale (older name for resume)
      description: >-
        Identical to `POST /experiences/{id}/resume` — same handler, same
        result. Kept so the deployed portal keeps working; use `resume` in new
        work.


        **Its behaviour changed with D-032.4.** It used to move the listing to
        `in_review` and wait for an admin. It now puts it back on sale
        immediately.
      operationId: relistExperience
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Back on sale.
          content:
            application/json:
              schema:
                type: object
                required: [state, next]
                properties:
                  state: { type: string, enum: [published, in_review] }
                  next: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`not_withdrawn` — the listing is in a state that cannot resume."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /experiences/{id}/pause:
    post:
      tags: [listings]
      summary: Take your own listing off sale (same act as withdraw)
      description: >-
        Identical to `POST /experiences/{id}/withdraw` — same handler, same
        result, same request body. `pause` is the word the product uses;
        `withdraw` is kept so the deployed portal keeps working.


        **Pausing cancels nothing and refunds nothing.** Everybody already
        booked still has their seat and still expects you at the meeting point.
        It stops NEW bookings, and that is all it does.


        Put it back yourself with `POST /experiences/{id}/resume`.


        OWNER, ADMIN or MANAGER only.
      operationId: pauseExperience
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reasonCode, confirmExperienceId]
              properties:
                reasonCode:
                  type: string
                  enum: [seasonal_close, not_running, price_wrong, details_wrong, other]
                  description: >-
                    One of four separate reason lists, one for each act: this one
                    for pausing a listing, the same here and on the other
                    spelling; `POST /requests/{id}/decline` for declining a
                    request; `POST /slots/{id}/call-off` for calling a departure
                    off; and `POST /blackouts` and `POST /slots/{id}/close` for
                    closing dates or one departure. Each act accepts only its own
                    list. This one is about the listing rather than a date or a
                    departure, and includes `price_wrong` and `details_wrong`. It
                    is recorded in our audit log with the pause, and no traveller
                    is sent it.
                note: { type: string }
                confirmExperienceId:
                  type: string
                  description: >-
                    Must equal the id in the path. Not a boolean: a checkbox is
                    one mis-tap on a wet phone away from taking a live listing
                    off sale.
      responses:
        "200":
          description: Off sale. Nothing was cancelled and nothing was refunded.
          content:
            application/json:
              schema:
                type: object
                required: [state, upcomingDepartures, bookingsToHonour, guestsToHonour, next]
                properties:
                  state: { type: string, enum: [withdrawn] }
                  upcomingDepartures: { type: integer }
                  bookingsToHonour: { type: integer }
                  guestsToHonour: { type: integer }
                  note:
                    type: string
                    description: >-
                      Present when `bookingsToHonour` is above zero, and clients
                      must render it verbatim. An operator who assumes pausing
                      cancelled the bookings will simply not turn up.
                  next:
                    type: string
                    description: >-
                      That resuming is the operator's own button and needs
                      nobody at Yuvoy. It used to say "ask us to put it back …
                      we check it before travellers see it again", which
                      D-032.4 made false.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /experiences/{id}/withdraw:
    post:
      tags: [listings]
      summary: Take your own listing off sale
      description: >
        The thing an operator could not do. Only an admin could take a listing
        off sale, so an operator whose boat was out of the water for a month had
        to ask somebody at Yuvoy — a queue with a portal in front of it.


        **This cancels nothing and refunds nothing.** Future departures keep
        their rows and simply stop being offered; confirmed bookings are
        untouched and you still owe those travellers the trip. If you want a
        departure cancelled and its travellers refunded, that is
        `POST /slots/{id}/call-off`, one per departure, each with its own
        confirmation. There is deliberately no "withdraw and cancel everything"
        flag.


        Not a state machine. The admin endpoint carries four publication states;
        the transitions an operator owns are "off" and "please put it back".


        **You put it back yourself** — `POST /experiences/{id}/resume` — and it
        is on sale immediately, with no queue and no admin (D-032.4).


        Approving a copy edit still does NOT republish it, and that has not
        changed: an edit and "put this back on sale" are different acts, and
        only one of them is a decision about what travellers can see. What
        changed is who makes that decision for a listing that was already
        approved: you do.


        OWNER, ADMIN or MANAGER only.
      operationId: withdrawOperatorExperience
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reasonCode, confirmExperienceId]
              properties:
                reasonCode:
                  type: string
                  enum: [seasonal_close, not_running, price_wrong, details_wrong, other]
                  description: >-
                    One of four separate reason lists, one for each act: this one
                    for pausing a listing, the same here and on the other
                    spelling; `POST /requests/{id}/decline` for declining a
                    request; `POST /slots/{id}/call-off` for calling a departure
                    off; and `POST /blackouts` and `POST /slots/{id}/close` for
                    closing dates or one departure. Each act accepts only its own
                    list. This one is about the listing rather than a date or a
                    departure, and includes `price_wrong` and `details_wrong`. It
                    is recorded in our audit log with the pause, and no traveller
                    is sent it.
                note: { type: string }
                confirmExperienceId:
                  type: string
                  description: >-
                    Must equal the id in the path. Not a boolean: a checkbox is
                    one mis-tap on a wet phone away from taking a live listing
                    off sale, the same reason calling off a departure asks for
                    the departure's id.
      responses:
        "200":
          description: Off sale. Nothing was cancelled and nothing was refunded.
          content:
            application/json:
              schema:
                type: object
                required: [state, upcomingDepartures, bookingsToHonour, guestsToHonour, next]
                properties:
                  state: { type: string, enum: [withdrawn] }
                  upcomingDepartures: { type: integer }
                  bookingsToHonour: { type: integer }
                  guestsToHonour: { type: integer }
                  note:
                    type: string
                    description: >-
                      Present when `bookingsToHonour` is above zero, and
                      **clients must render it verbatim**. An operator who
                      assumes withdrawing cancelled the bookings will simply not
                      turn up, which is the failure this sentence exists to
                      prevent.
                  next: { type: string }
        "400":
          description: >-
            `invalid_reason_code` — why are you taking it off sale? — or
            `confirmation_required` — echo the listing id to go ahead.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            `already_off_sale` — it is still a draft, so it is not on sale to
            anybody yet — or `sale_in_progress` — somebody is mid-checkout on
            this listing. Holds last ten minutes; withdrawing is never urgent,
            and the alternatives are stranding a payer or killing a sale in
            flight.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /media:
    get:
      tags: [media]
      summary: My clips
      operationId: listOperatorMedia
      description: >-
        An operator's own clips, newest first.


        Without this the portal could show nothing after the upload screen — not
        what was processing, not what a reviewer approved, not what was live —
        and `publish` and `withdraw` were unreachable from any interface, because
        both need a media id the client only held for the seconds after
        `complete` returned it.


        **No playback URL.** An unpublished clip needs a signed, short-lived one,
        and minting per row on a list nobody may be watching hands out
        credentials for footage no moderator has seen.
      responses:
        "200":
          description: Clips belonging to the signed-in operator.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/OperatorMedia" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /media/photo-intents:
    post:
      tags: [media]
      summary: Get a one-time URL to upload a photograph to
      description: >
        The browser posts the file straight to the image host, as video does —
        bytes never pass through this API.


        **Name the listing first.** `experienceId` is required, and a draft
        listing is a valid answer — that is the ordinary case, because an
        operator adds pictures while writing a listing. The listing is what a
        moderator is shown beside the photograph, and without it
        `NOT_THIS_EXPERIENCE` is a rejection code about something nobody
        recorded.


        A photograph then travels **the same road as a clip**: attest the rights,
        a person reviews it, and it goes live when the listing it belongs to is
        published. There is no shorter path, deliberately: the risks are the same
        ones — footage nobody had the rights to, people who did not consent, a
        picture that is not the experience being sold — and a second pipeline
        with weaker gates would be the way around the first.


        `POST /media/{id}/publish` remains available and is how a photograph is
        attached to a SECOND listing, or attached at all if it predates this.
      operationId: createPhotoUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [experienceId]
              properties:
                experienceId:
                  type: string
                  format: uuid
                  description: >-
                    Which listing this photograph is for. A listing that is not
                    yours answers **404**, indistinguishable from one that does
                    not exist.
                role:
                  type: string
                  enum: [hero, gallery]
                  default: gallery
                  description: >-
                    Defaults to `gallery`. A listing shows one hero, and the
                    role is a property of the pairing rather than of the
                    picture — the same photograph can be a hero on one listing
                    and a gallery item on another. Changeable later through
                    `POST /media/{id}/publish`.
      responses:
        "201":
          description: A slot to upload into.
          content:
            application/json:
              schema:
                type: object
                properties:
                  intentId:
                    type: string
                    description: >-
                      The row recording which listing this upload is for. Send
                      it back to `/media/photo-intents/complete`.
                  imageId: { type: string }
                  uploadUrl: { type: string }
                  expiresAt: { type: string, format: date-time }
                  maxBytes: { type: integer, format: int64 }
                  next: { type: string }
        "400":
          description: No `experienceId`, or a role that is not `hero` or `gallery`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            `conflict` — this listing already shows as many photographs as we
            allow. `details.kind` and `details.limit` say which ceiling, the same
            shape `/media/{id}/publish` uses, so one screen renders both.
            Refused here rather than after the upload: telling somebody the
            gallery is full after twenty minutes on a 0.5 Mbps uplink is telling
            them too late.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: "`media_unavailable` — the image host could not mint a slot. Retry safely."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "`media_unavailable` — image hosting is not configured on this service."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /media/photo-intents/complete:
    post:
      tags: [media]
      summary: Confirm the photograph arrived
      description: >
        The host is asked whether the file arrived and who it belongs to; the
        client is not believed about either.


        An id minted for another operator answers **404**, the same as an id that
        does not exist — telling somebody "that image exists but is not yours"
        confirms it exists.


        On success the photograph is a media asset in state `ready`, and appears
        in `GET /media` like any other.


        **`ready` is not "done".** Nothing reaches a reviewer until the rights
        are attested at `POST /media/{id}/rights` — the same statement a reel
        uses, unchanged, because every clause of it is medium-neutral and the
        consent clause matters more for a still than for a moving frame.
      operationId: confirmPhotoUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: >-
                One of the two. `intentId` is the form to use: it names the row
                carrying which listing this photograph is for.
              properties:
                intentId:
                  type: string
                  format: uuid
                  description: From the upload intent. Preferred.
                imageId:
                  type: string
                  description: >-
                    The compatibility form, kept permanently. It is what the
                    currently published client sends, and a photograph minted
                    before the listing was chosen at upload has no intent row to
                    name — ownership is proved by the host's own metadata either
                    way.
      responses:
        "200":
          description: Recorded, and awaiting a rights attestation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mediaAssetId: { type: string }
                  state:
                    type: string
                    enum: [ready]
                    description: >-
                      Said back because nothing else led an operator from here
                      to the rights form. `ready` means the file arrived; it does
                      not mean anybody will look at it.
                  next: { type: string }
        "400":
          description: The upload has not arrived at the host yet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503":
          description: "`media_unavailable` — image hosting is not configured on this service."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /media/upload-intents:
    post:
      tags: [media]
      summary: Get an upload slot for a reel
      description: >
        **Bytes never pass through this API.** The browser uploads directly to
        the video provider over tus, resumable in 5 MB chunks — on a 0.5-3 Mbps
        island uplink a non-resumable uploader is not slow, it is unusable.


        `uploadUrl` is **never stored server-side**: it is a credential for
        writing video into our account. Treat it as a secret and do not persist
        it client-side either.


        **Asking again while an upload is in flight resumes it.** You get the
        same upload back with a fresh, working `uploadUrl` — not a `409`, and
        not a new slot. So a tab reload, a browser restart or a killed app
        recover by calling this endpoint again and `HEAD`ing the URL for the
        offset, which is ordinary tus.


        This is why the URL is safe to withhold from you: it is derived from
        the upload's own id rather than kept, so the server can always hand it
        back without ever having stored it. Before this, "resumable" held for a
        dropped packet and not for a dropped tab — which on a twenty-minute
        upload is the failure that actually happens.


        ## The length is fixed here, not on the PATCH


        `sizeBytes` becomes the tus `Upload-Length` at slot creation, so the
        upload is **not** length-deferred. Under tus, `Upload-Length` on a
        `PATCH` is only meaningful while the length is still deferred, so there
        is nothing for a chunk to declare.


        **Cloudflare accepts a redundant `Upload-Length` on a `PATCH` anyway.**
        Verified against the live provider on 2026-09-06: two identical
        one-megabyte final chunks against two real slots, one with the header
        and one without, both answered `204` and both left the offset complete.
        A strict tus server would refuse it; this one does not. So sending it is
        harmless today and wrong in principle — and a mock that refuses it is
        stricter than production, which will fail a client for something the
        provider permits.


        The reliable thing to branch on is the opening `HEAD`: it returns
        `Upload-Length` and no `Upload-Defer-Length`, which says the length is
        already fixed and the client has nothing to declare.
      operationId: createUploadIntent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sizeBytes]
              properties:
                experienceId:
                  type: string
                  format: uuid
                  description: >-
                    **Which listing this reel is for, chosen before the file.**


                    A draft listing is a valid answer — the ordinary flow is an
                    operator writing a listing and adding footage to it. Before
                    this the pairing was created at PUBLISH, i.e. after approval,
                    so a moderator was asked to judge `NOT_THIS_EXPERIENCE`
                    against a listing nothing had recorded, and after a generic
                    approval the clip could be attached to any listing at all.


                    **Optional for now, and it will become required.** D-031 C5
                    asks for it at upload, but the shipped portal uploads a clip
                    with no target and attaches it after approval, so requiring
                    it today would stop every reel upload in production the
                    moment this deployed. Send it and it is honoured in full;
                    omit it and the clip behaves as it does today, with the
                    moderation queue saying plainly that no listing was chosen.
                    `POST /media/photo-intents` requires it from the start,
                    because nothing calls that endpoint yet and there is no
                    deployed client to break. Raised as `yuvoy-operator#31`.


                    A listing that is not yours answers **404**, the same as one
                    that does not exist.


                    A listing that is not yours answers **404**, the same as one
                    that does not exist.
                role:
                  type: string
                  enum: [hero, gallery]
                  default: gallery
                  description: >-
                    Defaults to `gallery`. One hero per listing; the role
                    belongs to the pairing rather than to the clip and can be
                    changed at `POST /media/{id}/publish`.
                sizeBytes:
                  type: integer
                  format: int64
                  description: >-
                    **The file's actual size in bytes.** The browser knows it;
                    we cannot.


                    tus fixes the upload length when the slot is created. A slot
                    opened for the 200 MB ceiling when the clip is 6 MB never
                    completes — the provider goes on waiting for 194 MB that do
                    not exist. The first chunk lands, the last cannot, and the
                    reported offset looks perfectly correct while the upload is
                    already unfinishable.


                    On a resume this is ignored: the original size wins, because
                    tus already fixed it. Picking a different file after a
                    reload means starting a new upload, not continuing this one.
      responses:
        "201":
          description: An upload slot.
          content:
            application/json:
              schema:
                type: object
                properties:
                  intentId: { type: string }
                  sizeBytes:
                    type: integer
                    format: int64
                    description: >-
                      The size this slot was opened for, echoed back. Check it
                      against the file you are about to send: a mismatch is the
                      difference between an upload that finishes and one that
                      stalls at 100%.
                  uploadUrl: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
                  maxBytes: { type: integer }
                  maxSeconds: { type: integer }
                  protocol: { type: string, enum: [tus] }
                  chunkBytes: { type: integer }
                  aspectRatio: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccountSuspended" }
        "400":
          description: >-
            No `sizeBytes`, no `experienceId`, or a file larger than we accept.
            Refused before an upload URL exists rather than after bytes have
            moved, and no intent is created — a refusal that burned the
            operator's one concurrent slot would lock them out of retrying.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: >-
            No such listing. Indistinguishable from one belonging to another
            operator, deliberately.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: >-
            `upload_in_progress` — an upload is already in flight for this
            operator — or `conflict`, this listing already shows as many reels as
            we allow, with `details.kind` and `details.limit` naming the ceiling. The second is checked here as well as at publish
            because telling somebody the gallery is full after a twenty-minute
            upload is telling them too late.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /media/upload-intents/{id}/complete:
    post:
      tags: [media]
      summary: Tell us the upload finished
      description: >
        A hint that it is worth polling, nothing more — **the client's claim is
        never trusted.** What decides is whether the provider has an asset that
        is in our account, ready, with a playback id, a poster and a duration.


        `202` with `ready: false` is normal and not an error: the video is still
        processing. A job keeps polling whether or not the client comes back.
      operationId: confirmUpload
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The asset exists and is ready.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ready: { type: boolean }
                  mediaAssetId: { type: string }
        "202":
          description: Still processing. Poll again.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ready: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccountSuspended" }
        "404": { $ref: "#/components/responses/NotFound" }

  /media/{id}/rights:
    post:
      tags: [media]
      summary: Attest to rights over this footage
      description: >
        **Attesting does not publish.** A reviewer checks it afterwards, and
        only their approval produces the verified rights record the database
        requires before a clip can appear anywhere. Say so in the UI — operators
        reasonably assume attesting is the last step.


        `peopleConsentConfirmed` must be an explicit `true` or `false`, never
        defaulted and never omitted: consent of the people filmed is the one
        thing a moderator cannot check by watching.


        `statementSha256` is the hash of the statement **as it was rendered to
        the operator**. Sending only a version number would mean that editing
        the wording without bumping the version silently turns every prior
        attestation into a claim about words nobody saw.
      operationId: attestMediaRights
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [statementVersion, statementSha256, rightsType, peopleConsentConfirmed]
              properties:
                statementVersion: { type: integer, minimum: 1 }
                statementSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
                rightsType: { type: string, enum: [owned, licensed, operator_granted] }
                thirdPartyRef: { type: string }
                licenceRef: { type: string }
                peopleConsentConfirmed: { type: boolean }
                filmedOn: { type: string, format: date }
                filmedAtLocation: { type: string }
      responses:
        "201":
          description: Recorded and queued for review.
          content:
            application/json:
              schema:
                type: object
                properties:
                  attestationId: { type: string }
                  state: { type: string }
                  note: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccountSuspended" }
        "404": { $ref: "#/components/responses/NotFound" }

  /media/{id}/withdraw:
    post:
      tags: [media]
      summary: Take a clip down
      description: >
        Two acts that fail independently, and only the first is transactional:
        it comes off Yuvoy immediately, and the original is deleted at the video
        provider shortly afterwards by a job. Conflating them would mean a
        provider outage keeps a clip live that the operator asked us to take
        down — and the reason they ask is sometimes that somebody in the footage
        objected, which is not a thing to be waiting on a third party for.


        Asking twice succeeds: somebody requesting a clip come down that is
        already down should be told it is down, not told they did something
        wrong.


        The reason is a closed set because the counts matter —
        `people_in_it_objected` arriving repeatedly for one operator is a
        consent problem in how they film, not a series of unrelated takedowns.
      operationId: withdrawMedia
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  enum: [operator_request, people_in_it_objected, no_longer_accurate, rights_lapsed]
      responses:
        "200":
          description: Down.
          content:
            application/json:
              schema:
                type: object
                properties:
                  withdrawn: { type: boolean }
                  note: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccountSuspended" }
        "404": { $ref: "#/components/responses/NotFound" }

  /media/{id}/publish:
    post:
      tags: [media]
      summary: Put approved media on a listing
      description: >
        Both the media and the listing must belong to this operator; otherwise
        `404`. Media that has not been approved also answers `404` — it is not
        yet a thing that can be published.


        **This is no longer the primary route.** Media names its listing at
        upload and is attached when a moderator approves it, so this endpoint is
        for the two cases that remain: putting the same clip or photograph on a
        SECOND listing, and attaching media that predates the choice being made
        at upload. Its `role` field is also how the role of an existing pairing
        is changed.


        **Being attached is not being public.** Media on a listing that is a
        draft or has been withdrawn stays invisible to travellers and stays
        private at the video host; it becomes public when the listing is
        published, and goes private again when the listing comes down. That is
        D-031 C5, and it means an operator can attach with confidence before a
        listing is finished.


        A photograph never touches the video host on this path, which is what
        used to make publishing one impossible: the call was made
        unconditionally and a Cloudflare Images id posted to Stream's endpoint
        answered `502`.
      operationId: publishMedia
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [experienceId]
              properties:
                experienceId: { type: string }
                role: { type: string, enum: [hero, gallery], default: gallery }
      responses:
        "204": { description: Published. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccountSuspended" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            `hero_taken` — this listing already has a hero, and a listing shows
            one. Move the existing one to the gallery first, or attach this as a
            gallery item; `details.role` is `hero`.


            Otherwise: this listing already shows as many of that kind as we
            display.
            **Photographs and clips have separate ceilings — 20 each — so a full
            gallery never blocks a reel and a full reel library never blocks a
            photograph.** They do different jobs and rationing one against the
            other helps nobody.


            `details.kind` (`image` or `video`) and `details.limit` say which
            ceiling was reached, so the screen can tell somebody which thing to
            remove rather than leaving them to work it out.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: >-
            The approved CLIP could not be made public at the video provider.
            Retry safely. A photograph cannot produce this: nothing is asked of
            the video host for one.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: >-
            `media_unavailable` — attaching a CLIP to a PUBLISHED listing needs
            the video host, and it is not configured on this service. A
            photograph never produces this, and neither does attaching to a
            draft listing: both go through without the video host existing,
            because neither asks anything of it.


            Not a retry-in-a-moment answer. It is a deployment that is missing
            configuration, and it stays 503 until somebody sets it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  securitySchemes:
    operatorSession:
      type: http
      scheme: bearer
      description: >-
        The opaque token from `createOperatorSession`. Not a JWT and carries no
        claims — it is random with no meaning outside our database, which is
        what lets it be revoked and lets a stolen one be worthless once it is.

  responses:
    BadRequest:
      description: Something in the request needs fixing.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: No session, or one that is no longer valid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: >-
        Signed in, but this role may not do it (`forbidden`). On a write it can
        also be `account_suspended`: the business is suspended, closed or
        disqualified, and this is not one of the writes it may still make.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AccountNotActive:
      description: >-
        The operator account itself has been offboarded in its account state,
        so it cannot sign in or use a session. Distinct from a role refusal: the
        person is fine, the business relationship is not. A suspended business
        is not refused here, and nor is one whose status is `OFFBOARDED` or
        `DISQUALIFIED`: each signs in, and its writes answer
        `account_suspended` instead.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AccountSuspended:
      description: >-
        `account_suspended`: the business is suspended (D20), or its status is
        `OFFBOARDED` or `DISQUALIFIED` (D44), and this write is not one it may
        still make. The message is "Your account has been suspended. Please
        reach out to admin for help.", or for those two statuses "Your account
        has been closed. Please reach out to admin for help." and "Your account
        has been disqualified. Please reach out to admin for help.", and is safe
        to show as it is. Reads still work, and so do attendance, cash
        collected, cash given back, both relays, writing in the conversation on
        a booking and marking it read, calling a departure off, cancelling a
        booking, declining a request, holding, restoring or removing somebody on
        the team, stopping a bank change, filing a document with its file, and
        signing out.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: >-
        No such row — **or one belonging to another operator.** Deliberately
        indistinguishable.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many requests from this address.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    SettlementWeek:
      type: object
      description: >-
        One payout week, Monday to Sunday in your market's clock, as a lock of
        it would record it now.
      required: [periodStart, periodEnd, settlesFrom, bookings, grossPaise, commissionPaise,
                 refundsPaise, adjustmentsPaise, netPaise]
      properties:
        periodStart: { type: string, format: date, description: The week's Monday. }
        periodEnd: { type: string, format: date, description: The week's Sunday. }
        settlesFrom:
          type: string
          format: date
          description: >-
            The Monday after the week: the first day it can be locked for
            payment. Three of our people lock, approve and send it on that day
            or after it, and your bank decides when the transfer lands.
        bookings:
          type: integer
          description: >-
            The card bookings it would pay: trips marked complete or a no-show,
            and cancelled bookings you kept money on.
        grossPaise: { type: integer }
        commissionPaise:
          type: integer
          description: Our commission on those bookings. None is taken on a cancelled booking.
        refundsPaise: { type: integer }
        adjustmentsPaise:
          type: integer
          description: >-
            Corrections the lock takes with it, usually below zero: your share
            of a refund issued after an earlier payout, taken off this one.
        netPaise:
          type: integer
          description: >-
            `grossPaise - commissionPaise - refundsPaise + adjustmentsPaise`,
            what the lock would record. A week with no bookings to pay is not
            locked, and its corrections wait for the next week that has some. A
            correction larger than what a week pays makes this below zero, and
            that week is not paid until somebody at Yuvoy decides how to
            recover it.

    SettlementPipeline:
      type: object
      description: >-
        Card bookings still to run: not yet marked complete or a no-show, and
        neither cancelled nor declined. At what they come to after commission
        and refunds, and never part of anything earned.
      required: [bookings, grossPaise, commissionPaise, refundsPaise, netPaise]
      properties:
        bookings: { type: integer }
        grossPaise: { type: integer }
        commissionPaise: { type: integer }
        refundsPaise: { type: integer }
        netPaise: { type: integer, description: "`grossPaise - commissionPaise - refundsPaise`." }

    PaidAtCounter:
      type: object
      description: >-
        Your bookings to be paid in cash at the counter that are still to run:
        not yet marked complete or a no-show, and neither cancelled nor
        declined. Never part of
        a settlement, because the traveller pays you and that money never
        passes through us.
      required: [bookings, farePaise, commissionPaise, netPaise]
      properties:
        bookings: { type: integer }
        farePaise:
          type: integer
          description: The fares agreed when the bookings were made.
        commissionPaise:
          type: integer
          description: >-
            Our commission on those fares, at the rate fixed on each booking
            when it was made. You owe it once a trip is marked complete and you
            have recorded its cash, and it is then in `GET /commission-owed`.
        netPaise:
          type: integer
          description: >-
            What you keep: the cash you recorded taking, or the fare where you
            have not recorded any yet, less `commissionPaise`. Our commission is
            on the fare, so cash you took short of it comes out of what you keep.

    SeasonToDate:
      type: object
      description: Every payout sent since `from`.
      required: [from, settlements, bookings, grossPaise, commissionPaise, refundsPaise,
                 adjustmentsPaise, netPaise]
      properties:
        from:
          type: string
          format: date
          description: >-
            The first day of the season. Today a season is the financial year,
            so this is 1 April.
        settlements: { type: integer, description: Payouts sent. }
        bookings: { type: integer, description: The bookings those payouts paid. }
        grossPaise: { type: integer }
        commissionPaise: { type: integer }
        refundsPaise: { type: integer }
        adjustmentsPaise: { type: integer }
        netPaise: { type: integer, description: What those payouts sent. }

    Settlement:
      type: object
      description: One of your payout periods that has been locked, approved or sent.
      required: [id, periodStart, periodEnd, state, bookings, grossPaise, commissionPaise,
                 refundsPaise, adjustmentsPaise, netPaise]
      properties:
        id: { type: string }
        periodStart:
          type: string
          format: date
          description: The first day it covers, a Monday for a payout week.
        periodEnd:
          type: string
          format: date
          description: The last day it covers, a Sunday for a payout week.
        state:
          type: string
          enum: [locked, approved, settled]
          description: >-
            `locked`: its number is fixed and waiting for a second person to
            agree it. `approved`: agreed, and waiting to be sent. `settled`:
            sent, with the bank's reference.
        bookings: { type: integer }
        grossPaise: { type: integer }
        commissionPaise: { type: integer }
        refundsPaise: { type: integer }
        adjustmentsPaise: { type: integer }
        netPaise:
          type: integer
          description: >-
            `grossPaise - commissionPaise - refundsPaise + adjustmentsPaise`,
            what was locked for payment.
        lockedAt: { type: string, format: date-time, description: When its number was fixed. }
        settledAt:
          type: string
          format: date-time
          description: When the transfer was recorded as made. Absent until it is settled.
        reference:
          type: string
          description: The bank's reference for the transfer. Absent until it is settled.

    SettlementLine:
      type: object
      description: One booking a settlement paid, as it was frozen when the period was locked.
      required: [bookingId, reference, tripDate, guests, grossPaise, commissionPaise,
                 refundedPaise, netPaise]
      properties:
        bookingId: { type: string }
        reference: { type: string, description: The booking reference. }
        tripDate: { type: string, format: date, description: "The day of its departure, in the market's clock." }
        guests: { type: integer }
        grossPaise: { type: integer }
        commissionPaise:
          type: integer
          description: 0 on a cancelled booking, because we take no commission on a booking that did not happen.
        refundedPaise: { type: integer }
        netPaise: { type: integer, description: "`grossPaise - commissionPaise - refundedPaise`." }

    VocabularyTerm:
      type: object
      description: >-
        One allowed value and the word a person uses for it. Both, always —
        `andaman/havelock` is an identifier and "Havelock (Swaraj Dweep)" is
        what an operator calls the place; a picker showing only the key asks
        somebody to recognise one.
      properties:
        key: { type: string }
        label: { type: string }

    NotOnSaleReason:
      type: string
      description: >-
        Why a departure is not on sale, told to the operator whose departure it
        is. Present only when `onSale` is false.


        A closed set, so a client can branch on one — the same reason
        `review.rejectionCode` is closed. **If you meet a value you do not
        recognise, render `notOnSaleDetail` verbatim**; the set grows as the
        eligibility rules do.


        A different calculus from the traveller's `bookable`, which is
        deliberately reason-free: this is their own business. With one exception.
        `sales_paused` covers all five kill-switch scopes at once and is the only
        place the operator is told less than the whole truth — a kill switch is
        an emergency stop we pulled, and whether it is global, a market, an island
        or aimed at them personally is a supply judgment we do not publish on a
        self-serve screen.
      enum:
        # An emergency stop at our end. All five kill-switch scopes, collapsed.
        - sales_paused
        # Waiting on them.
        - listing_draft
        # Waiting on us.
        - listing_in_review
        # They took it off sale; a revision puts it back in front of us.
        - listing_withdrawn
        - listing_unpriced
        # The account screen names which document, and says it once rather than
        # in two places that can word it differently.
        - operator_not_selling
        # Split from one another because they are different acts with different
        # fixes — send us a document, versus renew one — and because the expiry
        # is compared against this departure's own local date.
        - credential_missing
        - credential_expired
        - departure_closed
        # Called off: its bookings were cancelled and everybody who paid online
        # is refunded. Split from departure_closed, which leaves every booking
        # standing, because the two are opposite facts for the people on it.
        - departure_called_off
        - departure_past_cutoff
        # Allotment seats we have not confirmed with you recently are suppressed,
        # exactly as availability suppresses them. Without a reason for it, such
        # a departure would show as not on sale with nothing said.
        - departure_seats_unconfirmed
        # Not strictly "not on sale" — it sold out, which is the good outcome —
        # but the screen has to say so rather than show an unexplained gap.
        - departure_full

    ActivityTypeTerm:
      type: object
      description: >-
        One activity, the word a person uses for it, and the category it belongs
        to. A third field, so it is not `VocabularyTerm`: the parent matters,
        because a picker that offers "scuba" under "food and drink" is offering a
        400 the database will hand back.
      required: [key, label, category]
      properties:
        key: { type: string, examples: ["scuba"] }
        label: { type: string, examples: ["Scuba diving"] }
        category:
          type: string
          enum: [adventure, nature_wildlife, food_drink, arts_creativity,
                 learning, culture_heritage, wellness, entertainment,
                 community, sports, local_life, events]

    RevisionOutcome:
      type: object
      required: [applied, inReview, state, next]
      description: >-
        What happened to each half of an edit.


        Since D-032.3 a listing edit has two possible destinations. The operator
        owns the commercial reality — price, pricing basis, duration, party size,
        where to meet — and those apply the moment they save. Yuvoy owns what the
        listing PROMISES — the title, the summary, the description, what is
        included, what is required, the safety notes — and those are read by a
        person first.


        Render both lists. "Submitted" alone is wrong for a mixed edit, and
        "saved" alone is wrong for anything carrying a claim.
      properties:
        applied:
          type: array
          items: { type: string }
          description: >-
            Field names that are LIVE NOW, in the order the form shows them.
            Travellers see these on the listing immediately.
        inReview:
          type: array
          items: { type: string }
          description: >-
            Field names a person will read. The listing keeps selling on the old
            wording meanwhile — an edit under review never takes a live listing
            off sale.
        revisionId:
          type: string
          description: Absent when nothing needed reading.
        state:
          type: string
          enum: [applied, submitted]
          description: >-
            `applied` when the whole edit is live; `submitted` when any part of
            it is with us. A mixed edit is `submitted`, which is why the two
            lists above matter more than this field.
        needsReview: { type: boolean }
        next:
          type: string
          description: One sentence saying which half is where. Render it.
        note:
          type: string
          description: >-
            That bookings already made are unaffected. Said out loud because the
            obvious assumption is that editing a listing changes it for everyone
            including people who already booked.

    BusinessDetails:
      type: object
      properties:
        displayName: { type: string, description: "What travellers see. Not editable here." }
        legalName: { type: string }
        entityType: { type: string }
        gstin: { type: string }
        address:
          type: object
          properties:
            line1: { type: string }
            line2: { type: string }
            locality: { type: string }
            region: { type: string }
            postalCode: { type: string }
            country: { type: string }
        missing:
          type: array
          description: >-
            Field names still outstanding. Empty means complete. Named rather
            than a bare boolean so a form can mark the specific rows.
          items: { type: string }
        editable:
          type: boolean
          description: >-
            False once the account is LIVE. Render the form read-only rather
            than accepting edits that will be refused.
        submittedAt: { type: string, format: date-time }

    ListingEdit:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, description: "*mandatory*" }
        summary: { type: string, description: "*mandatory*" }
        description: { type: string }
        category:
          type: string
          description: "*material*, *mandatory*. The closed twelve-value taxonomy."
          enum: [adventure, nature_wildlife, food_drink, arts_creativity,
                 learning, culture_heritage, wellness, entertainment,
                 community, sports, local_life, events]
        activityType:
          type: string
          description: >-
            *material*, *mandatory to publish*. What the listing actually
            is. Not an enum — the set grows by INSERT; the pairs are on
            `GET /catalog/vocabulary`, and the (activity, category) pair
            is enforced by a composite foreign key.


            It is the one mandatory field the **submit** gate does not
            yet demand, because the portal has no picker for it and
            demanding it would answer every operator edit with a 400 they
            could not act on. Approval demands it.
          examples: ["scuba"]
        destination:
          type: string
          description: "*material*, *mandatory*. A destination key in your own market."
        meetingPoint:
          type: string
          description: >-
            *material*, *mandatory*. Where the day actually starts.


            **This is the canonical name.** `meetingPointText` is
            accepted for one release and maps to the same field; sending
            both with different values is a 400. Approval used to apply
            `meetingPointText` while create and read both said
            `meetingPoint`, so a revision that changed only the meeting
            point was approved and changed nothing.
        meetingPointText:
          type: string
          deprecated: true
          description: "Deprecated spelling of `meetingPoint`. Send `meetingPoint`."
        meetingLandmark: { type: string }
        inclusions:
          type: array
          items: { type: string }
          description: "*material*. Documented as material since the endpoint existed, and not actually applied until now."
        requirements:
          type: array
          items: { type: string }
          description: "*material*. As for `inclusions`."
        safetyNotes: { type: string, description: "*material*" }
        screenerKey:
          type: string
          description: >-
            *material*. The health screener a traveller answers before paying,
            or an empty string for none. With one set, a reservation on the
            listing needs the lead traveller's declaration against its
            questions, and a party that declares a condition is refused before
            any seat is held or any money is taken.


            Not an enum: a screener is a row, added or retired on medical advice
            rather than by a release, so the allowed keys are whatever is
            current (today only `diving_rstc`), listed as `screeners` on
            `GET /catalog/vocabulary`. A key that is not current is a 400 whose
            `details.screenerKey` names the ones that are.


            Through `POST /experiences/{id}/revisions` it is read before it goes
            live, like `safetyNotes`. `PATCH /experiences/{id}` saves it on a
            draft in place.
          examples: ["diving_rstc"]
        durationMinutes: { type: integer, description: "*material*, *mandatory*" }
        maxPartySize: { type: integer, description: "*material*, *mandatory*" }
        unitPricePaise: { type: integer, format: int64, description: "*material*, *mandatory*" }
        bookingMode:
          type: string
          enum: [allotment, request]
          description: >-
            *material*. How the listing sells, from the next departure
            onward.


            **Departures that already exist keep the mode they were
            created with.** `experiences.bookingMode` seeds a NEW
            departure; every read that decides a booking — availability,
            checkout, confirmation, the feed — uses the departure's own
            mode. So a traveller mid-request is never moved onto a
            different contract than the one they asked under, and a
            switch to `allotment` shows up only as new departures are
            added.


            A consequence worth planning for: switching to `allotment`
            while every future departure is `request` changes nothing a
            traveller sees until departures are created. Creating an
            allotment departure with no seats is refused outright,
            because `bookable_slots` requires remaining seats and the
            departure would silently never appear.
        pricingUnit:
          type: string
          enum: [per_person, per_group]
          description: >-
            *material*, *mandatory*. How `unitPricePaise` is charged.
            Travellers now see this beside the price, so changing it
            changes what a card claims.
    ClosureReceipt:
      type: object
      required: [id, closed, existingBookings]
      properties:
        id:
          type: string
          description: >-
            The closure. `POST /blackouts/{id}/reopen` puts back what it closed,
            and `GET /blackouts` reads it back.
        closed: { type: boolean }
        existingBookings:
          type: integer
          description: >-
            Bookings and live holds on the departures this closure holds, which
            the operator still owes. A hold is somebody mid-checkout whose hold
            predates the closure and can still complete.
        note:
          type: string
          description: >-
            Present when `existingBookings` is above zero, and clients must
            render it verbatim. Closing cancels nobody, and an operator who
            assumes it did will not turn up.
    OperatorClosure:
      type: object
      required: [id, from, to, reasonCode, createdAt, departureIds]
      properties:
        id: { type: string }
        from:
          type: string
          format: date
          description: >-
            The first market day closed. For `SCHEDULE_CHANGED`, the first day
            of the departures it holds.
        to:
          type: string
          format: date
          description: >-
            The last market day closed. For `SCHEDULE_CHANGED`, the last day of
            the departures it holds.
        experienceId:
          type: string
          description: Present when the closure covers one listing rather than every listing.
        departureId:
          type: string
          description: >-
            Present when the closure is of one departure, made with
            `POST /slots/{id}/close`. `from` and `to` are then that departure's
            own day.
        reasonCode:
          type: string
          enum: [WEATHER, MAINTENANCE, STAFF, PERSONAL, SEASONAL, OTHER, SCHEDULE_CHANGED]
          description: >-
            Why it was closed. The first six are given by whoever closed it.
            `SCHEDULE_CHANGED` is given only by `PUT /experiences/{id}/schedule`,
            to the closure of what the schedule had made at the weekdays and
            times a save removed: it holds exactly `departureIds`, and closes
            nothing else between `from` and `to`.
        note:
          type: string
          description: >-
            Present when one was given. For `SCHEDULE_CHANGED`, the weekdays and
            times the schedule no longer has, like "Removed from the weekly
            schedule: Tuesdays at 09:00 and 17:30."
        createdAt: { type: string, format: date-time }
        reopenedAt:
          type: string
          format: date-time
          description: >-
            Present once the closure has been reopened. Its dates and
            departures stay as they were, so the record still says what was
            closed.
        departureIds:
          type: array
          items: { type: string }
          description: >-
            The departures this closure holds closed, or held until it was
            reopened: every departure in its scope that was not called off when
            the closure was made, including any another closure had already
            closed. For a closure made before closures recorded their
            departures, these are the ones that were still closed when that
            record began, so a departure called off before then is not listed.
    OperatorDeparture:
      type: object
      properties:
        id: { type: string }
        experienceId: { type: string }
        title: { type: string }
        startsAt: { type: string, format: date-time }
        timezone: { type: string }
        seats: { type: integer }
        sold: { type: integer }
        remaining: { type: integer }
        bookingMode:
          type: string
          enum: [allotment, request]
          description: >-
            Whether this departure holds seats (`allotment`) or
            waits on the operator to answer (`request`). The
            same enum the traveller catalog uses, because it is
            the same fact.


            On the departure rather than the listing: a listing
            can carry both, and this screen is looking at
            departures. Without it the portal could only infer
            request mode indirectly, by noticing a row in the
            requests queue — an inference, and a wrong one for
            any departure nobody has asked about yet.
        status: { type: string }
        onSale:
          type: boolean
          description: >-
            Whether a traveller can actually buy this departure.


            Read straight from the same view the traveller
            surfaces read, by a left join — never recomputed — so
            this screen and what is on sale cannot disagree.


            **Per row, not per listing.** A certificate lapsing
            on Tuesday takes Wednesday's departure off sale and
            leaves Monday's selling, and one badge on the listing
            cannot say that.
        notOnSaleReason:
          $ref: "#/components/schemas/NotOnSaleReason"
        notOnSaleDetail:
          type: string
          description: >-
            A sentence to render verbatim. Present only when
            `onSale` is false. Render this when you meet a
            `notOnSaleReason` you do not recognise.
    OperatorMedia:
      type: object
      properties:
        id: { type: string }
        kind:
          type: string
          enum: [video, image]
          description: >-
            Spelled as the traveller document spells it, so
            nothing has to translate between the two.


            **Do not infer this from `durationSeconds`.** A clip
            that is still `uploaded` or `processing` has no
            duration either, so the first thing an operator sees
            after posting a reel would be that reel labelled a
            photograph.
        state:
          type: string
          description: >-
            Where the item is: `uploaded`, `processing`,
            `ready`, `attested`, `in_moderation`, `approved`,
            `published`, `rejected`, `quarantined`, `withdrawn`
            or `failed`.
        posterUrl:
          type: string
          description: >-
            The picture to show for this row. For a photograph
            it is the image itself; for a clip it is the still.


            **Absent on most clips today**, because a poster is
            only stored once the provider has produced one and
            an unpublished clip has no public URL. A row with no
            `posterUrl` still has a `kind` and a `state`, and has
            to render as something.
        durationSeconds:
          type: number
          description: Absent on a photograph, and on a clip that is still arriving.
        situation:
          type: string
          enum:
            - processing
            - needs_rights
            - in_review
            - changes_needed
            - live
            - waiting_on_listing
            - listing_withdrawn
            - not_attached
            - withdrawn
            - failed
          description: >-
            **The whole answer in one word — render this.**


            `state` and `listing.state` are both still here and
            both still true, and since media can be approved,
            attached to a listing, and invisible all at once,
            deriving the situation from two enumerations client
            side gets it wrong in ways nobody notices for a
            month. This is computed server-side so there is one
            opinion about what the operator is looking at.


            - `processing` — the host is still working on it.

            - `needs_rights` — it arrived and nobody has
            attested to it. Nothing happens until they do; this
            is the step operators do not expect.

            - `in_review` — with us, waiting on a person.

            - `changes_needed` — a reviewer refused it, see
            `rejection`.

            - `live` — a traveller can see it right now.

            - `waiting_on_listing` — approved and attached, and
            the listing is not published yet. Nothing is wrong.

            - `listing_withdrawn` — it was live and the listing
            came down. It returns when the listing does.

            - `not_attached` — approved and on no listing at
            all. Only media uploaded before the listing was
            chosen at upload time can be in this state; attach
            it with `POST /media/{id}/publish`.

            - `withdrawn` — the operator took it down.

            - `failed` — it never became usable.
        createdAt: { type: string, format: date-time }
        rejection:
          type: object
          description: >-
            Why a reviewer refused it. A clip that disappears
            into "rejected" with no reason is a support
            conversation, and the codes are a closed set so a
            screen can render them rather than paraphrase.


            `UNSAFE_PRACTICE_SHOWN` appears with state
            `quarantined`, not `rejected` — it is a signal about
            how the operator runs trips, not a note about the
            video.
          properties:
            code: { type: string }
            note: { type: string }
        listing:
          type: object
          description: >-
            The listing this media belongs to — chosen at upload
            since D-031 C5, so it is present from the moment the
            upload completes rather than only after publication.
            Absent only for media that predates that, or that
            arrived through the concierge path.
          properties:
            experienceId: { type: string }
            title: { type: string }
            state:
              type: string
              enum: [draft, published, withdrawn]
              description: >-
                The PUBLICATION's state — whether this media is
                live on that listing. Unchanged in meaning and
                unchanged in name, deliberately: renaming it
                would break the published client.
            listingState:
              type: string
              enum: [draft, in_review, published, withdrawn]
              description: >-
                The LISTING's own state, which is a different
                question. "Approved, and waiting for a draft
                listing to go live" cannot be told from
                "approved and forgotten about" without it.
    OperatorExperience:
      type: object
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }
        summary: { type: string }
        description: { type: string }
        category: { type: string }
        activityType:
          type: string
          description: >-
            What this listing actually is. Empty on the listings that predate the
            vocabulary — the column is nullable so they keep selling — and
            mandatory before it can be published again.
          examples: ["scuba"]
        activityTypeLabel:
          type: string
          description: >-
            The word for it, from the same table the traveller card reads, so a
            picker and a card cannot word the same noun differently. Empty when
            `activityType` is.
          examples: ["Scuba diving"]
        destination: { type: string }
        status:
          type: string
          enum: [draft, in_review, live, live_changes_in_review, changes_rejected, not_selling, withdrawn]
          description: >-
            The one word to show. Derived from the publication state and the
            latest revision together, because neither answers "where is this"
            alone — a published listing with a submitted edit is live AND in
            review, and a draft whose revision was rejected is "we came back to
            you" rather than "draft".

            A draft a reviewer sent back before it was ever on sale reads
            `changes_rejected` too, with `sentBack` saying why, and reads
            `in_review` again once you send it.

            `not_selling` is new in 0053 and is the one value a client cannot
            infer from `publicationState`: the listing IS published, and it is
            still absent from every feed, absent from search, and refusing
            checkout — because the operator is not selling, a kill switch is
            engaged, the listing has no price, or a credential their market and
            category require is missing, unverified or expired. Before 0053 a
            published listing genuinely sold whatever the operator's status
            said, so `live` was accurate; it no longer would be. The reason is
            not on this object deliberately — it belongs to the account, and
            `GET /operator/v1/me` carries the blockers that name it. Because
            requirements resolve per category, one listing can be `not_selling`
            while another of the same operator is `live`.
        publicationState: { type: string, enum: [draft, in_review, published, withdrawn] }
        bookingMode:
          type: string
          enum: [allotment, request]
          description: >-
            How this listing sells. `allotment` means seats are contracted to
            Yuvoy: a traveller books instantly, pays, and the card can name how
            many are left. `request` means we hold no inventory — the operator
            answers first, the traveller pays only after they accept, no seat
            count is ever shown, and a request can only be created between
            06:00 and 19:00 IST because it is work for a person.
        durationMinutes: { type: integer }
        maxPartySize: { type: integer }
        unitPricePaise: { type: integer, format: int64, nullable: true }
        pricingUnit: { type: string }
        meetingPoint: { type: string }
        inclusions: { type: array, items: { type: string } }
        requirements: { type: array, items: { type: string } }
        safetyNotes: { type: string }
        screenerKey:
          type: string
          description: >-
            The health screener a traveller answers before paying for this
            listing, or an empty string when it asks none. Always present. The
            allowed keys, and when a change is read before it goes live, are on
            `ListingEdit`.
          examples: ["diving_rstc"]
        upcomingDepartures: { type: integer }
        publishBlockers:
          type: array
          items: { type: string }
          description: >-
            The mandatory fields still empty on this listing, named in the same
            spelling the revision body uses. Empty means nothing is outstanding.


            D-031 C2 fixes the set: title, category, activity type, destination,
            summary, price and its unit, duration, party size, meeting point.
            Six of those cannot be empty in the schema, so in practice this
            carries `summary`, `activityType`, `unitPricePaise`,
            `meetingPoint` and `pricingUnit`.


            `pricingUnit` appears here for a listing whose basis nobody ever
            stated. The column is NOT NULL, so the value alone cannot tell the
            two apart; the database records separately whether a caller named it,
            and an unstated basis blocks publication rather than printing a
            guessed phrase beside the price.


            Sending a revision that leaves one of these empty is a 400, and
            approving one is a 409, so mark the specific rows on the form rather
            than letting somebody find out on send. `activityType` is the one the
            submit gate does not yet enforce — it is still required before the
            listing can be published.
        sellable:
          type: boolean
          description: >-
            False when there is no price. Such a listing saves but cannot be
            approved, and an operator should learn that while writing it rather
            than after waiting for a review. `publishBlockers` is the fuller
            answer and names every outstanding field, price included.
        review:
          type: object
          description: Where the latest submission got to. Absent if nothing was ever sent.
          properties:
            state: { type: string, enum: [draft, submitted, in_review, approved, rejected, withdrawn, applied] }
            since: { type: string, format: date-time }
            rejectionCode: { type: string }
            rejectionNote: { type: string }
        sentBack:
          type: object
          required: [rejectionCode, rejectionNote, at]
          description: >-
            Present while a reviewer has sent this listing back to you before it
            was ever on sale, and absent otherwise. It is a draft again: change
            it with `PATCH /experiences/{id}` and send it with
            `POST /experiences/{id}/submit`. Gone the moment you send it again.
          properties:
            rejectionCode:
              type: string
              description: Why, from the same closed set as `review.rejectionCode`.
            rejectionNote:
              type: string
              description: What the reviewer wrote beside the code. Empty when they wrote nothing.
            at:
              type: string
              format: date-time
              description: When it was sent back.
        schedule:
          $ref: "#/components/schemas/ListingSchedule"

    WeeklyDeparture:
      type: object
      additionalProperties: false
      required: [weekday, startTime, seats]
      description: One departure of a weekly schedule.
      properties:
        weekday:
          type: integer
          minimum: 0
          maximum: 6
          description: 0 is Sunday and 6 is Saturday.
        startTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: >-
            When it leaves, on the 24-hour clock in the listing's own market,
            with both digits of the hour.
          examples: ["07:00"]
        seats:
          type: integer
          minimum: 1
          maximum: 200
          description: >-
            How many people each departure takes. On an instant-book listing
            these seats are sold to Yuvoy. On a listing that takes requests
            nothing is sold in advance, and this is how many people the
            departure can take.
    ScheduleException:
      type: object
      required: [id, from, to, reasonCode]
      description: >-
        A closure still in force that closes days of the schedule's window, or
        departures in it. It is the closure itself:
        `POST /blackouts/{id}/reopen` reopens it, and `GET /blackouts` reads it
        back in full, with the departures it holds.
      properties:
        id: { type: string }
        from:
          type: string
          format: date
          description: >-
            The first market day closed. For `SCHEDULE_CHANGED`, the first day
            of the departures it holds.
        to:
          type: string
          format: date
          description: >-
            The last market day closed. For `SCHEDULE_CHANGED`, the last day of
            the departures it holds.
        reasonCode:
          type: string
          enum: [WEATHER, MAINTENANCE, STAFF, PERSONAL, SEASONAL, OTHER, SCHEDULE_CHANGED]
          description: >-
            `SCHEDULE_CHANGED` is the closure a save of this schedule made of the
            departures it had made at weekdays and times the save removed. It
            closes only those departures, not whole days, and `note` names the
            weekdays and times.
        note:
          type: string
          description: Present when one was given.
        experienceId:
          type: string
          description: >-
            Present when the closure covers this listing alone. Absent when it
            covers every listing the operator has.
        departureId:
          type: string
          description: >-
            Present when the closure is of one departure, made with
            `POST /slots/{id}/close`.
    ListingSchedule:
      type: object
      required: [repeatsWeekly, weekly, exceptions, horizonDays]
      description: >-
        A listing's standing weekly schedule, set once with
        `PUT /experiences/{id}/schedule`, from which departures keep being made
        `horizonDays` ahead.
      properties:
        repeatsWeekly:
          type: boolean
          description: >-
            False when the listing has no weekly schedule. `weekly` is then
            empty, and nothing is inferred from the departures the listing has.
        weekly:
          type: array
          description: Every weekday and time it runs, by weekday from Sunday, then by time.
          items: { $ref: "#/components/schemas/WeeklyDeparture" }
        exceptions:
          type: array
          description: >-
            Closures still in force that touch today or any of the next
            `horizonDays` days in the listing's market: closures of this
            listing, of one of its departures, or of every listing. Ordered by
            first day, and listed whether or not the listing repeats weekly.
          items: { $ref: "#/components/schemas/ScheduleException" }
        horizonDays:
          type: integer
          description: >-
            How far ahead departures are made: from now to the end of the market
            day this many days after today.

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - invalid_input
                - unauthorized
                - forbidden
                - not_found
                - conflict
                - rate_limited
                # Produced by the router, not by a handler: this path exists
                # with other methods. Reachable on every surface, and until
                # 2026-09-07 only the public contract said so.
                - method_not_allowed
                - internal_error
                # The global 64 KB body limit refused the request before any
                # handler saw it. Retrying the same body fails identically —
                # send less, or send it in pieces.
                - payload_too_large
                # The unclassified case, and deliberately named as one: an
                # HTTP-level 4xx at a status this API does not anticipate,
                # produced by the framework rather than by a handler. There is
                # nothing to branch on beyond the status. It replaced an
                # undeclared literal `error` on 2026-09-07.
                - unclassified_error
                - session_expired
                - account_not_active
                # The business is suspended (D20), or its status is OFFBOARDED
                # or DISQUALIFIED (D44). Every write answers this except the
                # ones the AccountSuspended response lists, and the message is
                # the owner's sentence for that status, shown as it is.
                - account_suspended
                - operator_unavailable
                - would_strand_travellers
                - upload_in_progress
                - media_unavailable
                - media_delivery_unavailable
                # Refused for saying it wrong rather than for lacking
                # permission. Each is a different next step for the caller: fix
                # the code, echo the confirmation, pick a role that exists.
                - invalid_reason_code
                - confirmation_required
                - invalid_role
                - already_current
                # Emitted by handlers and previously undeclared. Found once
                # the response validator began checking error envelopes rather
                # than skipping any response whose body nothing described.
                # You may, but not until a code reaches the OWNER's phone. Distinct from `forbidden`: that one is 'ask for access', this is 'prove it is you'.
                - step_up_required
                # That seat request was already answered, or it expired while the screen was open.
                - request_not_open
                # New in 0053: accepting a seat request is a sale, so it is now
                # gated on the same eligibility every other sale is. Operator-facing,
                # so unlike the traveller's `operator_not_bookable` it says plainly
                # that the gap is theirs; `GET /me` carries the blocker that names it.
                - operator_not_sellable
                # Attendance cannot be recorded before the boat leaves.
                - departure_has_not_started
                # This departure is already cancelled.
                - already_called_off
                # One bank change at a time — two open would mean the second approval silently decides which account wins.
                - change_already_in_progress
                # Already approved, rejected or withdrawn.
                - change_already_decided
                # That number is already on this team, or the invitation could not be made. One message for every failure, deliberately. An OWNER can be invited since D15.
                - cannot_invite
                # You cannot remove yourself, nor the last active OWNER or ADMIN.
                #
                # Left declared but not currently reachable: DELETE /team/{id}
                # goes through the shared team-action translation, which answers
                # `forbidden` for "not yours to touch" and `cannot_change_access`
                # for "a business needs an owner or an admin". Kept rather than
                # deleted because removing a code from a closed enum breaks every
                # generated client that already handles it, and this one is a
                # judgement for whoever owns the team routes.
                - cannot_remove
                # You cannot change your own access, nor the last OWNER's.
                - cannot_change_access
                # New in this batch, both on POST /experiences/{id}/withdraw.
                # A draft is already selling nothing, so withdrawing it is not a
                # state change — and calling a draft "withdrawn" would confuse
                # the one status word the listings screen shows.
                - already_off_sale
                # Moving a departure, all three on PATCH /slots/{id}/time.
                # `departure_started` also answers POST /bookings/{id}/cancel
                # once the departure has left.
                - departure_started
                - different_day
                - time_taken
                # The listing is on sale, so there is nothing to ask to have put
                # back. Named rather than folded into `conflict`: "it is already
                # selling" and "we cannot read this" need different things from
                # the person holding the phone.
                - not_withdrawn
                # Somebody is mid-checkout on this listing. Withdrawing now would
                # strand them at the payment step and releasing their hold would
                # kill a legitimate sale, so the answer is to wait — holds are
                # ten minutes, and withdrawing is never urgent.
                - sale_in_progress
                # POST /media/{id}/publish. A listing shows one hero and 0058
                # made the database say so; before that a second hero was
                # accepted and which picture headlined the listing was decided
                # by a tie-break nobody set. Distinguished from plain `conflict`
                # because it is a CHOICE — move the existing hero to the gallery
                # or attach this one there — and because the shipped operator
                # screen defaults its role radio to hero, so this is the answer
                # the second attach on any listing gets.
                - hero_taken
                # Emitted by operator handlers and, until now, declared by
                # none of them. The closed-world response checker never caught
                # these because its corpus drives no operator error path, so a
                # generated client's union type could not represent what this
                # service actually answers with.
                #
                # POST /requests/{id}/accept. Named in that endpoint's own 409
                # prose since 0053 while the enum the schema resolves to left
                # it out — the contract contradicted itself in one response.
                # Nothing to fix and nothing to retry: the departure is full,
                # so decline it or add capacity first.
                - grant_ceiling_exceeded
                # POST /bookings/{id}/relay and /slots/{id}/relay. The intent
                # word is not one we can send; `details.allowed` lists the set,
                # so re-send with one of those.
                - unknown_intent
                # Same two relay routes. Nobody on that departure has a live
                # booking, so there was no one to message. Not a retry — say so
                # on screen rather than showing "sent".
                - nobody_to_tell
                # Same two relay routes, and the only 429 an operator can be
                # given that is not the shared limiter: too many updates in the
                # last hour. Wait a few minutes; the message was not sent.
                - too_many_updates
                # POST /bookings/{id}/attendance. The outcome word is not one
                # we record; `details.allowed` carries arrived, completed and
                # no_show.
                - invalid_outcome
                # Same route. That booking is on a different departure from the
                # one being worked — reload the manifest rather than retrying.
                - not_on_this_departure
                # POST /media/{id}/withdraw. The withdrawal reason is not one
                # of the four we accept; `details.allowed` lists them.
                - invalid_reason
                # Same route. The clip is not in a state that can come down —
                # it was never published, or it is already withdrawn.
                - cannot_withdraw
                # PUT /profile. The account is LIVE, so the business details
                # were verified against documents and can no longer be edited
                # in place. The next step is to ask us, not to retry.
                - details_locked
                # POST /blackouts/{id}/reopen. The closure was reopened before,
                # so there is nothing left for this call to put back.
                - already_reopened
                # No longer returned by any route. POST /blackouts/{id}/reopen
                # answered it for a closure whose first day was before today,
                # until the owner decided on 13 September that such a closure
                # reopens what is still to come of it. Left declared, as
                # `cannot_remove` is, because removing a code from a closed
                # enum breaks every generated client that already handles it.
                - closure_started
                # POST /bookings/{id}/cancel. The booking is already cancelled,
                # so there is nothing to do and nothing was refunded twice: a
                # retry after the first press worked lands here.
                - already_cancelled
                # Same route. The booking was declined, completed or marked a
                # no-show; the message says which.
                - booking_ended
                # Same route. Part of the booking has been refunded already, and
                # the full refund cancelling promises cannot be raised on top of
                # it, so nothing was cancelled: ask us to cancel it.
                - refund_already_raised
                # POST /bookings/{id}/cash-returned. The booking is not
                # cancelled, was paid online, or has no cash recorded as taken,
                # so there is no cash to give back; the message says which.
                - nothing_to_give_back
                # Same route. Giving back the cash on this booking is already
                # recorded, so nothing changed: a retry after the first press
                # worked lands here.
                - cash_already_returned
                # The file behind a document (D8), on
                # POST /credentials/{id}/upload-intents and its completion.
                # No document store is configured (503), or it did not answer
                # (502). Try again later; nothing was recorded.
                - documents_unavailable
                # The document was already verified or rejected, so the file
                # behind it cannot change. File the document again instead.
                - document_locked
                # Completion was asked for before the file reached the bucket.
                - upload_not_arrived
                # The file that arrived is not one we record;
                # `details.reason` says why.
                - document_refused
                # This upload was refused or replaced. Start a new one.
                - upload_closed
                # GET /settlements/{id}/statement. That payout has been locked or
                # approved but not sent, so there is no statement for it yet.
                - not_settled
                # POST /bookings/{id}/messages. The conversation can be read and
                # not written in: the booking was cancelled or declined, or the
                # trip ended longer ago than messages stay open. `details.reason`
                # says which; the next step is to read it, not to retry.
                - messages_closed
                # POST /join/{token}/code, POST /join/{token}/accept and
                # POST /team/accept, as a 404. The invitation is real, but
                # nobody can join the business right now (D43). The message
                # says whom to ask and never why, and nothing changes until then.
                - invitation_unavailable
            message: { type: string, description: Human-readable; safe to show. }
            details:
              type: object
              additionalProperties: true
              description: Field-level messages, keyed by field name.
            requestId: { type: string }

    RelayRequest:
      type: object
      required: [intent]
      properties:
        intent:
          type: string
          enum: [time_change, meeting_point_change, weather_watch, bring_item, note]
        detail:
          type: string
          description: >-
            The one fact this intent carries, and the only operator-supplied
            value that reaches a phone. Required for every intent except
            `note`, which carries none.


            `time_change` and `weather_watch` take a 24-hour time (`09:30`).
            `meeting_point_change` takes a place (3–120 characters);
            `bring_item` takes a thing to bring (2–80). Both are restricted to
            letters, numbers and basic punctuation — not for injection safety
            (values are parameterised throughout) but because a template
            variable holding a URL or a newline renders as something nobody
            approved, and the provider is entitled to reject the whole message
            for it.
        note:
          type: string
          maxLength: 500
          description: >-
            Free text. Shown on the traveller's status page and **never sent to
            a phone**. Required when `intent` is `note`, optional alongside any
            other intent. The cap is a product decision: a relay note is a
            sentence about a departure, not an essay somebody reads on island
            3G.

    RelayResult:
      type: object
      properties:
        batchId:
          type: string
          description: Groups one send across everyone it reached.
        intent: { type: string }
        recipients:
          type: integer
          description: How many people were actually told.

    BookingMessage:
      type: object
      required: [id, from, senderName, sentAt]
      properties:
        id:
          type: string
          description: Send it as `upTo` to mark this message and everything before it read.
        from:
          type: string
          enum: [traveller, operator]
        senderName:
          type: string
          description: >-
            The name to show beside it: the name the traveller gave at checkout
            on theirs, and on the business's the name of the person on the team
            who wrote it, or the business's name if that person's account is
            gone.
        text:
          type: string
          description: >-
            What was written, trimmed, with its line breaks. Every message
            carries exactly one of `text` and `textRemovedAt`, and a message
            that was just sent always carries `text`.
        textRemovedAt:
          type: string
          format: date-time
          description: >-
            When the text was removed, a set time after the trip ended. Present
            only in place of `text`. Show the message as one whose text was
            removed, never as an empty message.
        sentAt: { type: string, format: date-time }

    BookingMessageThread:
      type: object
      required: [messages, complete, unreadCount, canWrite]
      properties:
        messages:
          type: array
          description: Oldest first within the page. The first page is the most recent messages.
          items: { $ref: "#/components/schemas/BookingMessage" }
        complete:
          type: boolean
          description: >-
            `true` when the conversation begins on this page. `false` always
            comes with a `nextCursor` for the messages before it.
        nextCursor:
          type: string
          description: Absent when nothing came before this page.
        unreadCount:
          type: integer
          description: The traveller's messages nobody at the business has marked read.
        canWrite:
          type: boolean
          description: Whether a message can be sent now.
        closedReason:
          type: string
          enum: [cancelled, declined, window_closed]
          description: >-
            Present only when `canWrite` is `false`. `cancelled` and `declined`:
            the booking ended, and nothing reopens it. `window_closed`: the trip
            ended longer ago than messages stay open.
        writableUntil:
          type: string
          format: date-time
          description: >-
            When writing stops on its own, a set time after the trip ends.
            Absent on a cancelled or declined booking.

    BookingMessageInput:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 1000
          description: The message. Trimmed, with its line breaks kept.

    BookingMessageReadInput:
      type: object
      required: [upTo]
      properties:
        upTo:
          type: string
          description: The `id` of the last message somebody was shown.

    BookingMessageReadReceipt:
      type: object
      required: [unreadCount]
      properties:
        unreadCount:
          type: integer
          description: The traveller's messages still unread after this.

    MessageThreadSummary:
      type: object
      description: One conversation in the list. Never its text, never the traveller's name.
      required: [bookingId, reference, experience, slot, lastMessageAt, lastFrom, unreadCount]
      properties:
        bookingId: { type: string }
        reference: { type: string }
        experience: { type: string }
        slot:
          type: object
          required: [startsAt, timezone]
          properties:
            startsAt: { type: string, format: date-time }
            timezone: { type: string }
        lastMessageAt:
          type: string
          format: date-time
          description: When the latest message, as of this walk, was written.
        lastFrom:
          type: string
          enum: [traveller, operator]
          description: Who wrote that message.
        unreadCount:
          type: integer
          description: The traveller's messages nobody at the business has marked read.

    OpenRequest:
      type: object
      properties:
        id: { type: string }
        slotId: { type: string }
        experience: { type: string }
        guests: { type: integer }
        startsAt: { type: string, format: date-time }
        timezone: { type: string }
        requestedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        contactName: { type: string }
        seatsGrantable:
          type: integer
          description: >-
            Seats still grantable on this departure before its physical
            capacity is reached. Shown beside the request because "accept" with
            no sense of what is left is a decision made blind.
        minutesToAnswer:
          type: integer
          description: Never negative. Computed server-side so every client agrees.

    RequestAnswer:
      type: object
      properties:
        id: { type: string }
        state:
          type: string
          description: "`active` after an accept, `released` after a decline."
        holdExpiresAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            Set on acceptance: the traveller now holds seats with a clock on
            them, and must pay before it lapses. Null on a decline.

    ListingQuestion:
      type: object
      additionalProperties: false
      description: >-
        One question a listing asks travellers. Its `text`, `answerType` and
        `options` never change once it exists: rewording a question gives it a
        new `id`, so every answer keeps the words it answered.
      required: [id, text, answerType, required]
      properties:
        id: { type: string }
        text:
          type: string
          maxLength: 200
          description: The question, as a traveller reads it.
        answerType:
          type: string
          enum: [short_text, choice, yes_no]
          description: >-
            `short_text` takes up to 300 characters of free text. `choice` takes
            exactly one of `options`. `yes_no` takes `yes` or `no`.
        options:
          type: array
          items: { type: string, maxLength: 60 }
          description: The choices, in the order shown. Present only on a `choice` question.
        required:
          type: boolean
          description: >-
            Whether you need an answer. A checkout that sends answers is refused
            until this question has one; a checkout that sends none is not, and
            its booking shows the question as not answered yet.

    ListingQuestions:
      type: object
      additionalProperties: false
      required: [questions]
      properties:
        questions:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/ListingQuestion" }

    ListingQuestionsInput:
      type: object
      additionalProperties: false
      required: [questions]
      properties:
        questions:
          type: array
          maxItems: 10
          description: Every question the listing should ask, in order. An empty list asks nothing.
          items:
            type: object
            additionalProperties: false
            required: [text, answerType]
            properties:
              id:
                type: string
                description: >-
                  A question this listing asks now, to keep it and its answers.
                  Leave it out to add a new question.
              text: { type: string, minLength: 1, maxLength: 200 }
              answerType: { type: string, enum: [short_text, choice, yes_no] }
              options:
                type: array
                minItems: 2
                maxItems: 10
                items: { type: string, minLength: 1, maxLength: 60 }
                description: Required on a `choice` question, and refused on the other types.
              required: { type: boolean, default: false }

    PartyQuestion:
      type: object
      additionalProperties: false
      description: >-
        One question as it stands for one party: the words they were asked, and
        their answer if they gave one. The manifest, the bookings list and a
        single booking send the same list for the same party.


        Every question the listing asks now comes first, in the listing's order,
        answered or not. After them comes any question this party answered that
        the listing no longer asks, with `current: false`, so an answer to a
        reworded question stays readable with the words it answered.
      required: [questionId, text, answerType, required, current, answered]
      properties:
        questionId: { type: string }
        text:
          type: string
          description: >-
            The words this party was asked. A question's words never change once
            it exists, so on an answered question these are the words the answer
            answered.
        answerType: { type: string, enum: [short_text, choice, yes_no] }
        options:
          type: array
          items: { type: string }
          description: Present only on a `choice` question.
        required: { type: boolean }
        current:
          type: boolean
          description: >-
            `false` when the listing no longer asks this question. Only an
            answered question appears with `current: false`.
        answered:
          type: boolean
          description: "`false` means not answered yet: a booking can be made without answers."
        answer:
          type: string
          description: >-
            Present when answered: `yes` or `no` for `yes_no`, one of `options`
            as the listing wrote it for `choice`, the traveller's own words for
            `short_text`.
        answeredAt: { type: string, format: date-time }

    PartyScreening:
      type: object
      description: >-
        Whether a party answered a listing's medical question. The manifest and
        the bookings list both send it, read from the same columns and rendered
        by the same function, so the two cannot answer differently about one
        party.


        **Never carries what anybody disclosed.** A manifest is read on a jetty,
        out loud, in front of other customers. The instructor needs to know a
        party was screened, not what they said.


        The interesting case is `needsAttention` on a party with
        `declared: false`. A booking is refused outright on a declared condition,
        so everybody booked declared clear. What can still go wrong is somebody
        arriving having never been asked.
      required: [declared, clear, needsAttention]
      properties:
        declared:
          type: boolean
          description: This party answered the screener.
        clear:
          type: boolean
          description: Their answer. Only meaningful when `declared`.
        needsAttention:
          type: boolean
          description: >-
            The one thing to highlight. Computed server-side so a phone, a
            printout and the admin console cannot disagree about who to stop.
        answeredVersion:
          type: integer
          description: >-
            The screener version answered. Reported, not compared: the listing
            carries no version of its own, so a "the question changed" flag would
            have nothing behind it.

    Manifest:
      type: object
      properties:
        slotId: { type: string }
        experience: { type: string }
        startsAt: { type: string, format: date-time }
        timezone: { type: string }
        meetingPoint: { type: string }
        status: { type: string, enum: [open, closed, cancelled] }
        calledOff:
          type: object
          description: Present only when the departure is off.
          properties:
            reasonCode: { type: string }
        parties:
          type: array
          items:
            type: object
            properties:
              bookingId: { type: string, description: Empty for a party still holding. }
              reference: { type: string }
              name: { type: string }
              guests: { type: integer }
              state:
                type: string
                description: "`holding` for a live hold; otherwise the booking's fulfilment state."
              arrived: { type: boolean }
              arrivedAt: { type: string, format: date-time }
              screening:
                allOf: [{ $ref: "#/components/schemas/PartyScreening" }]
                description: >-
                  **Present only on listings that ask a medical question.** Absent
                  means the question does not apply: a snorkel trip carrying an
                  empty screening object would invite a screen to render "not
                  screened" against a party nobody was ever going to ask, and a
                  false alarm on this signal teaches an instructor to skip the
                  column.
              questions:
                type: array
                items: { $ref: "#/components/schemas/PartyQuestion" }
                description: >-
                  What the listing asks travellers and what this party answered.
                  **Present only when there is something to show**: the listing
                  asks a question, or this party answered one. These questions
                  never ask about health, which stays with `screening`.
        totals:
          type: object
          description: >-
            Computed server-side so three clients cannot disagree about them on
            a dock. `seatsSold` and `seatsSoldOffline` answer different
            questions and are deliberately separate.
          properties:
            parties: { type: integer }
            guests: { type: integer }
            arrived: { type: integer }
            seatsSold: { type: integer }
            seatsSoldOffline: { type: integer }

    OfflineSaleResult:
      type: object
      properties:
        seatsRecorded: { type: integer }
        seatsRemaining:
          type: integer
          description: Never negative. An oversell is an incident, not a number on a screen.
        totalSoldOffline: { type: integer }
        oversold:
          type: object
          description: >-
            **Present means travellers who paid us now have no seat.** Do not
            render a success state when this is set.
          properties:
            guests: { type: integer }
            bookings: { type: array, items: { type: string } }
            message: { type: string }
            incidentId: { type: string }

    CallOffResult:
      type: object
      properties:
        slotId: { type: string }
        reasonCode: { type: string }
        bookingsCancelled: { type: integer }
        guestsAffected: { type: integer }
        refundedPaise: { type: integer, format: int64 }
        holdsReleased: { type: integer }

    BookingCancelResult:
      type: object
      required: [bookingId, reference, state, reasonCode, refundedPaise, seatsReleased]
      properties:
        bookingId: { type: string }
        reference: { type: string }
        state: { type: string, enum: [cancelled] }
        reasonCode:
          type: string
          enum: [weather, equipment, staffing, safety, insufficient_numbers]
        refundedPaise:
          type: integer
          format: int64
          description: >-
            Queued back to the traveller: everything captured online, which is 0
            for a booking to be paid in cash.
        seatsReleased:
          type: integer
          description: The party's guests, no longer counted against the departure.
        cashToGiveBackPaise:
          type: integer
          format: int64
          description: >-
            **Present only when you had already recorded taking this booking's
            cash.** We refund nothing on it because we took nothing, so this is
            money you hold that belongs to the traveller. Once you have given it
            back, record that with `POST /bookings/{id}/cash-returned`.
        note:
          type: string
          description: Present with `cashToGiveBackPaise`, saying the same thing in words.

    ChangeRequest:
      type: object
      properties:
        id: { type: string }
        kind: { type: string }
        state:
          type: string
          enum: [pending, objection_window, cooling, approved, rejected, withdrawn, applied]
          description: >-
            `objection_window` → an owner or an admin can still stop it and no
            human has looked. `pending` → the window closed without objection and it is
            awaiting review. `cooling` → approved but not yet live, and still
            stoppable. `applied` → live.
        summary: { type: string, description: Masked. Never a full account number. }
        requestedAt: { type: string, format: date-time }
        objectionUntil: { type: string, format: date-time, nullable: true }
        coolingUntil: { type: string, format: date-time, nullable: true }

    NotificationSettings:
      type: object
      required: [userId, name, switches, alwaysSent]
      description: >-
        One person's notification switches, every one of them, in the order a
        screen shows them. A switch nobody has changed is on.
      properties:
        userId: { type: string }
        name: { type: string }
        switches:
          type: array
          items: { $ref: "#/components/schemas/NotificationSwitch" }
        alwaysSent:
          type: string
          description: >-
            What cannot be turned off, in one sentence, so a screen of switches
            is not read as everything this person will be told. It names kinds of
            message rather than what this reader receives: several go to the
            owner alone.

    NotificationSwitch:
      type: object
      required: [group, label, description, on]
      properties:
        group: { $ref: "#/components/schemas/NotificationGroup" }
        label: { type: string, examples: ["Guest cancellations"] }
        description:
          type: string
          description: >-
            What the switch covers and who those messages go to. Every person
            sees every switch, so this is how a staff member can tell that a
            payout summary was never going to reach them.
        on: { type: boolean }
        changedAt:
          type: string
          format: date-time
          description: When somebody last changed it. Absent while nobody has.
        changedBy:
          type: object
          description: >-
            Who last changed it: the person themselves, or an OWNER or ADMIN of
            the business. Absent while nobody has, or once that person's own
            record is gone.
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }

    NotificationGroup:
      type: string
      description: One switch. A closed set, added to by contract change.
      enum:
        # New bookings, and seat requests that need an answer.
        - new_bookings
        # A traveller cancelled a booking they made.
        - guest_cancellations
        # The 06:00 summary of the day's booked departures.
        - todays_departures
        # A payout has been sent to the business's bank.
        - settlement_summary
        # A document we require of the business expires within 30 days.
        - document_expiry

    NotificationSwitchChanges:
      type: object
      required: [switches]
      properties:
        switches:
          type: array
          minItems: 1
          description: The switches to change. Any not named are left as they are.
          items:
            type: object
            required: [group, on]
            properties:
              group: { $ref: "#/components/schemas/NotificationGroup" }
              on: { type: boolean }

    TeamMember:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        roles: { type: array, items: { type: string, enum: [OWNER, ADMIN, MANAGER, STAFF] } }
        state: { type: string }
        pending:
          type: boolean
          description: An invitation nobody has accepted yet. `id` is the invitation, not a user.
        lastSeenAt: { type: string, format: date-time }
        phoneMasked:
          type: string
          examples: ["••••0132"]
          description: >-
            The last four digits of the number this person signs in with, or
            that an unaccepted invitation was sent to.


            **Why the list carries a number at all.** An invitation is the only
            way into an operator account that starts with a human typing a
            number, so it is the only place a typo grants access — at STAFF,
            every departure's manifest; at MANAGER, capacity, closed dates,
            earnings and call-off. Without something to check against, an owner
            sees "Ramesh Toppo · Invited" and cannot tell that the last two
            digits were transposed at six in the morning.


            **Why only four.** Enough to catch a transposition, not enough to
            be a directory of an operator's staff. The full number is masked in
            SQL and never enters the API process, so it cannot reach a log line
            or an error string by accident.

    AccountStanding:
      type: object
      description: >-
        Why this operator can or cannot sell, and **who has to move next**.


        Derived on every read rather than stored. A stored status is a second
        copy of the truth that goes stale the moment a credential expires on its
        own — and expiry is exactly the case nobody remembers to write an update
        for.
      required: [state, bookable, blocking]
      properties:
        state:
          type: string
          description: The operator's commercial status.
          examples: ["ONBOARDING", "LIVE", "PAUSED"]
        bookable:
          type: boolean
          description: >-
            Whether a traveller can book them right now. `LIVE` is the only
            status that means yes; everything else, `PAUSED` included, is a no
            with a different reason. A suspended business is never bookable,
            whatever its status reads.
        blocking:
          type: array
          description: Empty only when nothing is outstanding.
          items: { $ref: "#/components/schemas/Blocker" }
        credentials:
          type: array
          items: { $ref: "#/components/schemas/OperatorCredential" }
        requiredDocuments:
          type: array
          description: >-
            Every document this business must hold to sell, met or not, so a
            screen can say "5 of 6" rather than guess the 6. It is the set the
            go-live check counts: what your market requires of every business,
            plus what the categories and activities you have published listings
            in require, so it can grow when a listing in a new category is
            approved.


            `satisfied` means a verified copy is in date today, in your market's
            calendar. A document that is not satisfied always has a
            `CREDENTIAL_*` entry in `blocking` saying why. For a category you do
            not sell in yet, ask `GET /credential-requirements`.
          items:
            type: object
            required: [type, satisfied]
            properties:
              type:
                type: string
                enum: [directorate_registration, instructor_cert, oxygen, equipment, boat, insurance, bank, gst]
              satisfied: { type: boolean }
        suspension:
          type: object
          description: >-
            Present exactly while the business is suspended (D20), or while its
            status is `OFFBOARDED` or `DISQUALIFIED` (D44), and absent
            otherwise: what happened, since when, what our staff wrote, and what
            still works. The reason an admin recorded is not here. It is written
            for our audit trail and can name a third party.
          required: [message, stillAllowed]
          properties:
            since:
              type: string
              format: date-time
              description: >-
                When the suspension, or the closed status, began. Absent when no
                record shows the moment, rather than a guessed one.
            message:
              type: string
              description: >-
                The owner's sentence for the status, which every refused write
                answers with too, so a banner and a tapped button never
                disagree: "Your account has been suspended. Please reach out to
                admin for help.", or "Your account has been closed. Please reach
                out to admin for help." for `OFFBOARDED`, or "Your account has
                been disqualified. Please reach out to admin for help." for
                `DISQUALIFIED`.
            adminMessage:
              type: string
              description: >-
                What our staff wrote to the business when they suspended it
                (D38), to show under `message`. Absent when they wrote nothing.
                It lasts as long as the suspension it was written for, and is
                gone once the status changes. Written by a person, so show it as
                plain text.
            stillAllowed:
              type: string
              description: >-
                What keeps working, as a sentence to show under the message:
                everything can still be read, the trips already booked can still
                be run or stopped with anything paid online refunded in full,
                and the team, a bank change and documents can still be dealt
                with.

    Blocker:
      type: object
      required: [code, label, waitingOn, gates]
      properties:
        gates:
          type: boolean
          description: >-
            Whether this actually stops a sale, as opposed to being outstanding.


            **Render the whole list either way.** A missing logo and an
            unfinished registered address are real asks and belong on the
            screen; neither appears in the sellability predicate, which tests
            published, priced, operator LIVE, kill switches and credentials and
            nothing else.


            Apart from a status that is not `LIVE` and a suspension, each of
            which has an `OPERATOR_*` entry of its own, `bookable` above is
            false only when something here has `gates: true`. It previously
            went false for ANY outstanding item,
            which told an operator with three listings selling in the feed that
            they could not be booked — so a client that hides this list on
            `bookable` will now hide it exactly when it is most useful. Gate the
            list on `blocking` being non-empty instead.
        code:
          type: string
          description: >-
            A closed set, so a client branches on the code and never on the
            message — the same rule the error enum follows. `OTHER` exists so a
            reason can be added operationally without a contract change and
            without breaking a client: render `label` for anything you do not
            recognise, including `OTHER`.
          enum:
            - BUSINESS_DETAILS_INCOMPLETE
            - LOGO_MISSING
            - CREDENTIAL_MISSING
            - CREDENTIAL_UNVERIFIED
            - CREDENTIAL_EXPIRED
            - CREDENTIAL_REJECTED
            - AWAITING_REVIEW
            # The status itself when it is not LIVE: paused, suspended, or
            # closed (disqualified or offboarded). OPERATOR_SUSPENDED is also a
            # suspension recorded against the account (D20). OPERATOR_SUSPENDED
            # and OPERATOR_CLOSED are labelled with the owner's sentence for the
            # status (D44); the detail is in `AccountStanding.suspension`.
            - OPERATOR_PAUSED
            - OPERATOR_SUSPENDED
            - OPERATOR_CLOSED
            - OTHER
        label:
          type: string
          description: Human-readable and safe to show unmodified.
          examples: ["We still need your insurance certificate"]
        since: { type: string, format: date-time }
        waitingOn:
          type: string
          enum: [operator, yuvoy]
          description: >-
            **The field that stops the phone call.** "Pending" because we are
            slow and "pending" because they have sent nothing read identically,
            and an operator who cannot tell which has no choice but to ring
            somebody.
      
    OperatorCredential:
      type: object
      description: A document Yuvoy holds, or is waiting for.
      required: [id, type, state, mandatory, hasFile]
      properties:
        id:
          type: string
          description: What an upload names, on `POST /credentials/{id}/upload-intents`.
        type: { type: string, examples: ["directorate_registration", "insurance"] }
        hasFile:
          type: boolean
          description: >-
            Whether a file is on record for this document. Sent on every row, so
            a screen offers an upload or shows the file without inferring either
            from a field being absent.
        filename:
          type: string
          description: The file's name as it was on the operator's device. Present only when `hasFile` is true.
        sizeBytes:
          type: integer
          format: int64
          description: Present only when `hasFile` is true.
        state: { type: string, enum: [pending, verified, rejected, expired] }
        mandatory:
          type: boolean
          description: Whether the account can go LIVE without it.
        issuer: { type: string }
        expiresOn:
          type: string
          format: date
          description: >-
            A date, not an instant. A licence expires on a day, and sending a
            timestamp invites a timezone bug on the one field an operator plans
            a season around.
        verifiedAt: { type: string, format: date-time }

    OperatorBooking:
      type: object
      properties:
        id: { type: string }
        reference: { type: string }
        state: { type: string }
        guests: { type: integer }
        experience: { type: string }
        slot:
          type: object
          properties:
            startsAt: { type: string, format: date-time }
            timezone: { type: string }
        contact:
          type: object
          description: >-
            The name, and only the name. `whatsapp` was here and was **removed
            in M13** per D-018: a traveller gives us a number so we can tell
            them about their booking, not so it can be added to an operator's
            contacts.


            To reach this traveller, use `POST /bookings/{id}/relay`. To
            identify them at the jetty, use `reference` — they have it in every
            message we send and on their status page, and it is already read
            aloud on a dock.
          properties:
            name: { type: string }
        createdAt: { type: string, format: date-time }
        cash:
          type: object
          description: >-
            **Present only when the traveller is paying you at the counter.**
            Absent means they have already paid us and you collect nothing.


            Without this you cannot tell a cash booking from a card one, and
            `paid_pending_ops` reads as "payment clearing" — which on a cash
            booking is the opposite of the truth. Nothing is clearing. You are
            the one who has to collect, and the booking is not settled until
            you record it.


            `collected: false` is the ACTIONABLE state — it is what puts this
            booking on somebody's list for the morning. Record it with
            `POST /bookings/{id}/cash-collected`.


            Note `collectPaise` is the FARE and is not the same number as
            `money.grossPaise`, which is what WE captured — zero here, for the
            whole life of the booking, because the money never passes through
            us.
          required: [collectPaise, collected]
          properties:
            collectPaise:
              type: integer
              description: What to take from them, in INR paise.
            collected:
              type: boolean
              description: Whether you have recorded taking it.
            collectedAt: { type: string, format: date-time }
            collectedPaise:
              type: integer
              description: >-
                What you reported taking, which may be less than the fare if you
                gave them something off.
            returnedAt:
              type: string
              format: date-time
              description: >-
                When you recorded giving this cash back, on a booking cancelled
                after you took it, with `POST /bookings/{id}/cash-returned`.
                Absent until then.
            returnedPaise:
              type: integer
              description: >-
                What you recorded giving back, which is all of `collectedPaise`.
                Present with `returnedAt`.
        money:
          type: object
          description: >-
            What this one booking contributed, so an operator asking "why is
            this two hundred rupees less than I expected" can answer it here
            rather than by messaging us.


            **A cancelled or declined booking earns us nothing.** On one,
            `commissionPaise` is 0 and `netPaise` is `grossPaise - refundsPaise`,
            what was paid less what went back. On a cancelled card booking, a
            payout pays you that net when it is above zero: see
            `GET /settlements/overview`. `/earnings` leaves cancelled and
            declined bookings out altogether, so what follows about matching it
            is about bookings that are on.


            **For a booking that is on, these are the same frozen figures
            `/earnings` sums**, not a
            recomputation. Commission was frozen on this booking at capture, so
            a rate change today cannot restate what was earned last week, and
            this object cannot disagree with the total for arithmetic reasons.


            **It can disagree for a window reason, and that is deliberate.**
            `/earnings` selects on `created_at` — when the money moved — while
            this list selects on the slot's `startsAt`, which is when the trip
            runs. A booking made in March for a trip in April belongs to
            March's earnings and April's manifest. So summing a screenful of
            these will NOT reproduce an earnings total unless the two windows
            were asked the same question. Reconcile one booking against itself,
            not a page against a period.


            Absent on a booking that never captured — a `pending_request`
            awaiting its operator has moved no money and has none of this.
          properties:
            grossPaise:
              type: integer
              format: int64
              description: What the traveller was actually charged, at capture.
            commissionPaise:
              type: integer
              format: int64
              description: >-
                Yuvoy's cut, frozen at capture against the rate in force then.
                0 on a cancelled or declined booking, which earns us nothing.
            refundsPaise:
              type: integer
              format: int64
              description: >-
                Refunds against this booking that are requested, pending or
                processed. Live rather than frozen: a refund raised today
                changes what is owed, and hiding that until settlement would
                make the screen wrong in the operator's favour.
            netPaise:
              type: integer
              format: int64
              description: >-
                `grossPaise - commissionPaise - refundsPaise`. Sent rather than
                left to the client so that every surface subtracts in the same
                order and no screen can invent a different answer.
          required: [grossPaise, commissionPaise, refundsPaise, netPaise]
        cancellation:
          type: object
          description: >-
            **Present only on a booking that was cancelled or declined**: when it
            ended, who ended it, and why. Absent on every other booking.


            Read from what every path that ends a booking already records, never
            inferred: the traveller cancelling from their booking link, you
            cancelling one booking or calling the departure off, us calling it
            off (one departure, or every departure on a day), our team cancelling
            or declining the booking,
            and a payment that arrived after the seats were gone or the departure
            was off.


            What went back to the traveller is `money.refundsPaise`, against
            `money.grossPaise` taken. It is not repeated here, so a booking has
            one refund figure.


            Never a note our team wrote, and never anything about a traveller's
            health: those can carry things about a person that are not yours to
            read.
          required: [at]
          properties:
            at:
              type: string
              format: date-time
              description: When it was cancelled or declined.
            by:
              type: string
              enum: [traveller, operator, yuvoy, system]
              description: >-
                Who ended it. `operator` is your own team and `yuvoy` is ours.
                `system` is a payment we could not honour when it arrived: the
                booking was declined as it was made, and anything taken was
                refunded in full. Absent only if no record says who.
            reasonCode:
              type: string
              description: >-
                The reason recorded on the booking. A closed set, so a client can
                branch on it; if you meet a value you do not recognise, say the
                booking was cancelled, and by whom.


                `SAFETY` covers any judgement that the trip was not safe for this
                party, including one about their health, which is never reported
                more precisely than that.
              enum:
                # The traveller asked. `by` says whether they did it themselves
                # from their booking link or our team did it for them.
                - CUSTOMER_REQUEST
                - TRAVELLER_REQUEST
                # The departure was called off; `calledOff` says why.
                - OPERATOR_CALLED_OFF
                # The traveller cancelled from their link after you moved the
                # departure, so they got back everything they paid online
                # whatever the usual tiers say. `by` is `traveller`.
                - OPERATOR_MOVED_IT
                # With `by: operator`, your team cancelled this one booking and
                # `operatorCancelled` says why. With `by: yuvoy`, one of our
                # team's reasons about the operator, as are the three below.
                - OPERATOR_CANCELLED
                - OPERATOR_DISHONOUR
                - OPERATOR_UNREACHABLE
                - CREDENTIAL_LAPSE
                # A payment that arrived after we had stopped selling your
                # departures.
                - OPERATOR_NOT_SELLABLE
                - CAPACITY_LOST
                - PAYMENT_FAILED
                - WEATHER
                - SAFETY
                # Our mistake.
                - ADMIN_ERROR
            calledOff:
              type: object
              description: >-
                Present when it ended because its departure was called off, with
                the call-off's own reason: the same object as the manifest's
                `calledOff`.
              required: [reasonCode]
              properties:
                reasonCode:
                  type: string
                  enum: [weather, equipment, staffing, safety, insufficient_numbers]
            operatorCancelled:
              type: object
              description: >-
                Present when your own team cancelled this one booking with
                `POST /bookings/{id}/cancel`, with the reason given: the same
                list a call-off takes.
              required: [reasonCode]
              properties:
                reasonCode:
                  type: string
                  enum: [weather, equipment, staffing, safety, insufficient_numbers]
        screening:
          allOf: [{ $ref: "#/components/schemas/PartyScreening" }]
          description: >-
            This party's screening, exactly as `GET /slots/{id}/manifest` sends
            it for the same party. **Present only when the listing asks a
            medical question**, and never what anybody disclosed.
        questions:
          type: array
          items: { $ref: "#/components/schemas/PartyQuestion" }
          description: >-
            What the listing asks travellers and what this party answered,
            exactly as `GET /slots/{id}/manifest` sends it for the same party.
            **Present only when there is something to show**: the listing asks a
            question, or this party answered one.
