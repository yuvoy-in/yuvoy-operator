name: CI

# Runs on every pull request into `main` or `dev`, and by hand.
#
# The `main` and `dev` rulesets require `verify` to pass on the exact
# head, with the branch level with its base, before a pull request can merge
# (yuvoy-mobile#403, decision D-052). `main` deploys to production on every
# push, so this is the check standing between a merge and the live site.
#
# This was manual only from 14 Aug 2026, to save Actions minutes. That budget
# belongs to the org's private repositories: this repository is public, so its
# GitHub-hosted runs cost nothing. The pre-push hook (`pnpm verify`) still runs
# the same suite before anything leaves the machine; this is the second opinion
# on a machine that is not the author's.
#
#     gh workflow run CI --ref <branch>
on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      # typecheck · lint · format · qa · tokens · test · contract · build · e2e
      #
      # `pnpm tokens:check` warns rather than fails here: it diffs against
      # ../yuvoy-app, which a single-repo checkout does not have. The check that
      # matters runs on the machine where both repos live.
      - run: pnpm verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
