# operators.yuvoy.in: a MANUAL redeploy, and nothing else.
#
# Vercel's Git integration deploys `main` on every push (connected 20 Sep
# 2026), so this workflow no longer runs on push. For four days it did both:
# every release deployed production twice, and the two builds raced for the
# domain.
#
# Its own Vercel project and its own origin: D-102 puts the operator portal on
# a separate origin from the traveller app deliberately, and the two are
# different security surfaces (see next.config.ts).
name: Production deployment

on:
  # Manual redeploy. Environment values are read at BUILD time, so changing one
  # in Vercel does nothing until a rebuild. Vercel's own Redeploy button does
  # the same job.
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/_deploy.yml
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
